<!DOCTYPE html>
<html lang="uz">
<head>
    {% include 'partials/i18n/_head.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tölov — {{ test.lesson.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
    /* Saytdagi tema tanlovini FOUC bölmasdan qöllaş (base.html bilan bir xil kalit) */
    (function () {
        var t = 'light';
        try { t = localStorage.getItem('theme') || 'light'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
    })();
    </script>
    <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ─────────────── TOKENS: light (default) / dark ─────────────── */
    :root {
        --bg:          #f1f2f8;
        --panel:       #ffffff;
        --panel-2:     #f5f6fa;
        --panel-3:     #eceef5;
        --border:      rgba(15, 23, 42, .10);
        --border-soft: rgba(15, 23, 42, .06);
        --text:        #101322;
        --muted:       #5b6478;
        --muted-2:     #98a0b3;

        --accent:      #e11d48;          /* yakuniy test — qizil aksent */
        --on-accent:   #ffffff;
        --accent-soft: rgba(225, 29, 72, .08);
        --accent-ring: rgba(225, 29, 72, .20);

        --success:      #16a34a;
        --success-soft: rgba(22, 163, 74, .10);
        --warn:         #d97706;
        --warn-soft:    rgba(217, 119, 6, .10);

        --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05);
        --shadow-md: 0 10px 30px -12px rgba(15, 23, 42, .20);

        --r-lg: 22px;
        --r-md: 14px;
        --r-sm: 10px;
        --ease: cubic-bezier(.4, 0, .2, 1);
    }
    [data-theme="dark"] {
        --bg:          #0b0d13;
        --panel:       #12141d;
        --panel-2:     #181b26;
        --panel-3:     #1f2331;
        --border:      rgba(255, 255, 255, .10);
        --border-soft: rgba(255, 255, 255, .06);
        --text:        #e9ebf3;
        --muted:       #9aa2b6;
        --muted-2:     #6a7288;

        --accent:      #fb7185;
        --on-accent:   #2a0b13;
        --accent-soft: rgba(251, 113, 133, .12);
        --accent-ring: rgba(251, 113, 133, .26);

        --success:      #34d399;
        --success-soft: rgba(52, 211, 153, .12);
        --warn:         #fbbf24;
        --warn-soft:    rgba(251, 191, 36, .12);

        --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35);
        --shadow-md: 0 10px 30px -12px rgba(0, 0, 0, .55);
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100vh;
    }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* ─────────────── LAYOUT ─────────────── */
    .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
    }
    .topbar {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 1.25rem;
    }
    .back-link {
        display: inline-flex; align-items: center; gap: 0.5rem;
        padding: 0.55rem 1rem;
        border-radius: 12px;
        border: 1px solid var(--border-soft);
        background: var(--panel);
        color: var(--muted); text-decoration: none;
        font-size: 0.86rem; font-weight: 600;
        transition: color .15s, border-color .15s;
    }
    .back-link:hover { color: var(--text); border-color: var(--border); }
    .theme-toggle {
        width: 40px; height: 40px;
        border-radius: 12px; cursor: pointer; border: 1px solid var(--border-soft);
        background: var(--panel); color: var(--muted);
        display: flex; align-items: center; justify-content: center;
        font-size: 1rem;
        transition: color .15s;
    }
    .theme-toggle:hover { color: var(--accent); }

    /* ─────────────── CARD ─────────────── */
    .card {
        border-radius: var(--r-lg);
        border: 1px solid var(--border-soft);
        background: var(--panel);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
        animation: cardIn .4s var(--ease);
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .card-head {
        padding: 1.75rem 1.75rem 1.4rem;
        text-align: center;
        border-bottom: 1px solid var(--border-soft);
    }
    .head-icon {
        width: 60px; height: 60px;
        margin: 0 auto 0.9rem;
        border-radius: 18px;
        display: flex; align-items: center; justify-content: center;
        background: var(--accent-soft); color: var(--accent);
        font-size: 1.6rem;
    }
    .card-head h1 { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.01em; }
    .card-head p { margin-top: 0.3rem; font-size: 0.85rem; color: var(--muted); }

    /* ─────────────── STEPPER ─────────────── */
    .stepper {
        display: flex;
        padding: 1.1rem 1.25rem;
        border-bottom: 1px solid var(--border-soft);
        background: var(--panel-2);
    }
    .step {
        flex: 1; position: relative;
        display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
    }
    .step:not(:last-child)::after {
        content: '';
        position: absolute; top: 16px; left: calc(50% + 22px); right: calc(-50% + 22px);
        height: 2px; border-radius: 2px;
        background: var(--border);
    }
    .step.done:not(:last-child)::after { background: var(--success); }
    .step-dot {
        width: 32px; height: 32px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 0.85rem; z-index: 1;
        background: var(--panel); color: var(--muted-2);
        border: 2px solid var(--border);
    }
    .step.done .step-dot { background: var(--success); border-color: var(--success); color: #fff; }
    .step.now .step-dot {
        background: var(--accent); border-color: var(--accent); color: var(--on-accent);
        box-shadow: 0 0 0 4px var(--accent-ring);
    }
    .step.wait .step-dot { background: var(--warn); border-color: var(--warn); color: #fff; }
    .step-lbl {
        font-size: 0.64rem; font-weight: 600; text-align: center;
        color: var(--muted-2); line-height: 1.3; max-width: 76px;
    }
    .step.done .step-lbl { color: var(--success); }
    .step.now .step-lbl { color: var(--accent); font-weight: 700; }
    .step.wait .step-lbl { color: var(--warn); }

    .card-body { padding: 1.5rem 1.5rem 1.75rem; }

    /* ─────────────── NARX ─────────────── */
    .price {
        display: flex; align-items: center; justify-content: space-between; gap: 1rem;
        padding: 1rem 1.25rem;
        border-radius: var(--r-md);
        background: var(--accent-soft);
        border: 1px solid var(--accent-ring);
        margin-bottom: 1.25rem;
    }
    .price-lbl { font-size: 0.82rem; font-weight: 600; color: var(--muted); }
    .price-val {
        font-size: 1.5rem; font-weight: 800; color: var(--accent);
        font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .price-val small { font-size: 0.85rem; font-weight: 700; }

    /* ─────────────── KARTALAR ─────────────── */
    .pay-cards-lbl {
        font-size: 0.7rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: .08em;
        color: var(--muted-2);
        margin-bottom: 0.6rem;
    }
    .pay-card {
        display: flex; align-items: center; gap: 0.85rem;
        padding: 0.8rem 0.9rem;
        border-radius: var(--r-md);
        border: 1px solid var(--border-soft);
        background: var(--panel-2);
        margin-bottom: 0.55rem;
    }
    .pay-brand {
        flex-shrink: 0;
        min-width: 64px; text-align: center;
        padding: 0.32rem 0.55rem;
        border-radius: 8px;
        font-size: 0.68rem; font-weight: 800; letter-spacing: .06em;
        color: #fff;
    }
    .pay-brand.uzcard { background: #1e6fd9; }
    .pay-brand.humo   { background: #e8842c; }
    .pay-brand.visa   { background: #1a1f71; }
    .pay-num {
        flex: 1; min-width: 0;
        font-family: 'Courier New', ui-monospace, monospace;
        font-size: 0.98rem; font-weight: 700; letter-spacing: .06em;
        color: var(--text);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .copy-btn {
        flex-shrink: 0;
        display: inline-flex; align-items: center; gap: 0.35rem;
        padding: 0.42rem 0.75rem;
        border-radius: 9px; border: 1px solid var(--border-soft);
        background: var(--panel); color: var(--muted);
        font-size: 0.74rem; font-weight: 700;
        cursor: pointer;
        transition: color .15s, border-color .15s, background .15s;
    }
    .copy-btn:hover { color: var(--accent); border-color: var(--accent-ring); }
    .copy-btn.copied { background: var(--success-soft); border-color: var(--success); color: var(--success); }
    .pay-owner {
        font-size: 0.8rem; color: var(--muted);
        margin: 0.5rem 0 1.4rem; text-align: center;
    }
    .pay-owner strong { color: var(--text); }

    /* ─────────────── QADAMLAR ─────────────── */
    .howto {
        border-radius: var(--r-md);
        border: 1px solid var(--border-soft);
        padding: 0.35rem 0;
        margin-bottom: 1.4rem;
    }
    .howto-item {
        display: flex; align-items: flex-start; gap: 0.8rem;
        padding: 0.65rem 1rem;
    }
    .howto-item + .howto-item { border-top: 1px solid var(--border-soft); }
    .howto-n {
        width: 24px; height: 24px; flex-shrink: 0;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        background: var(--accent-soft); color: var(--accent);
        font-size: 0.72rem; font-weight: 800;
        margin-top: 1px;
    }
    .howto-t { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
    .howto-t strong { color: var(--text); }

    /* ─────────────── YUKLAŞ ─────────────── */
    .upload {
        position: relative;
        border: 2px dashed var(--border);
        border-radius: var(--r-md);
        padding: 1.6rem 1rem;
        text-align: center; cursor: pointer;
        margin-bottom: 1rem;
        transition: border-color .2s, background .2s;
    }
    .upload:hover { border-color: var(--accent); background: var(--accent-soft); }
    .upload.picked { border-color: var(--success); background: var(--success-soft); border-style: solid; }
    .upload input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .upload-ic { font-size: 2rem; color: var(--muted-2); transition: color .2s; }
    .upload:hover .upload-ic { color: var(--accent); }
    .upload.picked .upload-ic { color: var(--success); }
    .upload-preview {
        display: none;
        max-height: 150px; max-width: 100%;
        border-radius: 10px; margin: 0 auto 0.6rem;
    }
    .upload.picked .upload-preview { display: block; }
    .upload.picked .upload-ic { display: none; }
    .upload-t { font-weight: 700; font-size: 0.9rem; margin-top: 0.4rem; word-break: break-all; }
    .upload.picked .upload-t { color: var(--success); }
    .upload-hint { font-size: 0.76rem; color: var(--muted-2); margin-top: 0.2rem; }

    .submit-btn {
        display: flex; align-items: center; justify-content: center; gap: 0.6rem;
        width: 100%; padding: 0.9rem;
        border: none; border-radius: var(--r-md); cursor: pointer;
        background: var(--accent); color: var(--on-accent);
        font-family: inherit; font-size: 0.95rem; font-weight: 800;
        transition: opacity .15s, transform .15s var(--ease);
    }
    .submit-btn:hover { opacity: .92; }
    .submit-btn:active { transform: scale(.985); }
    .submit-btn:disabled { opacity: .55; cursor: not-allowed; }

    /* ─────────────── HOLATLAR ─────────────── */
    .status {
        text-align: center;
        padding: 2rem 1.25rem;
        border-radius: var(--r-md);
    }
    .status-ic {
        width: 68px; height: 68px;
        margin: 0 auto 1rem;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.9rem;
    }
    .status h2 { font-size: 1.05rem; font-weight: 800; margin-bottom: 0.4rem; }
    .status p { font-size: 0.86rem; color: var(--muted); line-height: 1.6; max-width: 340px; margin: 0 auto; }

    .status.ok { background: var(--success-soft); }
    .status.ok .status-ic { background: var(--success); color: #fff; }
    .status.ok .go-btn {
        display: inline-flex; align-items: center; gap: 0.5rem;
        margin-top: 1.25rem; padding: 0.75rem 2rem;
        border-radius: var(--r-md); text-decoration: none;
        background: var(--success); color: #fff;
        font-weight: 800; font-size: 0.92rem;
        transition: opacity .15s, transform .15s;
    }
    .status.ok .go-btn:hover { opacity: .92; transform: translateY(-1px); }

    .status.wait { background: var(--warn-soft); }
    .status.wait .status-ic {
        background: var(--warn); color: #fff;
        animation: waitTilt 2.6s ease-in-out infinite;
    }
    @keyframes waitTilt { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(9deg); } 75% { transform: rotate(-9deg); } }

    /* ─────────────── RAD ETILGAN BANNER ─────────────── */
    .rejected-note {
        display: flex; align-items: flex-start; gap: 0.7rem;
        padding: 0.85rem 1rem;
        border-radius: var(--r-md);
        border: 1px solid var(--accent-ring);
        background: var(--accent-soft);
        font-size: 0.84rem; line-height: 1.55;
        color: var(--muted);
        margin-bottom: 1.25rem;
    }
    .rejected-note i { color: var(--accent); font-size: 1.1rem; flex-shrink: 0; margin-top: 1px; }
    .rejected-note strong { color: var(--text); display: block; }
    .rejected-note .reason { color: var(--accent); font-weight: 600; }

    /* ─────────────── TOAST ─────────────── */
    .toast {
        position: fixed; bottom: 22px; left: 50%;
        transform: translateX(-50%) translateY(70px);
        display: flex; align-items: center; gap: 0.5rem;
        padding: 0.6rem 1.15rem;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-md);
        color: var(--text); font-size: 0.84rem; font-weight: 600;
        z-index: 100; pointer-events: none;
        opacity: 0;
        transition: opacity .25s, transform .25s var(--ease);
    }
    .toast.show { opacity: 1; transform: translateX(-50%); }
    .toast i { color: var(--success); }

    /* ─────────────── RESPONSIVE ─────────────── */
    @media (max-width: 480px) {
        .wrap { padding: 1.1rem 0.75rem 2rem; }
        .card-head { padding: 1.4rem 1rem 1.1rem; }
        .card-body { padding: 1.15rem 1rem 1.4rem; }
        .stepper { padding: 0.9rem 0.5rem; }
        .step-lbl { max-width: 62px; font-size: 0.6rem; }
        .price-val { font-size: 1.3rem; }
        .pay-card { flex-wrap: wrap; row-gap: 0.5rem; }
        .pay-num { flex-basis: 100%; order: 3; text-align: center; }
        .copy-btn { margin-left: auto; }
    }
    </style>
</head>
<body>
    <div class="wrap">

        <div class="topbar">
            <a href="{% url 'lesson_view' test.lesson.pk %}" class="back-link">
                <i class="bi bi-arrow-left"></i> Orqaga
            </a>
            <button type="button" class="theme-toggle" id="themeToggle" title="Tema">
                <i class="bi bi-moon-stars" id="themeIcon"></i>
            </button>
        </div>

        <div class="card">
            <div class="card-head">
                <div class="head-icon"><i class="bi bi-credit-card-2-front"></i></div>
                <h1>Yakuniy test tölovi</h1>
                <p>{{ test.lesson.title }} — {{ test.lesson.profession.name }}</p>
            </div>

            <!-- Jarayon -->
            <div class="stepper">
                <div class="step done">
                    <div class="step-dot"><i class="bi bi-check-lg"></i></div>
                    <div class="step-lbl">Test topşirildi</div>
                </div>
                <div class="step {% if approved_payment %}done{% elif pending_payment %}wait{% else %}now{% endif %}">
                    <div class="step-dot"><i class="bi bi-credit-card"></i></div>
                    <div class="step-lbl">Tölov</div>
                </div>
                <div class="step {% if approved_payment %}done{% elif pending_payment %}now{% endif %}">
                    <div class="step-dot"><i class="bi bi-patch-check"></i></div>
                    <div class="step-lbl">Tasdiqlaş</div>
                </div>
                <div class="step {% if approved_payment %}now{% endif %}">
                    <div class="step-dot"><i class="bi bi-arrow-repeat"></i></div>
                    <div class="step-lbl">Qayta topşiriş</div>
                </div>
            </div>

            <div class="card-body">
                {% include 'accounts/includes/exam_checkout.html' %}

            </div>
        </div>
    </div>

    <div class="toast" id="toast"><i class="bi bi-check-circle-fill"></i><span id="toastText"></span></div>

    <script>
    (function () {
        'use strict';

        /* ── Tema almaştiriş (base.html bilan bir xil localStorage kaliti) ── */
        var toggle = document.getElementById('themeToggle');
        var icon = document.getElementById('themeIcon');
        function syncIcon() {
            var dark = document.documentElement.getAttribute('data-theme') === 'dark';
            icon.className = dark ? 'bi bi-sun' : 'bi bi-moon-stars';
        }
        syncIcon();
        toggle.addEventListener('click', function () {
            var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            syncIcon();
        });

        /* ── Toast ── */
        var toast = document.getElementById('toast');
        var toastText = document.getElementById('toastText');
        var toastTimer = null;
        function showToast(msg) {
            toastText.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
        }

        /* ── Karta raqamini nusxalaş ── */
        function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            }
            return new Promise(function (resolve, reject) {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.cssText = 'position:fixed;opacity:0;';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy') ? resolve() : reject(); }
                catch (e) { reject(e); }
                finally { ta.remove(); }
            });
        }
        document.querySelectorAll('.copy-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                copyText(btn.dataset.card).then(function () {
                    btn.classList.add('copied');
                    btn.innerHTML = '<i class="bi bi-check-lg"></i> Nusxalandi';
                    showToast('Karta raqami nusxalandi');
                    setTimeout(function () {
                        btn.classList.remove('copied');
                        btn.innerHTML = '<i class="bi bi-copy"></i> Nusxa';
                    }, 2000);
                }).catch(function () {
                    showToast('Nusxalab bölmadi — qölda kiriting');
                });
            });
        });

        /* ── Çek yuklaş: preview + nom ── */
        var input = document.getElementById('receiptInput');
        if (input) {
            var area = document.getElementById('uploadArea');
            var text = document.getElementById('uploadText');
            var preview = document.getElementById('uploadPreview');
            var form = document.getElementById('payForm');
            var submitBtn = document.getElementById('submitBtn');

            input.addEventListener('change', function () {
                var f = this.files && this.files[0];
                if (f) {
                    text.textContent = f.name;
                    area.classList.add('picked');
                    if (f.type.indexOf('image/') === 0) {
                        preview.src = URL.createObjectURL(f);
                    }
                } else {
                    text.textContent = "Tölov çekini yuklang";
                    area.classList.remove('picked');
                    preview.removeAttribute('src');
                }
            });

            form.addEventListener('submit', function () {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Yuborilmoqda…';
            });
        }
    })();
    </script>
</body>
</html>
