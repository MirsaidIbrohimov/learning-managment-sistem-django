<!DOCTYPE html>
<html lang="uz" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Kirish taqiqlangan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --bg:#f0f4f8; --card:#ffffff; --text:#1e293b; --muted:#64748b; --tip-bg:#f8f9fa; --tip-border:#e2e8f0; }
        [data-bs-theme="dark"] { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --tip-bg:#1a2332; --tip-border:#334155; }
        body { background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;padding:20px; }
        .err-card { background:var(--card);border-radius:24px;padding:50px 40px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.1);max-width:520px;width:100%; }
        .err-code { font-size:5rem;font-weight:800;background:linear-gradient(135deg,#ef4444,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:0.5rem; }
        .err-icon { font-size:3rem;color:#ef4444;margin-bottom:1rem; }
        .err-icon i { animation:shake 0.6s ease-in-out; }
        @keyframes shake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
        .tips { background:var(--tip-bg);border:1px solid var(--tip-border);border-radius:14px;padding:18px;text-align:left;margin:1.5rem 0; }
        .tips h6 { font-weight:700;margin-bottom:10px;font-size:0.88rem; }
        .tips ol { padding-left:1.2rem;margin:0; }
        .tips li { padding:5px 0;font-size:0.86rem;color:var(--muted); }
        .tips li strong { color:var(--text); }
        .btn-course { background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;padding:14px 32px;border-radius:12px;font-weight:600;color:white;transition:all 0.3s; }
        .btn-course:hover { transform:translateY(-2px);box-shadow:0 10px 30px rgba(99,102,241,0.4);color:white; }
        .btn-back { background:transparent;border:2px solid var(--tip-border);padding:14px 32px;border-radius:12px;font-weight:600;color:var(--muted);transition:all 0.3s; }
        .btn-back:hover { border-color:#6366f1;color:#6366f1;transform:translateY(-2px); }
    </style>
</head>
<body>
    <div class="err-card">
        <div class="err-code">403</div>
        <div class="err-icon"><i class="bi bi-shield-lock-fill"></i></div>
        <h2 class="mb-2">To'g'ridan-to'g'ri kirish taqiqlangan</h2>
        <p style="color:var(--muted);">Xavfsizlik sababli dars, test va vazifalar faqat kurs sahifasi orqali ochiladi.</p>

        <div class="tips">
            <h6><i class="bi bi-lightbulb me-1"></i> Qanday kirish kerak?</h6>
            <ol>
                <li><strong>Kurslar</strong> sahifasiga o'ting</li>
                <li>O'zingiz yozilgan kursni oching</li>
                <li>Kerakli darsni tanlang — shaxsiy havola avtomatik yaratiladi</li>
            </ol>
        </div>

        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <a href="javascript:history.back()" class="btn btn-back">
                <i class="bi bi-arrow-left me-2"></i>Orqaga
            </a>
            <a href="/professions/" class="btn btn-course">
                <i class="bi bi-mortarboard me-2"></i>Kurslarim
            </a>
        </div>
    </div>
    <script>
        const t = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', t);
    </script>
</body>
</html>
