{% comment %} Reusable empty state. with icon, text  | optional: cta_url, cta_label {% endcomment %}
<div class="dash-empty">
    <div class="de-icon" aria-hidden="true"><i class="bi bi-{{ icon|default:'inbox' }}"></i></div>
    <div class="de-text">{{ text|default:'Hozircha bu yerda hech narsa yo\'q' }}</div>
    {% if cta_url %}
        <a href="{{ cta_url }}" class="de-cta" aria-label="{{ cta_label|default:'Boshlash' }}">
            {{ cta_label|default:'Boshlash' }} <i class="bi bi-arrow-right" aria-hidden="true"></i>
        </a>
    {% endif %}
</div>
