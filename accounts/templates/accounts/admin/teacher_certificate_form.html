{% extends 'accounts/admin/base_admin.html' %}
{% block title %}Sertifikat qo'shish - Admin Panel{% endblock %}
{% block topbar_title %}Sertifikat qo'shish{% endblock %}

{% block admin_content %}
<style>
.tcf-page { max-width: 700px; margin: 0 auto; animation: tcf 0.5s ease; }
@keyframes tcf { from { opacity:0; transform:translateY(15px); } to { opacity:1; transform:translateY(0); } }
.tcf-back { display: inline-flex; align-items: center; gap: .5rem; color: var(--text-color); text-decoration: none; font-weight: 600; font-size: .9rem; margin-bottom: 1.5rem; transition: all 0.2s; }
.tcf-back:hover { color: #f59e0b; }
.tcf-card { background: var(--card-bg, #fff); border: 1px solid var(--border-color, #dee2e6); border-radius: 18px; overflow: hidden; }
.tcf-head { padding: 18px 24px; border-bottom: 1px solid var(--border-color, #dee2e6); font-weight: 700; display: flex; align-items: center; gap: .5rem; }
.tcf-body { padding: 24px; }
.tcf-field { margin-bottom: 1rem; }
.tcf-label { display: block; font-size: .78rem; font-weight: 700; color: var(--bs-secondary-color); text-transform: uppercase; letter-spacing: .5px; margin-bottom: .4rem; }
.tcf-input { width: 100%; padding: .65rem 1rem; border-radius: 12px; border: 2px solid var(--border-color, #dee2e6); background: var(--bg-color, #f8f9fa); color: var(--text-color); font-size: .9rem; transition: all 0.2s; }
[data-bs-theme="dark"] .tcf-input { background: rgba(255,255,255,.05); }
.tcf-input:focus { outline: none; border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.12); }
.tcf-actions { display: flex; gap: .75rem; justify-content: flex-end; margin-top: 1.5rem; }
.tcf-btn { padding: .65rem 1.5rem; border-radius: 12px; font-weight: 700; font-size: .88rem; display: inline-flex; align-items: center; gap: .5rem; transition: all 0.2s; border: none; cursor: pointer; }
.tcf-btn-save { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
.tcf-btn-save:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245,158,11,.3); }
.tcf-btn-cancel { background: transparent; border: 2px solid var(--border-color, #dee2e6); color: var(--text-color); text-decoration: none; }
.tcf-btn-cancel:hover { background: var(--bg-color, #f0f2f5); color: var(--text-color); }
@media (max-width: 768px) { .tcf-actions { flex-direction: column; } .tcf-btn { width: 100%; justify-content: center; } }
</style>

<div class="tcf-page">
    <a href="{% url 'admin_teacher_certificates' %}" class="tcf-back"><i class="bi bi-arrow-left"></i> Sertifikatlarga qaytish</a>
    <div class="tcf-card">
        <div class="tcf-head"><i class="bi bi-plus-circle" style="color:#f59e0b;"></i> Yangi sertifikat qo'shish</div>
        <div class="tcf-body">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="tcf-field">
                    <label class="tcf-label">O'qituvchi *</label>
                    <select name="teacher" class="tcf-input" required>
                        <option value="">Tanlang...</option>
                        {% for t in teachers %}<option value="{{ t.pk }}">{{ t.full_name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="tcf-field">
                    <label class="tcf-label">Sertifikat nomi *</label>
                    <input type="text" name="title" class="tcf-input" placeholder="Masalan: Python sertifikati" required>
                </div>
                <div class="tcf-field">
                    <label class="tcf-label">Tavsif</label>
                    <textarea name="description" class="tcf-input" rows="3" placeholder="Qo'shimcha ma'lumot..."></textarea>
                </div>
                <div class="tcf-field">
                    <label class="tcf-label">Berilgan sana</label>
                    <input type="date" name="issued_date" class="tcf-input">
                </div>
                <div class="tcf-field">
                    <label class="tcf-label">Sertifikat fayli *</label>
                    <input type="file" name="file" class="tcf-input" required>
                </div>
                <div class="tcf-actions">
                    <a href="{% url 'admin_teacher_certificates' %}" class="tcf-btn tcf-btn-cancel"><i class="bi bi-x-lg"></i> Bekor qilish</a>
                    <button type="submit" class="tcf-btn tcf-btn-save"><i class="bi bi-check-lg"></i> Saqlash</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
document.querySelectorAll('form').forEach(function(form) {
    form.addEventListener('submit', function() {
        var btn = form.querySelector('button[type="submit"]');
        if (btn && !btn.disabled) { btn.disabled = true; var o = btn.innerHTML; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saqlanmoqda...'; setTimeout(function(){ btn.disabled=false; btn.innerHTML=o; }, 5000); }
    });
});
</script>
{% endblock %}
