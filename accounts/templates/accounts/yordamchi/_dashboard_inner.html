<script>
const API_TOKEN = "{{ api_token }}";
const API_BASE = "/api/v1/assistant";

async function api(path, opts={}) {
    const headers = Object.assign({
        'Authorization': 'Token ' + API_TOKEN,
        'Content-Type': 'application/json',
    }, opts.headers || {});
    const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
    if (!res.ok) {
        const text = await res.text();
        throw new Error(`${res.status}: ${text}`);
    }
    if (res.status === 204) return null;
    return res.json();
}

function statusBadge(v) {
    const cls = ({
        pending: 'b-pending', approved: 'b-approved', rejected: 'b-rejected',
        new: 'b-new', resolved: 'b-resolved', closed: 'b-closed',
        in_progress: 'b-pending', active: 'b-approved', returned: 'b-default',
        overdue: 'b-rejected',
    })[v] || 'b-default';
    return `<span class="asst-badge ${cls}">${v || '-'}</span>`;
}

function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
}

function rows(items) { return items.results || items; }

// ============== DASHBOARD STATS ==============
async function loadDashboard() {
    try {
        const data = await api('/dashboard/');
        const stats = [
            ['Talabalar', data.users.students],
            ['O\'qituvchilar', data.users.teachers],
            ['Vazifa (kutilayotgan)', data.learning.homework_submissions_pending],
            ['Test natijalari', data.learning.test_results_total],
            ['Sertifikat (so\'rov)', data.learning.certificate_requests_pending],
            ['Parol so\'rovi', data.requests.password_reset_pending],
            ['Kursga yozilish', data.requests.enrollment_pending],
            ['Yordam (yangi)', data.support.help_pending],
            ['Arizalar (yangi)', data.support.applications_new],
            ['Faol so\'rovnomalar', data.support.surveys_active],
            ['Faol ijara', data.content.rentals_active],
            ['Bloklangan', data.users.blocked],
        ];
        document.getElementById('asstStats').innerHTML = stats.map(([l,v]) =>
            `<div class="asst-stat"><div class="asst-stat-label">${l}</div><div class="asst-stat-value">${v}</div></div>`
        ).join('');
    } catch(e) {
        document.getElementById('asstStats').innerHTML = `<div class="asst-empty">Xato: ${esc(e.message)}</div>`;
    }
}

// ============== HOMEWORK ==============
async function loadHomework() {
    const pane = document.getElementById('pane-homework');
    pane.innerHTML = `
        <div class="asst-section">
            <div class="asst-section-title"><i class="bi bi-list-task"></i> Vazifa topshiruvlari</div>
            <div class="asst-toolbar">
                <select id="hwStatus" class="asst-select">
                    <option value="">Barcha statuslar</option>
                    <option value="pending">Kutilmoqda</option>
                    <option value="reviewing">Ko'rib chiqilmoqda</option>
                    <option value="revision">Qayta ishlash</option>
                    <option value="accepted">Qabul qilingan</option>
                    <option value="graded">Baholangan</option>
                </select>
                <button class="asst-btn asst-btn-primary" onclick="loadHomework()">Filtrlash</button>
            </div>
            <div id="hwList" class="asst-loading">Yuklanmoqda...</div>
        </div>`;
    document.getElementById('hwStatus').addEventListener('change', () => {}); // no-op
    try {
        const status = document.getElementById('hwStatus').value;
        const data = await api('/homework-submissions/' + (status ? '?status='+status : ''));
        const list = rows(data);
        if (!list.length) { document.getElementById('hwList').innerHTML = '<div class="asst-empty">Topshiruvlar yo\'q</div>'; return; }
        document.getElementById('hwList').innerHTML = `
            <table class="asst-table"><thead><tr>
                <th>#</th><th>O'quvchi</th><th>Vazifa</th><th>Status</th><th>Baho</th><th>Sana</th><th>Amallar</th>
            </tr></thead><tbody>
            ${list.map(s => `
                <tr>
                    <td>${s.id}</td>
                    <td>${esc(s.student_name)}</td>
                    <td>${esc(s.homework_title)}</td>
                    <td>${statusBadge(s.status)}</td>
                    <td>${s.grade ?? '-'}</td>
                    <td>${(s.submitted_at||'').slice(0,16).replace('T',' ')}</td>
                    <td><div class="asst-actions">
                        <button class="asst-btn asst-btn-success" onclick="gradeHw(${s.id})">Baholash</button>
                    </div></td>
                </tr>`).join('')}
            </tbody></table>`;
    } catch(e) {
        document.getElementById('hwList').innerHTML = `<div class="asst-empty">Xato: ${esc(e.message)}</div>`;
    }
}
async function gradeHw(id) {
    const grade = prompt('Bahoni kiriting (1-10):');
    if (!grade) return;
    const feedback = prompt('Izoh:') || '';
    try {
        await api(`/homework-submissions/${id}/`, {
            method: 'PATCH',
            body: JSON.stringify({ grade: parseInt(grade), feedback, status: 'graded' }),
        });
        loadHomework();
    } catch(e) { alert('Xato: ' + e.message); }
}

async function loadUsers() {
    const pane = document.getElementById('pane-users');
    pane.innerHTML = `
        <div class="asst-section">
            <div class="asst-section-title"><i class="bi bi-people"></i> Foydalanuvchilar</div>
            <div class="asst-toolbar">
                <input id="userSearch" class="asst-input" placeholder="Qidirish (ism, telefon)...">
                <select id="userRole" class="asst-select">
                    <option value="">Barcha rollar</option>
                    <option value="student">O'quvchi</option>
                    <option value="teacher">O'qituvchi</option>
                    <option value="assistant_admin">Yordamchi admin</option>
                </select>
                <button class="asst-btn asst-btn-primary" onclick="loadUsers()">Qidirish</button>
            </div>
            <div id="userList" class="asst-loading">Yuklanmoqda...</div>
        </div>`;
    try {
        const q = document.getElementById('userSearch').value;
        const role = document.getElementById('userRole').value;
        const params = new URLSearchParams();
        if (q) params.set('search', q);
        if (role) params.set('role', role);
        const data = await api('/users/?' + params.toString());
        const list = rows(data).slice(0, 100);
        document.getElementById('userList').innerHTML = list.length ? `
            <table class="asst-table"><thead><tr>
                <th>#</th><th>F.I.</th><th>Telefon</th><th>Rol</th><th>Bloklangan</th><th>Amallar</th>
            </tr></thead><tbody>
            ${list.map(u => `<tr>
                <td>${u.id}</td><td>${esc(u.full_name)}</td><td>${esc(u.phone)}</td>
                <td>${esc(u.role)}</td>
                <td>${u.is_blocked ? '<span class="asst-badge b-rejected">Ha</span>' : '<span class="asst-badge b-approved">Yo\'q</span>'}</td>
                <td><div class="asst-actions">
                    <button class="asst-btn asst-btn-warn" onclick="setPassword(${u.id})">Parol</button>
                    ${u.role !== 'admin' ? `<button class="asst-btn asst-btn-danger" onclick="toggleBlock(${u.id})">${u.is_blocked ? 'Ochish' : 'Bloklash'}</button>` : ''}
                </div></td>

            </tbody></table>` : '<div class="asst-empty">Topilmadi</div>';
    } catch(e) { document.getElementById('userList').innerHTML = `<div class="asst-empty">Xato: ${esc(e.message)}</div>`; }
}
async function setPassword(id) {
    const pw = prompt('Yangi parol (kamida 6 belgi):');
    if (!pw) return;
    try {
        await api(`/users/${id}/set-password/`, { method:'POST', body: JSON.stringify({ new_password: pw }) });
        alert('Parol o\'rnatildi');
    } catch(e) { alert('Xato: ' + e.message); }
}
async function toggleBlock(id) {
    if (!confirm('Tasdiqlaysizmi?')) return;
    try {
        await api(`/users/${id}/toggle-block/`, { method:'POST' });
        loadUsers();
    } catch(e) { alert('Xato: ' + e.message); }
}
