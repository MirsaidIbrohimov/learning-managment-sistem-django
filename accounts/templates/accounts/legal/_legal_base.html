{% load static %}<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{% endblock %} | IT Creative Academy</title>
<meta name="robots" content="index, follow">
<link rel="icon" href="{% static 'img/logo.png' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  body { background: #f5f6fb; color: #1f2937; }
  .lg-wrap { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  .lg-top { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; text-decoration: none; color: inherit; }
  .lg-top img { width: 40px; height: 40px; }
  .lg-top b { font-size: 1.15rem; }
  .lg-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 20px; padding: 32px; box-shadow: 0 20px 50px -35px rgba(15,23,42,.35); }
  .lg-card h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: 4px; }
  .lg-card .upd { color: #6b7280; font-size: .9rem; margin-bottom: 24px; }
  .lg-card h2 { font-size: 1.15rem; font-weight: 700; margin: 28px 0 10px; display: flex; align-items: center; gap: 8px; }
  .lg-card h2 i { color: #0891b2; }
  .lg-card p, .lg-card li { line-height: 1.65; }
  .lg-steps { counter-reset: s; list-style: none; padding: 0; }
  .lg-steps li { counter-increment: s; position: relative; padding: 12px 14px 12px 54px; margin-bottom: 10px; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 14px; }
  .lg-steps li::before { content: counter(s); position: absolute; left: 14px; top: 12px; width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg,#0891b2,#7c3aed); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: .85rem; }
  .lg-foot { margin-top: 24px; text-align: center; color: #6b7280; font-size: .9rem; }
  .lg-foot a { color: #0891b2; }
  @media (max-width: 576px) { .lg-card { padding: 22px 18px; } }
</style>
</head>
<body>
<div class="lg-wrap">
  <a class="lg-top" href="{% url 'home' %}"><img src="{% static 'img/logo.png' %}" alt=""><b>IT Creative Academy</b></a>
  <div class="lg-card">
    {% block body %}{% endblock %}
  </div>
  <div class="lg-foot">
    <a href="{% url 'privacy_policy' %}">Maxfiylik siyosati</a> ·
    <a href="{% url 'data_deletion' %}">Ma’lumotlarni o‘chirish</a> ·
    <a href="{% url 'home' %}">Bosh sahifa</a>
  </div>
</div>
</body>
</html>
