{% load static %}
<style>
/* ═══════════════════════════════════════════════════════════════════
   MZ MESSENGER — ULTRA PREMIUM v3
   Every pixel matters. Telegram × Discord × Notion × Linear.
   CSS class names kept 1:1 with _messenger_script.html.
   ═══════════════════════════════════════════════════════════════════ */

/* ── TOKENS ── */
:root {
    /* Surfaces */
    --mz-bg:             #f0f2fa;
    --mz-bg-2:           #e8eaf6;
    --mz-panel:          #ffffff;
    --mz-border:         rgba(15,23,42,.09);
    --mz-border-soft:    rgba(15,23,42,.05);
    --mz-text:           #0f172a;
    --mz-muted:          #64748b;
    --mz-muted-2:        #94a3b8;
    --mz-other:          #ffffff;

    /* Brand */
    --mz-blue:           #3b82f6;
    --mz-brand1:         #6366f1;
    --mz-brand2:         #8b5cf6;
    --mz-brand3:         #d946ef;
    --mz-brand1-a:       rgba(99,102,241,.93);
    --mz-brand2-a:       rgba(139,92,246,.93);
    --mz-brand3-a:       rgba(217,70,239,.88);
    --mz-grad:           linear-gradient(135deg,#3b82f6,#6366f1 45%,#8b5cf6);
    --mz-grad-soft:      linear-gradient(135deg,rgba(59,130,246,.13),rgba(139,92,246,.13));
    --mz-grad-btn:       linear-gradient(135deg,#6366f1,#8b5cf6);

    /* State */
    --mz-hover:          rgba(99,102,241,.07);
    --mz-active:         rgba(99,102,241,.12);
    --mz-danger:         #ef4444;
    --mz-success:        #22c55e;
    --mz-online:         #22c55e;
    --mz-online-glow:    rgba(34,197,94,.45);
    --mz-warn:           #f59e0b;

    /* Shadow */
    --mz-shadow:         0 2px 12px rgba(15,23,42,.07), 0 1px 3px rgba(15,23,42,.05);
    --mz-shadow-md:      0 8px 24px rgba(15,23,42,.10), 0 2px 6px rgba(15,23,42,.06);
    --mz-shadow-lg:      0 20px 60px rgba(15,23,42,.13), 0 4px 14px rgba(15,23,42,.07);
    --mz-shadow-xl:      0 32px 80px rgba(15,23,42,.18);
    --mz-glow:           0 0 0 2px rgba(99,102,241,.22), 0 8px 28px rgba(99,102,241,.28);

    /* Blobs */
    --mz-blob1: rgba(99,102,241,.35);
    --mz-blob2: rgba(217,70,239,.25);
    --mz-blob3: rgba(59,130,246,.28);

    /* Glass */
    --mz-glass:          rgba(255,255,255,.68);
    --mz-glass-soft:     rgba(255,255,255,.48);
    --mz-glass-strong:   rgba(255,255,255,.88);
    --mz-glass-border:   rgba(255,255,255,.72);
    --mz-glass-hl:       rgba(255,255,255,.92);
    --mz-blur:           blur(24px) saturate(160%);
    --mz-blur-soft:      blur(14px) saturate(140%);

    /* Easing */
    --mz-spring:  cubic-bezier(.34,1.56,.64,1);
    --mz-ease:    cubic-bezier(.22,.61,.36,1);
    --mz-ease-in: cubic-bezier(.4,0,1,1);

    /* Shape */
    --mz-radius: 22px;
    --mz-r-sm:   14px;
    --mz-r-xs:   10px;
}

[data-bs-theme="dark"] {
    --mz-bg:           #080d1a;
    --mz-bg-2:         #050810;
    --mz-panel:        #0e1628;
    --mz-border:       rgba(255,255,255,.07);
    --mz-border-soft:  rgba(255,255,255,.04);
    --mz-text:         #e8edf7;
    --mz-muted:        #8898b8;
    --mz-muted-2:      #5c6c88;
    --mz-other:        #131f3a;

    --mz-hover:        rgba(124,131,255,.11);
    --mz-active:       rgba(124,131,255,.18);

    --mz-shadow:       0 2px 14px rgba(0,0,0,.45);
    --mz-shadow-md:    0 8px 28px rgba(0,0,0,.55);
    --mz-shadow-lg:    0 20px 64px rgba(0,0,0,.65);
    --mz-shadow-xl:    0 36px 90px rgba(0,0,0,.75);
    --mz-glow:         0 0 0 2px rgba(124,131,255,.32), 0 10px 36px rgba(99,102,241,.42);

    --mz-blob1:  rgba(99,102,241,.38);
    --mz-blob2:  rgba(217,70,239,.28);
    --mz-blob3:  rgba(59,130,246,.32);

    --mz-glass:          rgba(14,22,40,.68);
    --mz-glass-soft:     rgba(10,16,30,.55);
    --mz-glass-strong:   rgba(16,26,46,.88);
    --mz-glass-border:   rgba(255,255,255,.09);
    --mz-glass-hl:       rgba(255,255,255,.06);

    --mz-online-glow: rgba(34,197,94,.55);
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
    }
}

/* ═══════════════ KEYFRAMES ═══════════════ */
@keyframes mzAurora   { 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(40px,-28px) scale(1.12); } }
@keyframes mzShellIn  { from{ opacity:0; transform:translateY(18px) scale(.985); } to{ opacity:1; transform:none; } }
@keyframes mzFadeUp   { from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
@keyframes mzFadeIn   { from{ opacity:0; } to{ opacity:1; } }
@keyframes mzMsgIn    { from{ opacity:0; transform:translateY(16px) scale(.95); } to{ opacity:1; transform:none; } }
@keyframes mzPopIn    { from{ opacity:0; transform:scale(.35); } to{ opacity:1; transform:scale(1); } }
@keyframes mzShine    { 0%{ transform:translateX(-130%); } 55%,100%{ transform:translateX(130%); } }
@keyframes mzSlideDown{ from{ opacity:0; transform:translateY(-10px); } to{ opacity:1; transform:none; } }
@keyframes mzBadgePop { from{ transform:scale(0) rotate(-15deg); } 80%{ transform:scale(1.18) rotate(5deg); } to{ transform:scale(1); } }
@keyframes mzFloat    { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }
@keyframes mzPulseDot { 0%,100%{ box-shadow:0 0 0 0 var(--mz-online-glow); } 70%{ box-shadow:0 0 0 7px rgba(34,197,94,0); } }
@keyframes mzDotBounce{ 0%,80%,100%{ transform:scaleY(.5) translateY(0); opacity:.4; } 40%{ transform:scaleY(1.2) translateY(-7px); opacity:1; } }
@keyframes mzShimmer  { 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }
@keyframes mzToastIn  { from{ opacity:0; transform:translateY(18px) scale(.9); } to{ opacity:1; transform:none; } }
@keyframes mzToastOut { from{ opacity:1; transform:none; } to{ opacity:0; transform:translateY(20px) scale(.9); } }
@keyframes mzGradShift{ 0%{ background-position:0% 60%; } 50%{ background-position:100% 40%; } 100%{ background-position:0% 60%; } }
@keyframes mzSubIn    { from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:none; } }
@keyframes mzComposeIn{ from{ transform:scale(.85) rotate(-8deg); opacity:0; } to{ transform:none; opacity:1; } }
@keyframes mzSpinSlash{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }

/* ═══════════════ AMBIENT BACKGROUND ═══════════════ */
#mzPageWrap { position:relative; isolation:isolate; }
#mzPageWrap::before,
#mzPageWrap::after {
    content:''; position:absolute; z-index:0;
    border-radius:50%; filter:blur(110px);
    pointer-events:none; opacity:.9;
    animation:mzAurora 20s ease-in-out infinite;
}
#mzPageWrap::before {
    width:560px; height:560px; top:-180px; left:-150px;
    background:radial-gradient(circle, var(--mz-blob1), transparent 72%);
}
#mzPageWrap::after {
    width:500px; height:500px; bottom:-160px; right:-110px;
    background:radial-gradient(circle, var(--mz-blob2), transparent 70%);
    animation-delay:-10s; animation-direction:reverse;
}
.mz-shell::after {
    content:''; position:absolute; z-index:0; pointer-events:none;
    width:380px; height:380px; top:38%; left:40%;
    background:radial-gradient(circle, var(--mz-blob3), transparent 73%);
    filter:blur(120px); opacity:.45; border-radius:50%;
    animation:mzAurora 24s ease-in-out infinite; animation-delay:-6s;
}

/* ═══════════════ SHELL ═══════════════ */
.mz-shell {
    position:relative; z-index:1;
    max-width:1260px; margin:0 auto;
    display:flex;
    height:calc(100vh - 88px); min-height:560px;
    background:var(--mz-glass);
    backdrop-filter:var(--mz-blur);
    -webkit-backdrop-filter:var(--mz-blur);
    border:1px solid var(--mz-glass-border);
    border-radius:var(--mz-radius);
    overflow:hidden;
    box-shadow:var(--mz-shadow-xl), inset 0 1px 0 var(--mz-glass-hl);
    animation:mzShellIn .55s var(--mz-ease) both;
}
/* gradient ring */
.mz-shell::before {
    content:''; position:absolute; inset:0; z-index:5;
    pointer-events:none; border-radius:var(--mz-radius); padding:1px;
    background:linear-gradient(140deg,
        rgba(130,138,255,.6) 0%,
        transparent 30%,
        transparent 68%,
        rgba(217,70,239,.45) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; opacity:.75;
}

/* ═══════════════ SIDEBAR ═══════════════ */
.mz-side {
    width:348px; flex:0 0 348px;
    display:flex; flex-direction:column;
    border-right:1px solid var(--mz-glass-border);
    background:var(--mz-glass-soft);
    min-width:0; position:relative; z-index:2;
}

/* ── Sidebar header ── */
.mz-side-head {
    padding:16px 14px 0;
    flex:0 0 auto;
}
.mz-side-top-row {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px;
}
.mz-side-title {
    font-size:1.18rem; font-weight:800;
    background:var(--mz-grad); -webkit-background-clip:text;
    background-clip:text; color:transparent;
    letter-spacing:-.025em;
}
.mz-compose-btn {
    width:36px; height:36px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:var(--mz-grad-btn); color:#fff; cursor:pointer;
    box-shadow:0 6px 16px rgba(99,102,241,.4);
    transition:transform .22s var(--mz-spring), box-shadow .22s;
    font-size:1rem; flex:0 0 36px;
    animation:mzComposeIn .5s var(--mz-spring) both;
}
.mz-compose-btn:hover { transform:translateY(-2px) scale(1.08); box-shadow:0 10px 24px rgba(99,102,241,.55); }
.mz-compose-btn:active { transform:scale(.9); }

/* ── Search ── */
.mz-search {
    position:relative; display:flex; align-items:center;
    background:var(--mz-bg); border:1.5px solid var(--mz-border);
    border-radius:var(--mz-r-sm); padding:0 13px;
    transition:border-color .25s, box-shadow .25s, background .25s;
    margin-bottom:10px;
}
.mz-search:focus-within {
    border-color:var(--mz-brand1);
    box-shadow:0 0 0 4px rgba(99,102,241,.16), var(--mz-shadow);
    background:var(--mz-panel);
}
.mz-search i { color:var(--mz-muted); font-size:.93rem; }
.mz-search input {
    flex:1; border:none; outline:none; background:transparent;
    color:var(--mz-text); padding:11px 9px; font-size:.875rem;
    font-weight:500;
}
.mz-search input::placeholder { color:var(--mz-muted-2); font-weight:400; }

/* ── Filters ── */
.mz-filters {
    display:flex; gap:5px; padding:0 14px 12px;
}
.mz-filter {
    flex:1; text-align:center; padding:7px 5px;
    border-radius:var(--mz-r-xs);
    background:var(--mz-bg); border:1.5px solid var(--mz-border);
    color:var(--mz-muted); font-weight:700; font-size:.76rem;
    cursor:pointer; user-select:none;
    transition:transform .18s var(--mz-spring), background .22s,
                color .22s, box-shadow .22s, border-color .22s;
    position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center; gap:4px;
}
.mz-filter:hover {
    transform:translateY(-1px); color:var(--mz-text);
    background:var(--mz-glass-strong);
}
.mz-filter.active {
    background:var(--mz-grad);
    color:#fff; border-color:transparent;
    box-shadow:0 6px 18px rgba(99,102,241,.38);
}
.mz-filter.active::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(115deg,transparent,rgba(255,255,255,.32),transparent);
    transform:translateX(-130%); animation:mzShine 2.8s ease-in-out infinite;
}
.mz-filter-count {
    min-width:17px; height:17px; padding:0 5px; border-radius:999px;
    background:var(--mz-danger); color:#fff; font-size:.62rem; font-weight:800;
    display:none; align-items:center; justify-content:center; line-height:1;
    box-shadow:0 2px 7px rgba(239,68,68,.5);
}
.mz-filter-count.show { display:inline-flex; animation:mzBadgePop .3s var(--mz-spring) both; }
.mz-filter.active .mz-filter-count { background:rgba(255,255,255,.28); box-shadow:none; }

/* ── Sidebar list ── */
.mz-list {
    flex:1; overflow-y:auto; padding:2px 8px 14px;
    scroll-behavior:smooth;
}
.mz-list::-webkit-scrollbar { width:5px; }
.mz-list::-webkit-scrollbar-thumb {
    background:var(--mz-border); border-radius:8px;
    transition:background .2s;
}
.mz-list::-webkit-scrollbar-thumb:hover { background:rgba(99,102,241,.4); }

/* Section labels */
.mz-sec-label {
    display:flex; align-items:center; gap:7px;
    font-size:.65rem; font-weight:800; text-transform:uppercase;
    letter-spacing:.65px; color:var(--mz-muted);
    padding:12px 10px 5px;
}
.mz-sec-label::after {
    content:''; flex:1; height:1px;
    background:linear-gradient(90deg, var(--mz-border), transparent);
}
.mz-sec-label i { font-size:.72rem; color:var(--mz-brand2); }

/* ── Sidebar row ── */
.mz-row {
    display:flex; align-items:center; gap:12px;
    padding:10px 10px; border-radius:18px;
    cursor:pointer; margin-bottom:2px;
    position:relative; isolation:isolate;
    animation:mzFadeUp .28s var(--mz-ease) both;
    transition:background .18s, transform .2s var(--mz-spring), box-shadow .18s;
}
.mz-row:hover {
    background:var(--mz-glass-strong);
    backdrop-filter:var(--mz-blur-soft);
    -webkit-backdrop-filter:var(--mz-blur-soft);
    transform:translateX(4px);
    box-shadow:var(--mz-shadow), inset 0 1px 0 var(--mz-glass-hl);
}
/* active indicator */
.mz-row.active {
    background:var(--mz-active);
}
.mz-row.active::after {
    content:''; position:absolute; inset:0; z-index:-1;
    border-radius:18px; padding:1.5px;
    background:linear-gradient(135deg,var(--mz-brand1),var(--mz-brand2),var(--mz-brand3));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    box-shadow:0 5px 20px rgba(99,102,241,.25);
}
/* left accent bar on active */
.mz-row.active::before {
    content:''; position:absolute; left:-8px;
    top:18%; bottom:18%; width:4px; border-radius:0 4px 4px 0;
    background:linear-gradient(180deg,var(--mz-brand1),var(--mz-brand3));
    box-shadow:0 0 14px rgba(99,102,241,.65);
}
/* unread highlight */
.mz-row:has(.mz-row-badge)::after {
    content:''; position:absolute; inset:0; z-index:-1; border-radius:18px;
    background:var(--mz-grad-soft);
}
.mz-row:has(.mz-row-badge) .mz-row-name { font-weight:800; }
.mz-row:has(.mz-row-badge) .mz-row-last { color:var(--mz-text); font-weight:600; }

/* Avatar */
.mz-row-ava {
    width:50px; height:50px; border-radius:17px; object-fit:cover;
    flex:0 0 50px; box-shadow:var(--mz-shadow);
    transition:transform .22s var(--mz-spring);
}
.mz-row-ava-fb {
    width:50px; height:50px; border-radius:17px; flex:0 0 50px;
    display:flex; align-items:center; justify-content:center;
    background:var(--mz-grad); color:#fff;
    font-weight:800; font-size:1.08rem;
    box-shadow:0 5px 15px rgba(99,102,241,.32);
    transition:transform .22s var(--mz-spring);
}
.mz-row:hover .mz-row-ava,
.mz-row:hover .mz-row-ava-fb { transform:scale(1.07) rotate(-2deg); }

/* Kind badge & online dot */
.mz-row-kind {
    position:absolute; left:37px; top:35px;
    width:20px; height:20px; border-radius:8px;
    background:var(--mz-panel); border:2px solid var(--mz-panel);
    display:flex; align-items:center; justify-content:center;
    font-size:.62rem; color:#fff;
    box-shadow:0 2px 6px rgba(15,23,42,.18);
}
.mz-row-kind.group { background:linear-gradient(135deg,#0ea5e9,#3b82f6); }
.mz-row-dot {
    width:13px; height:13px; border-radius:50%;
    position:absolute; left:39px; top:39px;
    border:2.5px solid var(--mz-panel);
}
.mz-row-dot.on { background:var(--mz-online); animation:mzPulseDot 2.2s infinite; }
.mz-row-dot.off { display:none; }

/* Row body text */
.mz-row-body { flex:1; min-width:0; }
.mz-row-top {
    display:flex; justify-content:space-between; align-items:baseline; gap:6px;
}
.mz-row-name {
    font-weight:700; font-size:.93rem; color:var(--mz-text);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    letter-spacing:-.012em;
}
.mz-row-time {
    font-size:.67rem; color:var(--mz-muted-2);
    flex:0 0 auto; font-weight:500;
}
.mz-row-bottom {
    display:flex; justify-content:space-between; align-items:center;
    gap:6px; margin-top:2px;
}
.mz-row-last {
    font-size:.79rem; color:var(--mz-muted);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.mz-row-last-ic { color:var(--mz-brand1); margin-right:3px; font-size:.78rem; }
.mz-row:has(.mz-row-badge) .mz-row-last-ic { color:var(--mz-brand2); }
.mz-row-badge {
    min-width:21px; height:21px; padding:0 6px; border-radius:999px;
    background:var(--mz-grad); color:#fff;
    font-size:.68rem; font-weight:800;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    box-shadow:0 3px 10px rgba(99,102,241,.45);
    animation:mzBadgePop .32s var(--mz-spring) both;
}
.mz-row-pin { color:var(--mz-brand2); font-size:.74rem; flex:0 0 auto; }

/* ── Empty / loading ── */
.mz-empty {
    margin:auto; text-align:center;
    color:var(--mz-muted); padding:40px 20px;
    animation:mzFadeUp .3s both;
}
.mz-empty i { font-size:2.6rem; opacity:.4; display:block; margin-bottom:12px; }

/* ── Skeleton loaders ── */
.mz-skel {
    background:linear-gradient(100deg,
        var(--mz-border-soft) 30%,
        var(--mz-hover) 50%,
        var(--mz-border-soft) 70%);
    background-size:200% 100%;
    animation:mzShimmer 1.4s ease-in-out infinite;
}
.mz-skel-row {
    display:flex; align-items:center; gap:12px;
    padding:10px 10px; margin-bottom:2px;
}
.mz-skel-ava { width:50px; height:50px; border-radius:17px; flex:0 0 50px; }
.mz-skel-lines { flex:1; }
.mz-skel-line {
    height:11px; border-radius:7px; margin-bottom:8px;
}
.mz-skel-line.w70 { width:70%; }
.mz-skel-line.w45 { width:45%; }
.mz-skel-line.w90 { width:90%; }
.mz-skel-msg {
    max-width:56%; padding:14px 18px;
    border-radius:18px; margin-bottom:12px;
}
.mz-skel-msg.me { margin-left:auto; }

/* ═══════════════ MAIN ═══════════════ */
.mz-main {
    flex:1; display:flex; flex-direction:column;
    min-width:0; background:transparent;
    position:relative; z-index:2;
}

/* ── Placeholder (no chat selected) ── */
@keyframes mzOrbit1 { from{ transform:rotate(0deg) translateX(52px) rotate(0deg); } to{ transform:rotate(360deg) translateX(52px) rotate(-360deg); } }
@keyframes mzOrbit2 { from{ transform:rotate(120deg) translateX(38px) rotate(-120deg); } to{ transform:rotate(480deg) translateX(38px) rotate(-480deg); } }
@keyframes mzOrbit3 { from{ transform:rotate(240deg) translateX(44px) rotate(-240deg); } to{ transform:rotate(600deg) translateX(44px) rotate(-600deg); } }
@keyframes mzGlowPulse{ 0%,100%{ opacity:.5; transform:scale(1); } 50%{ opacity:.9; transform:scale(1.15); } }

.mz-placeholder {
    margin:auto; text-align:center;
    color:var(--mz-muted); padding:24px;
    animation:mzFadeUp .5s both;
    display:flex; flex-direction:column; align-items:center;
}
.mz-placeholder-scene {
    position:relative; width:140px; height:140px; margin:0 auto 24px;
}
/* ambient glow behind icon */
.mz-placeholder-scene::before {
    content:''; position:absolute; inset:-20px; border-radius:50%;
    background:radial-gradient(circle, var(--mz-blob1), transparent 70%);
    filter:blur(28px); opacity:.55; z-index:0;
    animation:mzGlowPulse 3.5s ease-in-out infinite;
}
.mz-placeholder-icon-wrap {
    position:relative; z-index:1;
    width:100px; height:100px; border-radius:32px;
    margin:20px auto 0;
    background:var(--mz-grad-soft); border:1.5px solid var(--mz-glass-border);
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--mz-shadow-md), inset 0 1px 0 var(--mz-glass-hl);
    animation:mzFloat 4s ease-in-out infinite;
}
.mz-placeholder-icon-wrap i {
    font-size:2.8rem;
    background:var(--mz-grad); -webkit-background-clip:text;
    background-clip:text; color:transparent;
}
/* orbiting dots */
.mz-ph-dot {
    position:absolute; top:50%; left:50%; width:10px; height:10px;
    border-radius:50%; margin:-5px; z-index:2;
}
.mz-ph-dot:nth-child(1) {
    background:var(--mz-brand1);
    animation:mzOrbit1 4s linear infinite;
    box-shadow:0 0 8px var(--mz-brand1);
}
.mz-ph-dot:nth-child(2) {
    background:var(--mz-brand2); width:8px; height:8px; margin:-4px;
    animation:mzOrbit2 5.5s linear infinite;
    box-shadow:0 0 8px var(--mz-brand2);
}
.mz-ph-dot:nth-child(3) {
    background:var(--mz-brand3); width:7px; height:7px; margin:-3.5px;
    animation:mzOrbit3 3.5s linear infinite;
    box-shadow:0 0 8px var(--mz-brand3);
}
.mz-placeholder h3 {
    font-size:1.15rem; font-weight:800; color:var(--mz-text);
    margin-bottom:8px; letter-spacing:-.02em;
    background:var(--mz-grad); -webkit-background-clip:text;
    background-clip:text; color:transparent;
}
.mz-placeholder p {
    font-size:.85rem; color:var(--mz-muted-2);
    max-width:240px; margin:0 auto; line-height:1.55;
}
/* shortcut chips */
.mz-ph-chips {
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:20px;
}
.mz-ph-chip {
    display:inline-flex; align-items:center; gap:5px;
    padding:7px 13px; border-radius:12px; font-size:.77rem; font-weight:600;
    background:var(--mz-glass-strong); border:1px solid var(--mz-glass-border);
    color:var(--mz-muted); box-shadow:var(--mz-shadow); cursor:default;
    transition:transform .2s var(--mz-spring), box-shadow .2s, color .2s;
}
.mz-ph-chip:hover { transform:translateY(-2px); box-shadow:var(--mz-shadow-md); color:var(--mz-text); }
.mz-ph-chip i { color:var(--mz-brand2); }

/* ── Header ── */
.mz-head {
    display:flex; align-items:center; gap:13px;
    padding:13px 18px; flex:0 0 auto;
    background:linear-gradient(125deg,
        var(--mz-brand1-a),
        var(--mz-brand2-a) 50%,
        var(--mz-brand3-a));
    background-size:240% 240%;
    animation:mzGradShift 14s ease infinite;
    backdrop-filter:var(--mz-blur-soft);
    -webkit-backdrop-filter:var(--mz-blur-soft);
    color:#fff; position:relative; z-index:6;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.42),
        inset 0 -1px 0 rgba(0,0,0,.1),
        0 6px 24px rgba(15,23,42,.12);
}
.mz-head::before {
    content:''; position:absolute; inset:0; pointer-events:none; opacity:.55;
    background:
        radial-gradient(130px 80px at 10% 0%, rgba(255,255,255,.3), transparent 70%),
        radial-gradient(180px 100px at 90% 130%, rgba(0,0,0,.15), transparent 70%);
}
.mz-head::after {
    content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
    animation:mzShine 5s ease-in-out infinite;
}
.mz-back {
    width:38px; height:38px; flex:0 0 38px; display:none;
    align-items:center; justify-content:center;
    border-radius:12px; color:#fff;
    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.26);
    transition:background .15s, transform .18s var(--mz-spring);
    cursor:pointer; position:relative; z-index:1;
}
.mz-back:hover { background:rgba(255,255,255,.3); transform:translateX(-3px); }
.mz-back:active { transform:scale(.9); }
.mz-ava {
    width:46px; height:46px; border-radius:14px; object-fit:cover;
    border:2px solid rgba(255,255,255,.42); position:relative; z-index:1;
    box-shadow:0 6px 18px rgba(0,0,0,.2);
    transition:transform .22s var(--mz-spring);
}
.mz-ava:hover { transform:scale(1.05) rotate(-2deg); }
.mz-ava-fb {
    width:46px; height:46px; border-radius:14px; flex:0 0 46px;
    position:relative; z-index:1;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.22); color:#fff;
    font-weight:800; font-size:1.08rem;
    border:1.5px solid rgba(255,255,255,.32);
    transition:transform .22s var(--mz-spring);
}
.mz-ava-fb:hover { transform:scale(1.05) rotate(-2deg); }
.mz-head .flex-grow-1 { position:relative; z-index:1; min-width:0; }
.mz-h-name {
    font-weight:800; font-size:1.05rem; line-height:1.15;
    letter-spacing:-.015em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.mz-h-sub {
    font-size:.76rem; opacity:.95; display:flex; align-items:center; margin-top:1px;
}
.mz-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px; flex:0 0 8px; }
.mz-dot.on {
    background:#86efac;
    box-shadow:0 0 0 2px rgba(134,239,172,.4), 0 0 8px rgba(134,239,172,.7);
    animation:mzPulseDot 2s infinite;
}
.mz-dot.off { background:rgba(255,255,255,.5); }
.mz-sub-fade { display:inline-block; animation:mzSubIn .32s ease; }

/* ── Header actions ── */
.mz-head-actions {
    display:flex; align-items:center; gap:6px;
    flex:0 0 auto; position:relative; z-index:1;
}
.mz-icon-btn, .mz-pin-btn {
    width:38px; height:38px; flex:0 0 38px;
    display:flex; cursor:pointer;
    align-items:center; justify-content:center;
    border-radius:12px; color:#fff;
    background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.24);
    transition:background .18s, transform .2s var(--mz-spring), color .18s;
    font-size:.98rem;
}
.mz-icon-btn:hover { background:rgba(255,255,255,.32); transform:translateY(-2px); }
.mz-icon-btn:active { transform:scale(.9); }
.mz-icon-btn.active {
    background:#fff; color:var(--mz-brand1);
    box-shadow:0 6px 16px rgba(0,0,0,.16);
}
.mz-pin-btn:hover { background:rgba(255,255,255,.3); transform:rotate(-20deg) scale(1.1); }
.mz-pin-btn.pinned {
    background:#fff; color:var(--mz-brand1);
    box-shadow:0 6px 16px rgba(0,0,0,.18);
}
@media (max-width:560px) { .mz-icon-btn.mz-optional { display:none; } }

/* ═══════════════ MESSAGE BODY ═══════════════ */
.mz-body {
    flex:1; overflow-y:auto; padding:18px 22px 10px;
    display:flex; flex-direction:column; gap:0;
    scroll-behavior:smooth; position:relative;
}
.mz-body::-webkit-scrollbar { width:8px; }
.mz-body::-webkit-scrollbar-thumb {
    background:var(--mz-border); border-radius:8px;
    transition:background .2s;
}
.mz-body::-webkit-scrollbar-thumb:hover { background:rgba(99,102,241,.38); }

/* ── Day separator ── */
.mz-day {
    text-align:center; margin:16px 0 10px;
    position:relative; display:flex; align-items:center; gap:10px;
}
.mz-day::before, .mz-day::after {
    content:''; flex:1; height:1px;
    background:linear-gradient(90deg,transparent,var(--mz-border),transparent);
}
.mz-day span {
    background:var(--mz-glass-strong);
    backdrop-filter:var(--mz-blur-soft);
    -webkit-backdrop-filter:var(--mz-blur-soft);
    color:var(--mz-muted); border:1px solid var(--mz-glass-border);
    padding:4px 14px; border-radius:999px;
    font-size:.68rem; font-weight:700;
    box-shadow:var(--mz-shadow); white-space:nowrap;
    letter-spacing:.02em;
}

/* ── Message row ── */
.mz-row-msg {
    display:flex; gap:8px; max-width:72%;
    position:relative; margin-top:8px;
    animation:mzMsgIn .3s var(--mz-ease) both;
}
.mz-row-msg.me { align-self:flex-end; flex-direction:row-reverse; }
.mz-row-msg.other { align-self:flex-start; }

/* Grouping */
.mz-row-msg.mz-grouped { margin-top:2px; }
.mz-row-msg.mz-grouped .mz-msg-ava,
.mz-row-msg.mz-grouped .mz-msg-ava-fb { visibility:hidden; }
.mz-row-msg.mz-grouped .mz-sender { display:none; }
.mz-row-msg.other.mz-grouped .mz-bubble { border-top-left-radius:7px; }
.mz-row-msg.me.mz-grouped .mz-bubble { border-top-right-radius:7px; }
.mz-row-msg.mz-grouped .mz-meta-row {
    opacity:0; max-height:0; margin-top:0; overflow:hidden;
    transition:opacity .16s, max-height .16s;
}
.mz-row-msg.mz-grouped:hover .mz-meta-row { opacity:.75; max-height:22px; margin-top:2px; }

/* Message avatar */
.mz-msg-ava {
    width:32px; height:32px; border-radius:50%;
    flex:0 0 32px; align-self:flex-end; object-fit:cover;
    box-shadow:0 2px 8px rgba(15,23,42,.12);
}
.mz-msg-ava-fb {
    width:32px; height:32px; border-radius:50%; flex:0 0 32px;
    align-self:flex-end; display:flex; align-items:center; justify-content:center;
    background:var(--mz-grad); color:#fff; font-size:.7rem; font-weight:700;
    box-shadow:0 3px 10px rgba(99,102,241,.28);
}

/* Bubble wrapper */
.mz-bubble-wrap { position:relative; max-width:100%; }
.mz-bubble {
    padding:10px 14px; border-radius:18px;
    font-size:.9rem; line-height:1.48; word-break:break-word;
    transition:transform .15s, box-shadow .18s;
    position:relative;
}
.mz-bubble-wrap:hover .mz-bubble { transform:translateY(-1px); }

/* Other bubble (received) */
.mz-row-msg.other .mz-bubble {
    background:var(--mz-glass-strong);
    backdrop-filter:var(--mz-blur-soft);
    -webkit-backdrop-filter:var(--mz-blur-soft);
    color:var(--mz-text);
    border:1px solid var(--mz-glass-border);
    border-bottom-left-radius:6px;
    box-shadow:var(--mz-shadow);
}
/* Me bubble (sent) */
.mz-row-msg.me .mz-bubble {
    background:var(--mz-grad);
    color:#fff; border-bottom-right-radius:6px;
    box-shadow:0 6px 22px rgba(99,102,241,.35);
}
.mz-row-msg.me .mz-bubble::after {
    content:''; position:absolute; inset:0;
    border-radius:inherit; pointer-events:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28);
}

/* Sender name (group) */
.mz-sender {
    font-size:.73rem; font-weight:800; margin-bottom:3px;
    background:var(--mz-grad); -webkit-background-clip:text;
    background-clip:text; color:transparent;
}

/* Message text */
.mz-msg-text { position:relative; z-index:1; }

/* Quote (reply preview) */
.mz-quote {
    display:block; border-left:3px solid rgba(255,255,255,.6);
    padding:5px 10px; margin-bottom:7px; border-radius:10px;
    font-size:.78rem; background:rgba(255,255,255,.14);
    cursor:pointer; transition:background .15s;
}
.mz-quote:hover { background:rgba(255,255,255,.25); }
.mz-row-msg.other .mz-quote {
    border-left-color:var(--mz-brand2);
    background:var(--mz-grad-soft);
}
.mz-row-msg.other .mz-quote:hover { background:var(--mz-hover); }
.mz-quote .qn { font-weight:700; display:block; margin-bottom:1px; }
.mz-quote .qs { opacity:.82; }

/* Meta (time + ticks) */
.mz-meta-row {
    display:flex; align-items:center; gap:4px;
    margin-top:4px; justify-content:flex-end;
}
.mz-time { font-size:.64rem; opacity:.7; font-weight:500; }
.mz-tag { font-size:.64rem; opacity:.7; font-style:italic; }
.mz-tick { font-size:.82rem; opacity:.8; transition:color .25s; }
.mz-tick.read { color:#7dd3fc; opacity:1; }

/* File attachment */
.mz-file {
    display:inline-flex; align-items:center; gap:8px;
    padding:8px 13px; border-radius:12px; margin-top:6px;
    background:rgba(255,255,255,.18); color:inherit;
    text-decoration:none; font-size:.8rem;
    border:1px solid rgba(255,255,255,.28);
    transition:transform .15s, box-shadow .18s;
}
.mz-file:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(0,0,0,.15); }
.mz-row-msg.other .mz-file {
    background:var(--mz-bg); border-color:var(--mz-border);
}
.mz-file img { max-width:220px; border-radius:10px; display:block; }

/* Forward tag */
.mz-tag { display:flex; align-items:center; gap:5px; margin-top:4px; }

/* Links */
.mz-link {
    color:inherit; font-weight:600; text-decoration:underline;
    text-underline-offset:2px; text-decoration-thickness:1px;
    text-decoration-color:rgba(255,255,255,.55);
    transition:opacity .15s;
}
.mz-link:hover { opacity:.82; }
.mz-row-msg.other .mz-link {
    color:var(--mz-brand1);
    text-decoration-color:rgba(99,102,241,.45);
}

/* ── Reactions ── */
.mz-react-row { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.mz-react-pill {
    display:inline-flex; align-items:center; gap:3px;
    padding:3px 10px; border-radius:999px; font-size:.76rem;
    cursor:pointer; font-weight:600;
    background:var(--mz-glass-strong); border:1px solid var(--mz-border);
    color:var(--mz-text); animation:mzPopIn .26s var(--mz-spring) both;
    transition:transform .15s, box-shadow .15s;
}
.mz-react-pill:hover { transform:scale(1.1); box-shadow:var(--mz-shadow); }
.mz-row-msg.me .mz-react-pill {
    background:rgba(255,255,255,.22); border-color:rgba(255,255,255,.36); color:#fff;
}
.mz-react-pill.mine {
    border-color:var(--mz-brand2); background:var(--mz-active);
    color:var(--mz-text); box-shadow:0 0 0 1.5px rgba(139,92,246,.4);
}

/* ── Message actions toolbar ── */
.mz-actions {
    position:absolute; top:-18px; display:flex; gap:2px;
    background:var(--mz-glass-strong);
    backdrop-filter:var(--mz-blur);
    -webkit-backdrop-filter:var(--mz-blur);
    border:1px solid var(--mz-glass-border);
    border-radius:13px; padding:3px 4px;
    box-shadow:var(--mz-shadow-lg);
    opacity:0; transform:translateY(8px) scale(.88);
    pointer-events:none; z-index:7;
    transition:opacity .2s, transform .2s var(--mz-spring);
}
.mz-row-msg.me .mz-actions { right:0; }
.mz-row-msg.other .mz-actions { left:32px; }
.mz-row-msg:hover .mz-actions {
    opacity:1; transform:translateY(0) scale(1); pointer-events:auto;
}
.mz-act-btn {
    width:30px; height:30px; display:flex;
    align-items:center; justify-content:center;
    border-radius:10px; color:var(--mz-muted);
    font-size:.82rem; cursor:pointer;
    transition:background .14s, color .14s, transform .14s var(--mz-spring);
}
.mz-act-btn:hover {
    background:var(--mz-hover); color:var(--mz-brand1);
    transform:scale(1.18);
}
.mz-act-btn:active { transform:scale(.9); }
.mz-act-btn.danger:hover {
    color:var(--mz-danger); background:rgba(239,68,68,.1);
}

/* ── Emoji quick-react picker ── */
.mz-emoji-pop {
    position:absolute; top:-52px; display:flex; gap:4px;
    background:var(--mz-glass-strong);
    backdrop-filter:var(--mz-blur);
    -webkit-backdrop-filter:var(--mz-blur);
    border:1px solid var(--mz-glass-border);
    border-radius:18px; padding:7px 10px;
    box-shadow:var(--mz-shadow-lg); z-index:8;
    animation:mzPopIn .2s var(--mz-spring) both;
}
.mz-row-msg.me .mz-emoji-pop { right:0; }
.mz-row-msg.other .mz-emoji-pop { left:32px; }
.mz-emoji-pop span {
    cursor:pointer; font-size:1.25rem;
    transition:transform .15s var(--mz-spring);
    display:inline-block;
}
.mz-emoji-pop span:hover { transform:scale(1.45) translateY(-4px) rotate(-8deg); }

/* ── "New messages" divider ── */
.mz-new-divider {
    display:flex; align-items:center; gap:10px;
    margin:16px 4px 10px; animation:mzFadeUp .3s both;
}
.mz-new-divider::before, .mz-new-divider::after {
    content:''; height:1.5px; flex:1;
    background:linear-gradient(90deg,transparent,var(--mz-brand2),transparent);
    opacity:.55;
}
.mz-new-divider span {
    font-size:.66rem; font-weight:800; text-transform:uppercase;
    letter-spacing:.55px; color:var(--mz-brand2);
    padding:4px 12px; border-radius:999px;
    background:var(--mz-grad-soft); border:1px solid rgba(139,92,246,.28);
    white-space:nowrap;
}

/* ═══════════════ TYPING INDICATOR ═══════════════ */
.mz-typing {
    padding:4px 22px 10px; font-size:.79rem;
    color:var(--mz-muted); font-style:italic;
    display:flex; align-items:center; gap:8px; min-height:28px;
}
.mz-typing-dots {
    display:inline-flex; gap:3px; align-items:center;
}
.mz-typing-dots i {
    width:7px; height:7px; border-radius:50%;
    background:var(--mz-brand1); display:inline-block;
    animation:mzDotBounce 1.4s infinite ease-in-out;
    font-style:normal;
}
.mz-typing-dots i:nth-child(2) { animation-delay:.16s; background:var(--mz-brand2); }
.mz-typing-dots i:nth-child(3) { animation-delay:.32s; background:var(--mz-brand3); }

/* ═══════════════ SCROLL-TO-BOTTOM ═══════════════ */
.mz-scroll-bottom {
    position:absolute; right:20px; bottom:90px;
    width:44px; height:44px; border-radius:50%;
    background:var(--mz-glass-strong);
    backdrop-filter:var(--mz-blur);
    -webkit-backdrop-filter:var(--mz-blur);
    border:1px solid var(--mz-glass-border);
    box-shadow:var(--mz-shadow-lg);
    color:var(--mz-brand1); display:flex;
    align-items:center; justify-content:center;
    font-size:1.15rem; cursor:pointer; z-index:10;
    opacity:0; transform:translateY(12px) scale(.75);
    pointer-events:none;
    transition:opacity .22s, transform .25s var(--mz-spring);
}
.mz-scroll-bottom.show {
    opacity:1; transform:translateY(0) scale(1); pointer-events:auto;
}
.mz-scroll-bottom:hover {
    transform:translateY(-3px) scale(1.1);
    color:#fff; background:var(--mz-grad);
    box-shadow:0 8px 22px rgba(99,102,241,.5);
}
.mz-scroll-badge {
    position:absolute; top:-5px; right:-5px;
    min-width:19px; height:19px; padding:0 5px;
    border-radius:999px; background:var(--mz-danger);
    color:#fff; font-size:.62rem; font-weight:800;
    display:none; align-items:center; justify-content:center;
    box-shadow:0 3px 8px rgba(239,68,68,.5);
}
.mz-scroll-bottom.has-new .mz-scroll-badge { display:flex; }

/* ═══════════════ COMPOSER ═══════════════ */
.mz-foot {
    padding:10px 16px 14px; flex:0 0 auto;
    border-top:1px solid var(--mz-glass-border);
    background:var(--mz-glass-soft);
    backdrop-filter:var(--mz-blur-soft);
    -webkit-backdrop-filter:var(--mz-blur-soft);
    box-shadow:inset 0 1px 0 var(--mz-glass-hl);
    position:relative; z-index:6;
}

/* Reply bar */
.mz-reply-bar {
    display:flex; align-items:center; gap:9px; margin-bottom:8px;
    background:var(--mz-grad-soft); border-radius:12px;
    padding:8px 12px; border-left:3px solid var(--mz-brand2);
    animation:mzSlideDown .22s ease both;
    box-shadow:inset 0 0 0 1px var(--mz-border-soft);
}
.mz-reply-info { flex:1; min-width:0; }
.mz-reply-label {
    font-size:.73rem; font-weight:800; color:var(--mz-brand2); margin-bottom:1px;
}
.mz-reply-snippet {
    font-size:.78rem; color:var(--mz-muted);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.mz-reply-x {
    cursor:pointer; color:var(--mz-muted); flex:0 0 auto;
    transition:transform .15s var(--mz-spring), color .15s;
    width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    border-radius:8px;
}
.mz-reply-x:hover { color:var(--mz-danger); transform:rotate(90deg); background:rgba(239,68,68,.1); }

/* File chip */
.mz-filechip {
    display:flex; align-items:center; gap:8px; margin-bottom:8px;
    font-size:.8rem; color:var(--mz-text);
    background:var(--mz-grad-soft); border:1px solid var(--mz-border);
    border-radius:12px; padding:8px 12px;
    animation:mzSlideDown .22s ease both;
}
.mz-filechip > i { color:var(--mz-brand2); }
.mz-filechip .x {
    cursor:pointer; color:var(--mz-danger); margin-left:auto;
    transition:transform .15s var(--mz-spring);
}
