{% load static %}
<style>
/* ═══════════════════════════════════════════════════════════════════
   MZ MESSENGER — "CALM" REDESIGN (v4)
   Yassi, tinch va o'qilishi oson dizayn: bitta binafsha aksent,
   hairline chegaralar, chuqurlik faqat suzuvchi elementlarda.
   CSS klass nomlari _messenger_script.html bilan 1:1 saqlangan.
   ═══════════════════════════════════════════════════════════════════ */

/* ───────────────────────── TOKENS ───────────────────────── */
:root {
    --mz-bg:          #eef0f6;          /* sahifa foni ostidagi yuza */
    --mz-panel:       #ffffff;          /* asosiy panellar */
    --mz-panel-2:     #f5f6fa;          /* ikkilamchi yuza (body foni, inputlar) */
    --mz-panel-3:     #eceef5;          /* bosilgan/hover yuzalar */
    --mz-border:      rgba(15, 23, 42, .10);
    --mz-border-soft: rgba(15, 23, 42, .06);
    --mz-text:        #101322;
    --mz-muted:       #5b6478;
    --mz-muted-2:     #98a0b3;

    --mz-accent:      #6d28d9;
    --mz-accent-2:    #7c3aed;
    --mz-on-accent:   #ffffff;
    --mz-accent-soft: rgba(109, 40, 217, .10);
    --mz-accent-ring: rgba(109, 40, 217, .22);

    --mz-me-bubble:   linear-gradient(160deg, #7c3aed, #6d28d9);
    --mz-me-text:     #f4f0ff;
    --mz-me-muted:    rgba(244, 240, 255, .72);

    --mz-danger:      #dc2626;
    --mz-danger-soft: rgba(220, 38, 38, .10);
    --mz-online:      #16a34a;
    --mz-warn:        #d97706;

    --mz-shadow-sm:   0 1px 2px rgba(15, 23, 42, .05);
    --mz-shadow-md:   0 10px 30px -12px rgba(15, 23, 42, .22);
    --mz-shadow-lg:   0 24px 60px -20px rgba(15, 23, 42, .30);

    --mz-r-lg: 20px;
    --mz-r-md: 14px;
    --mz-r-sm: 10px;
    --mz-ease: cubic-bezier(.4, 0, .2, 1);

    /* Glassmorphism tokenlar — shaffof oynalar */
    --mz-glass:        rgba(255, 255, 255, .58);   /* yirik panellar (sidebar/footer) */
    --mz-glass-strong: rgba(255, 255, 255, .74);   /* header kabi muhim panellar */
    --mz-glass-bubble: rgba(255, 255, 255, .82);   /* qoshimcha bubble */
    --mz-glass-border: rgba(255, 255, 255, .55);   /* shisha chegarasi (yorug'lik) */
    --mz-blur:         blur(22px) saturate(160%);
    --mz-blur-sm:      blur(14px) saturate(140%);
}
[data-bs-theme="dark"] {
    --mz-bg:          #0b0d13;
    --mz-panel:       #12141d;
    --mz-panel-2:     #181b26;
    --mz-panel-3:     #1f2331;
    --mz-border:      rgba(255, 255, 255, .10);
    --mz-border-soft: rgba(255, 255, 255, .06);
    --mz-text:        #e9ebf3;
    --mz-muted:       #9aa2b6;
    --mz-muted-2:     #6a7288;

    --mz-accent:      #a78bfa;
    --mz-accent-2:    #8b5cf6;
    --mz-on-accent:   #17102b;
    --mz-accent-soft: rgba(167, 139, 250, .13);
    --mz-accent-ring: rgba(167, 139, 250, .28);

    --mz-me-bubble:   linear-gradient(160deg, #6d28d9, #5b21b6);
    --mz-me-text:     #f1ecff;
    --mz-me-muted:    rgba(241, 236, 255, .66);

    --mz-danger:      #f87171;
    --mz-danger-soft: rgba(248, 113, 113, .13);
    --mz-online:      #34d399;
    --mz-warn:        #fbbf24;

    --mz-shadow-sm:   0 1px 2px rgba(0, 0, 0, .35);
    --mz-shadow-md:   0 10px 30px -12px rgba(0, 0, 0, .55);
    --mz-shadow-lg:   0 24px 60px -20px rgba(0, 0, 0, .70);

    /* Glassmorphism tokenlar (dark) */
    --mz-glass:        rgba(20, 23, 34, .58);
    --mz-glass-strong: rgba(20, 23, 34, .78);
    --mz-glass-bubble: rgba(26, 30, 44, .82);
    --mz-glass-border: rgba(255, 255, 255, .10);
}

@media (prefers-reduced-motion: reduce) {
    .mz-shell *, .mz-toast, .mz-emoji-pop { animation: none !important; transition: none !important; }
}

/* ───────────────────────── SHELL ───────────────────────── */
#mzPageWrap { position: relative; }

.mz-shell {
    display: flex;
    position: relative;
    max-width: 1360px;
    margin: 0 auto;
    height: calc(100vh - 88px);
    min-height: 540px;
    border-radius: var(--mz-r-lg);
    border: 1px solid var(--mz-glass-border);
    background: var(--mz-panel);
    box-shadow: var(--mz-shadow-md);
    overflow: hidden;
}

/* Shaffof oynalar ostidagi jonli gradient "aurora" qatlami —
   glass panellar shu fonni xiralashtirib (blur) ko'rsatadi */
.mz-shell::before {
    content: '';
    position: absolute; inset: 0; z-index: 0;
    background:
        radial-gradient(640px 420px at 12% 8%,  rgba(124, 58, 237, .20), transparent 62%),
        radial-gradient(520px 380px at 88% 12%, rgba(14, 165, 233, .17), transparent 60%),
        radial-gradient(720px 520px at 55% 108%, rgba(236, 72, 153, .13), transparent 66%),
        radial-gradient(420px 320px at 30% 85%, rgba(52, 211, 153, .10), transparent 60%);
    pointer-events: none;
}
.mz-shell::after {
    content: '';
    position: absolute; z-index: 0; pointer-events: none;
    width: 420px; height: 420px; border-radius: 50%;
    right: -120px; top: -140px;
    background: radial-gradient(circle, rgba(124, 58, 237, .14), transparent 65%);
    animation: mzAurora 16s ease-in-out infinite alternate;
}
@keyframes mzAurora {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(-90px, 70px) scale(1.15); }
}
[data-bs-theme="dark"] .mz-shell::before {
    background:
        radial-gradient(640px 420px at 12% 8%,  rgba(124, 58, 237, .28), transparent 62%),
        radial-gradient(520px 380px at 88% 12%, rgba(14, 165, 233, .22), transparent 60%),
        radial-gradient(720px 520px at 55% 108%, rgba(236, 72, 153, .18), transparent 66%),
        radial-gradient(420px 320px at 30% 85%, rgba(52, 211, 153, .12), transparent 60%);
}

/* ── TO'LIQ EKRAN rejimi ── */
.mz-shell.mz-fullscreen,
.mz-shell:fullscreen {
    position: fixed; inset: 0; z-index: 2100;
    max-width: none; width: 100%;
    height: 100vh; height: 100dvh; min-height: 0;
    margin: 0; border-radius: 0; border: none;
}
#mzFullBtn.on { color: var(--mz-accent); background: var(--mz-accent-soft); }

/* ───────────────────────── SIDEBAR ───────────────────────── */
.mz-side {
    display: flex; flex-direction: column;
    flex: 0 0 340px; min-width: 0;
    position: relative; z-index: 1;
    border-right: 1px solid var(--mz-border-soft);
    background: var(--mz-glass);
    backdrop-filter: var(--mz-blur);
    -webkit-backdrop-filter: var(--mz-blur);
}

.mz-side-head { padding: 1.1rem 1rem 0.75rem; }
.mz-side-top-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.8rem;
}
.mz-side-title {
    font-size: 1.25rem; font-weight: 800;
    letter-spacing: -0.02em; color: var(--mz-text);
}
.mz-compose-btn {
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px; cursor: pointer;
    background: var(--mz-accent); color: var(--mz-on-accent);
    font-size: 1.05rem;
    transition: transform .15s var(--mz-ease), opacity .15s;
}
.mz-compose-btn:hover { opacity: .9; }
.mz-compose-btn:active { transform: scale(.94); }

.mz-search {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0 0.85rem;
    height: 40px;
    border-radius: 12px;
    border: 1px solid var(--mz-border-soft);
    background: var(--mz-panel-2);
    transition: border-color .15s, box-shadow .15s;
}
.mz-search:focus-within {
    border-color: var(--mz-accent);
    box-shadow: 0 0 0 3px var(--mz-accent-ring);
}
.mz-search i { color: var(--mz-muted-2); font-size: 0.9rem; }
.mz-search input {
    flex: 1; min-width: 0;
    border: none; background: transparent; outline: none;
    color: var(--mz-text); font-size: 0.88rem;
}
.mz-search input::placeholder { color: var(--mz-muted-2); }

/* Filtrlar */
.mz-filters {
    display: flex; gap: 0.35rem;
    padding: 0.65rem 1rem;
    overflow-x: auto; scrollbar-width: none;
}
.mz-filters::-webkit-scrollbar { display: none; }
.mz-filter {
    display: inline-flex; align-items: center; gap: 0.35rem;
    padding: 0.36rem 0.8rem;
    border-radius: 999px;
    font-size: 0.8rem; font-weight: 600;
    color: var(--mz-muted); background: var(--mz-panel-2);
    cursor: pointer; white-space: nowrap; user-select: none;
    border: 1px solid transparent;
    transition: background .15s, color .15s;
}
.mz-filter:hover { background: var(--mz-panel-3); color: var(--mz-text); }
.mz-filter.active {
    background: var(--mz-accent); color: var(--mz-on-accent);
}
.mz-filter-count {
    display: none;
    min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 999px;
    background: var(--mz-danger); color: #fff;
    font-size: 0.68rem; font-weight: 700;
    align-items: center; justify-content: center;
}
.mz-filter-count.show { display: inline-flex; }
.mz-filter.active .mz-filter-count { background: rgba(255,255,255,.28); color: inherit; }

/* Ro'yxat */
.mz-list {
    flex: 1; overflow-y: auto;
    padding: 0.25rem 0.6rem 0.9rem;
}
.mz-list::-webkit-scrollbar { width: 5px; }
.mz-list::-webkit-scrollbar-thumb { background: var(--mz-border); border-radius: 99px; }

.mz-sec-label {
    display: flex; align-items: center; gap: 0.45rem;
    padding: 0.85rem 0.5rem 0.4rem;
    font-size: 0.7rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--mz-muted-2);
}

.mz-row {
    display: flex; align-items: center; gap: 0.7rem;
    padding: 0.6rem 0.55rem;
    border-radius: var(--mz-r-md);
    cursor: pointer; user-select: none;
    transition: background .12s;
}
.mz-row:hover { background: var(--mz-panel-2); }
.mz-row.active { background: var(--mz-accent-soft); }
.mz-row.active .mz-row-name { color: var(--mz-accent); }

.mz-row-ava, .mz-row-ava-fb {
    width: 48px; height: 48px;
    border-radius: 50%;
    object-fit: cover; flex-shrink: 0;
}
.mz-row-ava-fb {
    display: flex; align-items: center; justify-content: center;
    background: var(--mz-accent-soft); color: var(--mz-accent);
    font-weight: 700; font-size: 0.95rem;
}
.mz-row-dot {
    position: absolute; right: 0; bottom: 2px;
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--mz-panel);
    background: var(--mz-muted-2);
}
.mz-row-dot.on { background: var(--mz-online); }
.mz-row-kind {
    position: absolute; right: -2px; bottom: -2px;
    width: 19px; height: 19px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem;
    background: var(--mz-accent); color: var(--mz-on-accent);
    border: 2px solid var(--mz-panel);
}

.mz-row-body { flex: 1; min-width: 0; }
.mz-row-top {
    display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem;
}
.mz-row-name {
    font-weight: 700; font-size: 0.9rem; color: var(--mz-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mz-row-time { font-size: 0.72rem; color: var(--mz-muted-2); flex-shrink: 0; }
.mz-row-bottom {
    display: flex; align-items: center; gap: 0.4rem;
    margin-top: 2px;
}
.mz-row-last {
    flex: 1; min-width: 0;
    font-size: 0.8rem; color: var(--mz-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mz-row-last-ic { font-size: 0.75rem; margin-right: 3px; color: var(--mz-muted-2); }
.mz-row-pin { font-size: 0.72rem; color: var(--mz-muted-2); flex-shrink: 0; }
.mz-row-badge {
    min-width: 20px; height: 20px; padding: 0 6px;
    border-radius: 999px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--mz-accent); color: var(--mz-on-accent);
    font-size: 0.7rem; font-weight: 700;
}

/* Bo'sh holat */
.mz-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.5rem; padding: 2.5rem 1rem;
    color: var(--mz-muted-2); font-size: 0.85rem; text-align: center;
}
.mz-empty i { font-size: 1.6rem; }
.mz-body .mz-empty { margin: auto; }

/* Skeletonlar */
@keyframes mzShimmer { from { opacity: .45; } 50% { opacity: 1; } to { opacity: .45; } }
.mz-skel {
    background: var(--mz-panel-3);
    border-radius: 8px;
    animation: mzShimmer 1.4s ease-in-out infinite;
}
.mz-skel-row { display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0.55rem; }
.mz-skel-ava { width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; }
.mz-skel-lines { flex: 1; display: flex; flex-direction: column; gap: 7px; }
.mz-skel-line { height: 11px; }
.mz-skel-line.w70 { width: 70%; }
.mz-skel-line.w45 { width: 45%; }
.mz-skel-msg { height: 44px; border-radius: var(--mz-r-md); margin: 0.45rem 0; }
.mz-skel-msg.me { margin-left: auto; border-bottom-right-radius: 6px; }
.mz-skel-msg.other { margin-right: auto; border-bottom-left-radius: 6px; }

/* ───────────────────────── MAIN ───────────────────────── */
.mz-main {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    position: relative; z-index: 1;
    background: transparent;
}

/* Sarlavha — shaffof shisha panel */
.mz-head {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.65rem 1rem;
    background: var(--mz-glass-strong);
    backdrop-filter: var(--mz-blur-sm);
    -webkit-backdrop-filter: var(--mz-blur-sm);
    border-bottom: 1px solid var(--mz-border-soft);
    flex-shrink: 0; z-index: 5;
}
.mz-back {
    display: none;
    width: 36px; height: 36px; flex-shrink: 0;
    border-radius: 10px; cursor: pointer;
    align-items: center; justify-content: center;
    color: var(--mz-muted); font-size: 1.1rem;
}
.mz-back:hover { background: var(--mz-panel-2); color: var(--mz-text); }

.mz-ava, .mz-ava-fb {
    width: 42px; height: 42px;
    border-radius: 50%; object-fit: cover; flex-shrink: 0;
}
.mz-ava-fb {
    display: flex; align-items: center; justify-content: center;
    background: var(--mz-accent-soft); color: var(--mz-accent);
    font-weight: 700; font-size: 0.9rem;
}
.mz-h-name { font-weight: 700; font-size: 0.95rem; color: var(--mz-text); }
.mz-h-sub {
    display: flex; align-items: center; gap: 0.35rem;
    font-size: 0.76rem; color: var(--mz-muted);
}
.mz-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--mz-muted-2); flex-shrink: 0;
}
.mz-dot.on { background: var(--mz-online); }
@keyframes mzSubIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.mz-sub-fade { display: inline-block; animation: mzSubIn .3s var(--mz-ease); }

.mz-head-actions { display: flex; align-items: center; gap: 0.15rem; margin-left: auto; }
.mz-icon-btn {
    width: 36px; height: 36px;
    border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--mz-muted); font-size: 1rem;
    transition: background .12s, color .12s;
}
.mz-icon-btn:hover { background: var(--mz-panel-2); color: var(--mz-text); }
.mz-pin-btn.pinned { color: var(--mz-warn); }
@media (max-width: 560px) { .mz-icon-btn.mz-optional { display: none; } }

/* Xabarlar maydoni */
.mz-body {
    flex: 1; overflow-y: auto;
    padding: 1rem 1.1rem 0.6rem;
    display: flex; flex-direction: column;
}
.mz-body::-webkit-scrollbar { width: 5px; }
.mz-body::-webkit-scrollbar-thumb { background: var(--mz-border); border-radius: 99px; }

/* Xabar qatori */
.mz-row-msg {
    display: flex; align-items: flex-end; gap: 0.5rem;
    margin: 0.14rem 0;
    position: relative;
    max-width: 100%;
}
.mz-row-msg.me { flex-direction: row-reverse; }
.mz-row-msg:not(.mz-grouped) { margin-top: 0.6rem; }

.mz-msg-ava, .mz-msg-ava-fb {
    width: 30px; height: 30px;
    border-radius: 50%; object-fit: cover; flex-shrink: 0;
}
.mz-msg-ava-fb {
    display: flex; align-items: center; justify-content: center;
    background: var(--mz-accent-soft); color: var(--mz-accent);
    font-weight: 700; font-size: 0.68rem;
}
.mz-row-msg.mz-grouped .mz-msg-ava,
.mz-row-msg.mz-grouped .mz-msg-ava-fb { visibility: hidden; }

.mz-bubble-wrap { position: relative; max-width: min(76%, 560px); }

.mz-bubble {
    padding: 0.55rem 0.8rem;
    border-radius: var(--mz-r-md);
    font-size: 0.9rem; line-height: 1.5;
    word-break: break-word;
    background: var(--mz-glass-bubble);
    backdrop-filter: var(--mz-blur-sm);
    -webkit-backdrop-filter: var(--mz-blur-sm);
    color: var(--mz-text);
    border: 1px solid var(--mz-border-soft);
    box-shadow: var(--mz-shadow-sm);
}
.mz-row-msg.other .mz-bubble { border-bottom-left-radius: 6px; }
.mz-row-msg.me .mz-bubble {
    background: var(--mz-me-bubble);
    color: var(--mz-me-text);
    border: none;
    border-bottom-right-radius: 6px;
}
.mz-row-msg.mz-grouped.other .mz-bubble { border-top-left-radius: 6px; }
.mz-row-msg.mz-grouped.me .mz-bubble { border-top-right-radius: 6px; }
.mz-row-msg.mz-grouped .mz-sender { display: none; }

.mz-sender {
    font-size: 0.74rem; font-weight: 700;
    color: var(--mz-accent);
    margin-bottom: 2px;
}

/* Iqtibos (reply) */
.mz-quote {
    display: flex; flex-direction: column;
    padding: 0.35rem 0.6rem;
    margin-bottom: 0.35rem;
    border-left: 3px solid var(--mz-accent);
    border-radius: 6px;
    background: var(--mz-accent-soft);
    cursor: pointer;
    font-size: 0.78rem;
}
.mz-row-msg.me .mz-quote {
    border-left-color: rgba(255, 255, 255, .75);
    background: rgba(255, 255, 255, .14);
}
.mz-quote .qn { font-weight: 700; color: var(--mz-accent); }
.mz-row-msg.me .mz-quote .qn { color: var(--mz-me-text); }
.mz-quote .qs {
    color: var(--mz-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 320px;
}
.mz-row-msg.me .mz-quote .qs { color: var(--mz-me-muted); }

.mz-msg-text { white-space: pre-line; }
.mz-link { color: var(--mz-accent); text-decoration: underline; word-break: break-all; }
.mz-row-msg.me .mz-link { color: var(--mz-me-text); }

/* Fayl / rasm */
.mz-file {
    display: inline-flex; align-items: center; gap: 0.45rem;
    margin-top: 0.35rem;
    color: inherit; text-decoration: none;
    font-size: 0.84rem; font-weight: 600;
    max-width: 100%;
}
.mz-file:hover { color: inherit; text-decoration: underline; }
.mz-file img {
    display: block;
    max-width: 100%; max-height: 320px;
    border-radius: 12px;
    margin-top: 0.15rem;
}

/* Teg (tahrirlangan / forward) */
.mz-tag {
    display: inline-flex; align-items: center; gap: 0.3rem;
    font-size: 0.7rem; font-style: italic;
    color: var(--mz-muted-2);
    margin-top: 0.25rem;
}
.mz-row-msg.me .mz-tag { color: var(--mz-me-muted); }

/* Reaksiyalar */
.mz-react-row { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.4rem; }
.mz-react-pill {
    display: inline-flex; align-items: center; gap: 0.2rem;
    padding: 0.12rem 0.5rem;
    border-radius: 999px;
    font-size: 0.75rem; cursor: pointer; user-select: none;
    background: var(--mz-panel-2);
    border: 1px solid var(--mz-border-soft);
    color: var(--mz-text);
    transition: transform .12s;
}
.mz-react-pill:hover { transform: scale(1.08); }
.mz-react-pill.mine {
    background: var(--mz-accent-soft);
    border-color: var(--mz-accent);
    color: var(--mz-accent);
    font-weight: 700;
}
.mz-row-msg.me .mz-react-pill {
    background: rgba(255, 255, 255, .16);
    border-color: transparent;
    color: var(--mz-me-text);
}
.mz-row-msg.me .mz-react-pill.mine { border-color: rgba(255, 255, 255, .65); }

/* Meta qator: vaqt + ticklar */
.mz-meta-row {
    display: flex; align-items: center; justify-content: flex-end; gap: 0.35rem;
    margin-top: 0.2rem;
}
.mz-time { font-size: 0.68rem; color: var(--mz-muted-2); }
.mz-row-msg.me .mz-time { color: var(--mz-me-muted); }
.mz-tick { font-size: 0.85rem; color: var(--mz-me-muted); }
.mz-tick.read { color: #7dd3fc; }

/* Amallar paneli (hover) — shisha */
.mz-actions {
    position: absolute; top: -34px;
    display: flex; gap: 2px;
    padding: 3px 4px;
    border-radius: 12px;
    background: var(--mz-glass-strong);
    backdrop-filter: var(--mz-blur-sm);
    -webkit-backdrop-filter: var(--mz-blur-sm);
    border: 1px solid var(--mz-glass-border);
    box-shadow: var(--mz-shadow-md);
    opacity: 0; transform: translateY(6px);
    pointer-events: none; z-index: 7;
    transition: opacity .18s, transform .18s var(--mz-ease);
}
.mz-row-msg.me .mz-actions { right: 0; }
.mz-row-msg.other .mz-actions { left: 0; }
.mz-row-msg:hover .mz-actions,
.mz-row-msg:focus-within .mz-actions {
    opacity: 1; transform: none; pointer-events: auto;
}
.mz-act-btn {
    width: 30px; height: 30px;
    border-radius: 9px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.82rem; color: var(--mz-muted);
    transition: background .12s, color .12s;
}
.mz-act-btn:hover { background: var(--mz-accent-soft); color: var(--mz-accent); }
.mz-act-btn.danger:hover { background: var(--mz-danger-soft); color: var(--mz-danger); }

/* Reaksiya tanlash pop-up */
@keyframes mzPopIn { from { opacity: 0; transform: translateY(6px) scale(.92); } to { opacity: 1; transform: none; } }
.mz-emoji-pop {
    position: absolute; top: -46px; left: 0;
    display: flex; gap: 2px;
    padding: 5px 7px;
    border-radius: 999px;
    background: var(--mz-glass-strong);
    backdrop-filter: var(--mz-blur-sm);
    -webkit-backdrop-filter: var(--mz-blur-sm);
    border: 1px solid var(--mz-glass-border);
    box-shadow: var(--mz-shadow-md);
    z-index: 9;
    animation: mzPopIn .16s var(--mz-ease);
}
.mz-row-msg.me .mz-emoji-pop { left: auto; right: 0; }
.mz-emoji-pop span {
    font-size: 1.15rem; cursor: pointer;
    padding: 2px 4px; border-radius: 8px;
    transition: transform .12s;
}
.mz-emoji-pop span:hover { transform: scale(1.25); }

/* "Yangi xabarlar" ajratgichi */
.mz-new-divider {
    display: flex; align-items: center; gap: 0.75rem;
    margin: 0.9rem 0;
}
.mz-new-divider::before, .mz-new-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--mz-accent-ring);
}
.mz-new-divider span {
    font-size: 0.72rem; font-weight: 700;
    color: var(--mz-accent);
    text-transform: uppercase; letter-spacing: 0.06em;
}

/* Typing indikatori */
.mz-typing {
    padding: 0.25rem 1.25rem 0.35rem;
    font-size: 0.76rem; color: var(--mz-muted);
    background: transparent;
    flex-shrink: 0;
}
.mz-typing-dots { display: inline-flex; gap: 3px; margin-left: 5px; vertical-align: middle; }
.mz-typing-dots i {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--mz-accent);
    animation: mzTyping 1.2s ease-in-out infinite;
}
.mz-typing-dots i:nth-child(2) { animation-delay: .15s; }
.mz-typing-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes mzTyping { 0%, 60%, 100% { transform: none; opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }

/* ───────────────────────── COMPOSER ───────────────────────── */
.mz-foot {
    padding: 0.7rem 1rem 0.85rem;
    background: var(--mz-glass-strong);
    backdrop-filter: var(--mz-blur-sm);
    -webkit-backdrop-filter: var(--mz-blur-sm);
    border-top: 1px solid var(--mz-border-soft);
    flex-shrink: 0; position: relative;
}

.mz-reply-bar {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.45rem 0.75rem;
    margin-bottom: 0.55rem;
    border-radius: var(--mz-r-sm);
    background: var(--mz-accent-soft);
    border-left: 3px solid var(--mz-accent);
}
.mz-reply-info { flex: 1; min-width: 0; }
.mz-reply-label { font-size: 0.74rem; font-weight: 700; color: var(--mz-accent); }
.mz-reply-snippet {
    font-size: 0.78rem; color: var(--mz-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mz-reply-x {
    cursor: pointer; color: var(--mz-muted);
    width: 28px; height: 28px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px; font-size: 0.8rem;
}
.mz-reply-x:hover { background: var(--mz-panel); color: var(--mz-text); }

.mz-filechip {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.35rem 0.7rem;
    margin-bottom: 0.55rem;
    border-radius: 999px;
    background: var(--mz-panel-2);
    border: 1px solid var(--mz-border-soft);
    font-size: 0.8rem; color: var(--mz-text);
}
.mz-filechip i { color: var(--mz-accent); }
.mz-filechip .x { cursor: pointer; color: var(--mz-muted); font-size: 0.75rem; }
.mz-filechip .x:hover { color: var(--mz-danger); }

.mz-emoji-panel {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
    gap: 2px;
    max-height: 210px; overflow-y: auto;
    padding: 0.6rem;
    margin-bottom: 0.55rem;
    border-radius: var(--mz-r-md);
    background: var(--mz-panel-2);
    border: 1px solid var(--mz-border-soft);
}
.mz-emoji-panel span {
    font-size: 1.3rem; text-align: center;
    padding: 4px 0; border-radius: 8px; cursor: pointer;
    transition: background .12s, transform .12s;
}
.mz-emoji-panel span:hover { background: var(--mz-panel-3); transform: scale(1.15); }

.mz-form { display: flex; align-items: flex-end; gap: 0.4rem; }
.mz-attach, .mz-emoji-btn {
    width: 40px; height: 40px; flex-shrink: 0;
    border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--mz-muted); font-size: 1.1rem;
    margin-bottom: 1px;
    transition: background .12s, color .12s;
}
.mz-attach:hover, .mz-emoji-btn:hover { background: var(--mz-panel-2); color: var(--mz-accent); }

.mz-input {
    flex: 1; min-width: 0;
    resize: none; outline: none;
    max-height: 120px;
    padding: 0.55rem 0.9rem;
    border-radius: var(--mz-r-md);
    border: 1px solid var(--mz-border-soft);
    background: var(--mz-panel-2);
    color: var(--mz-text);
    font-size: 0.9rem; line-height: 1.45;
    transition: border-color .15s, box-shadow .15s;
}
.mz-input::placeholder { color: var(--mz-muted-2); }
.mz-input:focus {
    border-color: var(--mz-accent);
    box-shadow: 0 0 0 3px var(--mz-accent-ring);
}

.mz-send {
    width: 42px; height: 42px; flex-shrink: 0;
    border: none; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: var(--mz-accent); color: var(--mz-on-accent);
    font-size: 1rem;
    transition: transform .15s var(--mz-ease), opacity .15s, background .15s;
}
.mz-send:hover { opacity: .9; }
.mz-send:active { transform: scale(.92); }
.mz-send.editing { background: var(--mz-online); color: #fff; }

/* ───────────────────────── PLACEHOLDER ───────────────────────── */
.mz-placeholder {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0.4rem; padding: 2rem;
    text-align: center;
}
.mz-placeholder-scene { position: relative; margin-bottom: 1.25rem; }
.mz-placeholder-icon-wrap {
    width: 96px; height: 96px;
    border-radius: 30px;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.6rem;
    background: var(--mz-accent-soft); color: var(--mz-accent);
}
.mz-ph-dot {
    position: absolute;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--mz-accent);
    opacity: .35;
    animation: mzFloat 3.2s ease-in-out infinite;
}
.mz-ph-dot:nth-child(1) { top: -8px; left: -14px; animation-delay: 0s; }
.mz-ph-dot:nth-child(2) { top: 12px; right: -18px; width: 7px; height: 7px; animation-delay: .5s; }
.mz-ph-dot:nth-child(3) { bottom: -6px; left: 20px; width: 6px; height: 6px; animation-delay: 1s; }
@keyframes mzFloat { 0%, 100% { transform: none; } 50% { transform: translateY(-7px); } }

.mz-placeholder h3 { font-size: 1.15rem; font-weight: 800; color: var(--mz-text); margin: 0; }
.mz-placeholder p { font-size: 0.85rem; color: var(--mz-muted); max-width: 300px; margin: 0; }
.mz-ph-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin-top: 0.9rem; }
.mz-ph-chip {
    display: inline-flex; align-items: center; gap: 0.35rem;
    padding: 0.35rem 0.8rem;
    border-radius: 999px;
    font-size: 0.76rem; font-weight: 600;
    background: var(--mz-panel);
    border: 1px solid var(--mz-border-soft);
    color: var(--mz-muted);
}
.mz-ph-chip i { color: var(--mz-accent); }

/* Pastga tushish tugmasi */
.mz-scroll-bottom {
    position: absolute; right: 18px; bottom: 92px;
    width: 42px; height: 42px;
    border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: var(--mz-glass-strong); color: var(--mz-muted);
    backdrop-filter: var(--mz-blur-sm);
    -webkit-backdrop-filter: var(--mz-blur-sm);
    border: 1px solid var(--mz-glass-border);
    box-shadow: var(--mz-shadow-md);
    font-size: 1rem; z-index: 8;
    opacity: 0; transform: translateY(10px);
    pointer-events: none;
    transition: opacity .2s, transform .2s var(--mz-ease);
}
.mz-scroll-bottom.show { opacity: 1; transform: none; pointer-events: auto; }
.mz-scroll-bottom:hover { color: var(--mz-accent); }
.mz-scroll-badge {
    display: none;
    position: absolute; top: -3px; right: -3px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--mz-accent);
    border: 2px solid var(--mz-panel);
}
.mz-scroll-bottom.has-new .mz-scroll-badge { display: block; }

/* ───────────────────────── INFO PANEL ───────────────────────── */
.mz-info {
    flex: 0 0 0px; width: auto;
    display: flex; flex-direction: column;
    position: relative; z-index: 1;
    background: var(--mz-glass);
    backdrop-filter: var(--mz-blur);
    -webkit-backdrop-filter: var(--mz-blur);
    border-left: 1px solid transparent;
    overflow: hidden;
    transition: flex-basis .25s var(--mz-ease), border-color .25s;
}
.mz-shell.mz-info-open .mz-info {
    flex-basis: 320px;
    border-left-color: var(--mz-border-soft);
}
.mz-info > * { min-width: 320px; }

.mz-info-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.1rem 0.6rem;
}
.mz-info-title { font-weight: 800; font-size: 0.95rem; color: var(--mz-text); }
.mz-info-x {
    width: 30px; height: 30px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    border-radius: 9px; color: var(--mz-muted); font-size: 0.85rem;
}
.mz-info-x:hover { background: var(--mz-panel-2); color: var(--mz-text); }

.mz-info-hero {
    display: flex; flex-direction: column; align-items: center;
    padding: 0.75rem 1rem 1.1rem;
    text-align: center;
}
.mz-info-ava {
    width: 76px; height: 76px;
    border-radius: 50%; object-fit: cover;
    display: flex; align-items: center; justify-content: center;
    background: var(--mz-accent-soft); color: var(--mz-accent);
    font-weight: 800; font-size: 1.5rem;
    margin-bottom: 0.7rem;
}
.mz-info-name { font-weight: 800; font-size: 1rem; color: var(--mz-text); }
.mz-info-sub { font-size: 0.78rem; color: var(--mz-muted); margin-top: 2px; }

.mz-info-stats {
    display: flex; gap: 0.5rem;
    padding: 0 1.1rem 1rem;
}
.mz-stat {
    flex: 1; text-align: center;
    padding: 0.6rem 0.25rem;
    border-radius: var(--mz-r-sm);
    background: var(--mz-panel-2);
    border: 1px solid var(--mz-border-soft);
}
.mz-stat-num { font-weight: 800; font-size: 1.05rem; color: var(--mz-text); }
.mz-stat-num.online { color: var(--mz-online); }
.mz-stat-lbl { font-size: 0.68rem; color: var(--mz-muted-2); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }

.mz-info-tabs {
    display: flex; gap: 0.3rem;
    padding: 0 1.1rem;
    border-bottom: 1px solid var(--mz-border-soft);
}
.mz-info-tab {
    padding: 0.5rem 0.85rem;
    font-size: 0.82rem; font-weight: 700;
    color: var(--mz-muted); cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color .12s, border-color .12s;
}
.mz-info-tab:hover { color: var(--mz-text); }
.mz-info-tab.active { color: var(--mz-accent); border-bottom-color: var(--mz-accent); }

.mz-info-scroll { flex: 1; overflow-y: auto; padding: 0.75rem 1.1rem 1.25rem; }
.mz-info-scroll::-webkit-scrollbar { width: 5px; }
.mz-info-scroll::-webkit-scrollbar-thumb { background: var(--mz-border); border-radius: 99px; }

.mz-info-pane { display: flex; flex-direction: column; }

.mz-info-section-label {
    font-size: 0.7rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--mz-muted-2);
    padding: 0.75rem 0 0.4rem;
}
.mz-info-empty {
    text-align: center; padding: 1.75rem 0.5rem;
    color: var(--mz-muted-2); font-size: 0.82rem;
}
.mz-info-empty i { display: block; font-size: 1.5rem; margin-bottom: 0.4rem; }

/* A'zolar */
.mz-member {
    display: flex; align-items: center; gap: 0.65rem;
    padding: 0.5rem 0.35rem;
    border-radius: var(--mz-r-sm);
}
.mz-member:hover { background: var(--mz-panel-2); }
.mz-member-pic { position: relative; flex-shrink: 0; }
.mz-member-ava, .mz-member-ava-fb {
    width: 38px; height: 38px;
    border-radius: 50%; object-fit: cover;
}
.mz-member-ava-fb {
    display: flex; align-items: center; justify-content: center;
    background: var(--mz-accent-soft); color: var(--mz-accent);
    font-weight: 700; font-size: 0.78rem;
}
.mz-member-dot {
    position: absolute; right: 0; bottom: 0;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--mz-muted-2);
    border: 2px solid var(--mz-panel);
}
.mz-member-dot.on { background: var(--mz-online); }
.mz-member-body { flex: 1; min-width: 0; }
.mz-member-name {
    font-size: 0.85rem; font-weight: 700; color: var(--mz-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mz-member-status { font-size: 0.72rem; color: var(--mz-muted-2); }
.mz-member-role {
    flex-shrink: 0;
    padding: 0.14rem 0.5rem;
    border-radius: 999px;
    font-size: 0.64rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em;
}
.mz-member-role.admin { background: var(--mz-danger-soft); color: var(--mz-danger); }
.mz-member-role.teacher { background: var(--mz-accent-soft); color: var(--mz-accent); }
.mz-member-role.student { background: var(--mz-panel-3); color: var(--mz-muted); }

/* Media / fayllar */
.mz-media-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    margin-bottom: 0.5rem;
}
.mz-media-cell {
    display: block;
    aspect-ratio: 1;
    border-radius: 10px; overflow: hidden;
    background: var(--mz-panel-2);
}
.mz-media-cell img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform .25s var(--mz-ease);
}
.mz-media-cell:hover img { transform: scale(1.08); }

.mz-filecard {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.55rem 0.6rem;
    border-radius: var(--mz-r-sm);
    text-decoration: none;
    color: var(--mz-text);
    transition: background .12s;
}
.mz-filecard:hover { background: var(--mz-panel-2); color: var(--mz-text); }
.mz-filecard-ic {
    width: 38px; height: 38px; flex-shrink: 0;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: var(--mz-accent-soft); color: var(--mz-accent);
    font-size: 1rem;
}
.mz-filecard-body { flex: 1; min-width: 0; }
.mz-filecard-name {
    font-size: 0.82rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mz-filecard-meta { font-size: 0.7rem; color: var(--mz-muted-2); }

.mz-info-backdrop {
    display: none;
    position: fixed; inset: 0; z-index: 1049;
    background: rgba(9, 11, 18, .5);
}

/* ───────────────────────── FORWARD MODAL ───────────────────────── */
.mz-modal-backdrop {
    position: fixed; inset: 0; z-index: 1060;
    display: flex; align-items: center; justify-content: center;
    padding: 1rem;
    background: rgba(9, 11, 18, .45);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
}
.mz-modal {
    width: 100%; max-width: 400px;
    max-height: min(560px, 86vh);
    display: flex; flex-direction: column;
    border-radius: var(--mz-r-lg);
    background: var(--mz-glass-strong);
    backdrop-filter: var(--mz-blur);
    -webkit-backdrop-filter: var(--mz-blur);
    border: 1px solid var(--mz-glass-border);
    box-shadow: var(--mz-shadow-lg);
    overflow: hidden;
    animation: mzPopIn .18s var(--mz-ease);
}
.mz-modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.1rem 0.6rem;
    font-weight: 800; font-size: 0.95rem; color: var(--mz-text);
}
.mz-modal-x {
    width: 30px; height: 30px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    border-radius: 9px; color: var(--mz-muted); font-size: 0.85rem;
}
.mz-modal-x:hover { background: var(--mz-panel-2); color: var(--mz-text); }
.mz-modal-search {
    margin: 0 1.1rem 0.6rem;
    padding: 0.55rem 0.9rem;
    border-radius: var(--mz-r-sm);
    border: 1px solid var(--mz-border-soft);
    background: var(--mz-panel-2);
    color: var(--mz-text);
    font-size: 0.86rem; outline: none;
    transition: border-color .15s, box-shadow .15s;
}
.mz-modal-search:focus {
    border-color: var(--mz-accent);
    box-shadow: 0 0 0 3px var(--mz-accent-ring);
}
.mz-modal-list { flex: 1; overflow-y: auto; padding: 0 0.6rem 0.75rem; }
.mz-modal-list::-webkit-scrollbar { width: 5px; }
.mz-modal-list::-webkit-scrollbar-thumb { background: var(--mz-border); border-radius: 99px; }

/* ───────────────────────── TOAST ───────────────────────── */
@keyframes mzToastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.mz-toast {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.6rem 1.1rem;
    border-radius: 999px;
    background: var(--mz-glass-strong);
    backdrop-filter: var(--mz-blur-sm);
    -webkit-backdrop-filter: var(--mz-blur-sm);
    border: 1px solid var(--mz-glass-border);
    box-shadow: var(--mz-shadow-md);
    color: var(--mz-text);
    font-size: 0.84rem; font-weight: 600;
    animation: mzToastIn .22s var(--mz-ease);
    transition: opacity .3s, transform .3s;
}
.mz-toast i { color: var(--mz-accent); }
.mz-toast.hide { opacity: 0; transform: translateY(8px); }

/* ───────────────────────── RESPONSIVE ───────────────────────── */
@media (min-width: 1400px) {
    .mz-shell { height: calc(100vh - 108px); }
