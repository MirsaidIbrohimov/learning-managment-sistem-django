{% load static %}
<style>
/* ════════════════════════════════════════════════════════════════
   MZ MESSENGER — PREMIUM REDESIGN v2
   Discord × Telegram Premium × Slack × Linear aesthetic.
   Class names are kept 1:1 with _messenger_script.html — visual only.
   ════════════════════════════════════════════════════════════════ */
:root{
    /* ── Surfaces (light premium glass) ── */
    --mz-bg: #eef1f8;
    --mz-bg-2: #e6eaf4;
    --mz-panel: #ffffff;
    --mz-border: rgba(15,23,42,.08);
    --mz-border-soft: rgba(15,23,42,.05);
    --mz-muted: #64748b;
    --mz-muted-2: #94a3b8;
    --mz-text: #0f172a;
    --mz-other: #ffffff;

    /* ── Brand spectrum (purple-blue) ── */
    --mz-blue:   #3b82f6;
    --mz-brand1: #6366f1;
    --mz-brand2: #8b5cf6;
    --mz-brand3: #d946ef;
    --mz-brand1-a: rgba(99,102,241,.92);
    --mz-brand2-a: rgba(139,92,246,.92);
    --mz-brand3-a: rgba(217,70,239,.88);
    --mz-grad: linear-gradient(135deg,var(--mz-blue),var(--mz-brand1) 45%,var(--mz-brand2));
    --mz-grad-soft: linear-gradient(135deg,rgba(59,130,246,.16),rgba(139,92,246,.16));

    /* ── Interaction ── */
    --mz-hover: rgba(99,102,241,.08);
    --mz-active: rgba(99,102,241,.13);
    --mz-danger: #ef4444;
    --mz-online: #22c55e;
    --mz-online-glow: rgba(34,197,94,.5);

    /* ── Shadow / glow ── */
    --mz-shadow: 0 10px 30px rgba(15,23,42,.08);
    --mz-shadow-lg: 0 24px 70px rgba(15,23,42,.16);
    --mz-glow: 0 0 0 1px rgba(99,102,241,.25), 0 8px 28px rgba(99,102,241,.28);

    /* ── Ambient blobs ── */
    --mz-blob1: rgba(99,102,241,.40);
    --mz-blob2: rgba(217,70,239,.30);
    --mz-blob3: rgba(59,130,246,.30);

    /* ── Glass tokens ── */
    --mz-glass: rgba(255,255,255,.62);
    --mz-glass-soft: rgba(255,255,255,.42);
    --mz-glass-strong: rgba(255,255,255,.85);
    --mz-glass-border: rgba(255,255,255,.7);
    --mz-glass-highlight: rgba(255,255,255,.9);
    --mz-blur: blur(26px) saturate(165%);
    --mz-blur-soft: blur(15px) saturate(140%);

    /* ── Motion ── */
    --mz-spring: cubic-bezier(.34,1.56,.64,1);
    --mz-ease: cubic-bezier(.22,.61,.36,1);

    --mz-radius: 24px;
}
[data-bs-theme="dark"]{
    /* ── Deep-navy premium surfaces ── */
    --mz-bg: #0a1020;
    --mz-bg-2: #060a16;
    --mz-panel: #111a30;
    --mz-border: rgba(255,255,255,.08);
    --mz-border-soft: rgba(255,255,255,.05);
    --mz-muted: #93a1bd;
    --mz-muted-2: #64748b;
    --mz-text: #e8edf7;
    --mz-other: #16203a;

    --mz-hover: rgba(124,131,255,.12);
    --mz-active: rgba(124,131,255,.2);

    --mz-shadow: 0 12px 34px rgba(0,0,0,.5);
    --mz-shadow-lg: 0 30px 80px rgba(0,0,0,.62);
    --mz-glow: 0 0 0 1px rgba(124,131,255,.35), 0 10px 36px rgba(99,102,241,.45);

    --mz-blob1: rgba(99,102,241,.42);
    --mz-blob2: rgba(217,70,239,.30);
    --mz-blob3: rgba(59,130,246,.34);

    --mz-glass: rgba(17,26,48,.62);
    --mz-glass-soft: rgba(13,20,38,.5);
    --mz-glass-strong: rgba(20,30,54,.85);
    --mz-glass-border: rgba(255,255,255,.1);
    --mz-glass-highlight: rgba(255,255,255,.08);

    --mz-online-glow: rgba(34,197,94,.6);
}

@media (prefers-reduced-motion: reduce){
    #mzPageWrap *, #mzPageWrap *::before, #mzPageWrap *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
        scroll-behavior:auto !important;
    }
}

/* ════════════ AMBIENT BACKGROUND (gradient mesh) ════════════ */
#mzPageWrap{ position:relative; isolation:isolate; }
#mzPageWrap::before, #mzPageWrap::after{
    content:''; position:absolute; z-index:0; border-radius:50%;
    filter:blur(100px); pointer-events:none; opacity:.85;
    animation:mzAuroraMove 18s ease-in-out infinite;
}
#mzPageWrap::before{
    width:520px; height:520px; top:-160px; left:-130px;
    background:radial-gradient(circle, var(--mz-blob1), transparent 70%);
}
#mzPageWrap::after{
    width:480px; height:480px; bottom:-150px; right:-100px;
    background:radial-gradient(circle, var(--mz-blob2), transparent 70%);
    animation-delay:-9s; animation-direction:reverse;
}
/* third floating blob for richer mesh */
.mz-shell::after{
    content:''; position:absolute; z-index:0; pointer-events:none;
    width:360px; height:360px; top:40%; left:42%;
    background:radial-gradient(circle, var(--mz-blob3), transparent 72%);
    filter:blur(110px); opacity:.5; border-radius:50%;
    animation:mzAuroraMove 22s ease-in-out infinite; animation-delay:-4s;
}
@keyframes mzAuroraMove{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(36px,-26px) scale(1.1); }
}

.mz-shell{
    position:relative; z-index:1;
    max-width:1240px; margin:0 auto;
    display:flex;
    height:calc(100vh - 90px); min-height:540px;
    background:var(--mz-glass);
    backdrop-filter:var(--mz-blur);
    -webkit-backdrop-filter:var(--mz-blur);
    border:1px solid var(--mz-glass-border);
    border-radius:var(--mz-radius);
    overflow:hidden;
    box-shadow:var(--mz-shadow-lg), inset 0 1px 0 var(--mz-glass-highlight);
    animation:mzShellIn .5s var(--mz-ease) both;
}
/* gradient ring highlight on the shell edge */
.mz-shell::before{
    content:''; position:absolute; inset:0; z-index:5; pointer-events:none;
    border-radius:var(--mz-radius); padding:1px;
    background:linear-gradient(135deg, rgba(124,131,255,.55), transparent 35%, transparent 65%, rgba(217,70,239,.4));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; opacity:.7;
}
@keyframes mzShellIn{ from{opacity:0; transform:translateY(14px) scale(.99);} to{opacity:1; transform:translateY(0) scale(1);} }

/* ════════════════════ SIDEBAR ════════════════════ */
.mz-side{
    width:344px; flex:0 0 344px;
    display:flex; flex-direction:column;
    border-right:1px solid var(--mz-glass-border);
    background:var(--mz-glass-soft);
    min-width:0; position:relative; z-index:2;
}
.mz-side-head{ padding:16px 14px 8px; }
.mz-search{
    position:relative; display:flex; align-items:center;
    background:var(--mz-bg); border:1px solid var(--mz-border);
    border-radius:14px; padding:0 12px;
    transition:border-color .2s, box-shadow .2s, background .2s;
}
.mz-search:focus-within{ border-color:var(--mz-brand1); box-shadow:0 0 0 3px rgba(99,102,241,.18), var(--mz-shadow); }
.mz-search i{ color:var(--mz-muted); font-size:.95rem; }
.mz-search input{
    flex:1 1 auto; border:none; outline:none; background:transparent;
    color:var(--mz-text); padding:11px 8px; font-size:.88rem;
}
.mz-search input::placeholder{ color:var(--mz-muted-2); }

.mz-filters{ display:flex; gap:6px; padding:8px 14px 12px; }
.mz-filter{
    flex:1; text-align:center; padding:8px 6px; border-radius:11px;
    background:var(--mz-bg); border:1px solid var(--mz-border);
    color:var(--mz-muted); font-weight:600; font-size:.78rem; cursor:pointer;
    transition:transform .15s var(--mz-spring), background .25s, color .25s, box-shadow .25s;
    position:relative; overflow:hidden;
}
.mz-filter:hover{ transform:translateY(-1px); color:var(--mz-text); }
.mz-filter.active{
    background:var(--mz-grad);
    color:#fff; border-color:transparent;
    box-shadow:0 8px 20px rgba(99,102,241,.4);
}
.mz-filter.active::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.35), transparent);
    transform:translateX(-120%); animation:mzShine 2.4s ease-in-out infinite;
}
@keyframes mzShine{ 0%{transform:translateX(-120%);} 60%,100%{transform:translateX(120%);} }

.mz-list{ flex:1 1 auto; overflow-y:auto; padding:4px 8px 12px; scroll-behavior:smooth; }
.mz-list::-webkit-scrollbar{ width:7px; }
.mz-list::-webkit-scrollbar-thumb{ background:var(--mz-border); border-radius:8px; }
.mz-list::-webkit-scrollbar-thumb:hover{ background:var(--mz-brand1); }

.mz-row{
    display:flex; align-items:center; gap:12px;
    padding:10px 9px; border-radius:16px; cursor:pointer;
    transition:background .2s, transform .2s var(--mz-spring), box-shadow .2s;
    margin-bottom:3px; position:relative; isolation:isolate;
    animation:mzFadeUp .3s var(--mz-ease) both;
}
/* glass hover lift */
.mz-row:hover{
    background:var(--mz-glass-strong);
    backdrop-filter:var(--mz-blur-soft); -webkit-backdrop-filter:var(--mz-blur-soft);
    transform:translateX(3px);
    box-shadow:var(--mz-shadow), inset 0 1px 0 var(--mz-glass-highlight);
}
.mz-row.active{ background:var(--mz-active); }
/* active gradient border */
.mz-row.active::after{
    content:''; position:absolute; inset:0; z-index:-1; border-radius:16px; padding:1.5px;
    background:linear-gradient(135deg, var(--mz-brand1), var(--mz-brand2), var(--mz-brand3));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    box-shadow:0 6px 22px rgba(99,102,241,.28);
}
.mz-row.active::before{
    content:''; position:absolute; left:-9px; top:20%; bottom:20%; width:4px;
    border-radius:0 4px 4px 0; background:linear-gradient(180deg,var(--mz-brand1),var(--mz-brand3));
    box-shadow:0 0 12px rgba(99,102,241,.6);
}
.mz-row-ava{ width:50px;height:50px;border-radius:16px;object-fit:cover;flex:0 0 50px; transition:transform .22s var(--mz-spring); box-shadow:0 4px 12px rgba(15,23,42,.12); }
.mz-row:hover .mz-row-ava, .mz-row:hover .mz-row-ava-fb{ transform:scale(1.06); }
.mz-row-ava-fb{
    width:50px;height:50px;border-radius:16px;flex:0 0 50px;
    display:flex;align-items:center;justify-content:center;
    background:var(--mz-grad);
    color:#fff; font-weight:800; font-size:1.05rem; transition:transform .22s var(--mz-spring);
    box-shadow:0 6px 16px rgba(99,102,241,.35);
}
.mz-row-kind{
    position:absolute; left:36px; top:34px;
    width:20px;height:20px;border-radius:8px;
    background:var(--mz-panel); border:2px solid var(--mz-panel);
    display:flex; align-items:center; justify-content:center;
    font-size:.6rem; color:#fff; box-shadow:0 2px 6px rgba(15,23,42,.2);
}
.mz-row-kind.group{ background:linear-gradient(135deg,#0ea5e9,#3b82f6); }
.mz-row-dot{ width:13px;height:13px;border-radius:50%; position:absolute; left:38px; top:38px; border:2.5px solid var(--mz-panel); }
.mz-row-dot.on{ background:var(--mz-online); animation:mzPulseDot 2s infinite; }
.mz-row-dot.off{ display:none; }
@keyframes mzPulseDot{ 0%,100%{ box-shadow:0 0 0 0 var(--mz-online-glow); } 70%{ box-shadow:0 0 0 6px rgba(34,197,94,0); } }

.mz-row-body{ flex:1 1 auto; min-width:0; }
.mz-row-top{ display:flex; justify-content:space-between; gap:6px; align-items:baseline; }
.mz-row-name{ font-weight:700; font-size:.94rem; color:var(--mz-text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; letter-spacing:-.01em; }
.mz-row-time{ font-size:.68rem; color:var(--mz-muted-2); flex:0 0 auto; font-weight:500; }
.mz-row-bottom{ display:flex; justify-content:space-between; gap:6px; align-items:center; margin-top:3px; }
.mz-row-last{ font-size:.79rem; color:var(--mz-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mz-row-badge{
    min-width:21px; height:21px; padding:0 6px; border-radius:999px;
    background:var(--mz-grad); color:#fff; font-size:.68rem; font-weight:800;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    box-shadow:0 4px 12px rgba(99,102,241,.5);
    animation:mzBadgePop .35s var(--mz-spring) both;
}
@keyframes mzBadgePop{ from{ transform:scale(0); } to{ transform:scale(1); } }
/* unread row emphasis */
.mz-row:has(.mz-row-badge) .mz-row-name{ font-weight:800; }
.mz-row:has(.mz-row-badge) .mz-row-last{ color:var(--mz-text); font-weight:600; }
.mz-row:has(.mz-row-badge)::after{
    content:''; position:absolute; inset:0; z-index:-1; border-radius:16px;
    background:var(--mz-grad-soft);
}
.mz-row-pin{ color:var(--mz-brand2); font-size:.74rem; flex:0 0 auto; }
.mz-empty{ margin:auto; text-align:center; color:var(--mz-muted); padding:34px; animation:mzFadeUp .3s both; }
.mz-empty i{ font-size:2.4rem; opacity:.45; display:block; margin-bottom:10px; }

/* ── Skeleton loaders ── */
.mz-skel-row{ display:flex; align-items:center; gap:12px; padding:10px 9px; margin-bottom:3px; }
.mz-skel-ava{ width:50px;height:50px;border-radius:16px;flex:0 0 50px; }
.mz-skel-lines{ flex:1 1 auto; }
.mz-skel-line{ height:11px; border-radius:7px; margin-bottom:8px; }
.mz-skel-line.w70{ width:70%; } .mz-skel-line.w45{ width:45%; } .mz-skel-line.w90{ width:90%; }
.mz-skel{
    background:linear-gradient(100deg, var(--mz-border-soft) 30%, var(--mz-hover) 50%, var(--mz-border-soft) 70%);
    background-size:200% 100%; animation:mzShimmer 1.3s ease-in-out infinite;
}
@keyframes mzShimmer{ 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }
.mz-skel-msg{ max-width:55%; padding:14px 16px; border-radius:16px; margin-bottom:12px; }
.mz-skel-msg.me{ margin-left:auto; }

/* ════════════════════ MAIN ════════════════════ */
.mz-main{ flex:1 1 auto; display:flex; flex-direction:column; min-width:0; background:transparent; position:relative; z-index:2; }
.mz-placeholder{ margin:auto; text-align:center; color:var(--mz-muted); animation:mzFadeUp .45s both; padding:20px; }
.mz-placeholder i{
    font-size:3.4rem; display:block; margin-bottom:14px;
    background:var(--mz-grad); -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:mzFloat 3.6s ease-in-out infinite; opacity:.9;
}
@keyframes mzFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-9px); } }

/* ── Premium sticky header ── */
.mz-head{
    display:flex; align-items:center; gap:13px;
    padding:13px 18px; flex:0 0 auto;
    background:linear-gradient(120deg,var(--mz-brand1-a),var(--mz-brand2-a) 52%,var(--mz-brand3-a));
    background-size:220% 220%;
    backdrop-filter:var(--mz-blur-soft);
    -webkit-backdrop-filter:var(--mz-blur-soft);
    animation:mzGradientShift 12s ease infinite;
    color:#fff; position:relative; z-index:6;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(0,0,0,.08), 0 6px 22px rgba(15,23,42,.14);
}
/* subtle mesh overlay on header */
.mz-head::before{
    content:''; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background:radial-gradient(120px 80px at 12% 0%, rgba(255,255,255,.3), transparent 70%),
               radial-gradient(160px 100px at 88% 120%, rgba(0,0,0,.14), transparent 70%);
}
@keyframes mzGradientShift{ 0%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } 100%{ background-position:0% 50%; } }
.mz-back{
    width:38px;height:38px;flex:0 0 38px; display:none;
    align-items:center;justify-content:center; border-radius:12px; color:#fff;
    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.24);
    transition:background .15s, transform .15s; cursor:pointer; position:relative; z-index:1;
}
.mz-back:hover{ background:rgba(255,255,255,.3); transform:translateX(-2px); }
.mz-ava{ width:46px;height:46px;border-radius:14px;object-fit:cover; border:2px solid rgba(255,255,255,.4); position:relative; z-index:1; box-shadow:0 6px 16px rgba(0,0,0,.18); }
.mz-ava-fb{
    width:46px;height:46px;border-radius:14px;flex:0 0 46px; position:relative; z-index:1;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.22); color:#fff; font-weight:800; font-size:1.05rem;
    border:1px solid rgba(255,255,255,.3);
}
.mz-head .flex-grow-1{ position:relative; z-index:1; }
.mz-h-name{ font-weight:800; font-size:1.05rem; line-height:1.15; letter-spacing:-.01em; }
.mz-h-sub{ font-size:.77rem; opacity:.95; display:flex; align-items:center; margin-top:1px; }
.mz-dot{ width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;flex:0 0 8px; }
.mz-dot.on{ background:#86efac; box-shadow:0 0 0 2px rgba(134,239,172,.4), 0 0 8px rgba(134,239,172,.7); animation:mzPulseDot 2s infinite; }
.mz-dot.off{ background:rgba(255,255,255,.55); }
.mz-sub-fade{ display:inline-block; animation:mzSubIn .35s ease; }
@keyframes mzSubIn{ from{ opacity:0; transform:translateY(-3px); } to{ opacity:1; transform:translateY(0); } }

/* ── Header quick-action buttons ── */
.mz-head-actions{ display:flex; align-items:center; gap:7px; flex:0 0 auto; position:relative; z-index:1; }
.mz-icon-btn, .mz-pin-btn{
    width:39px;height:39px;flex:0 0 39px; display:flex; cursor:pointer;
    align-items:center;justify-content:center; border-radius:12px; color:#fff;
    background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.24);
    transition:background .18s, transform .18s var(--mz-spring), color .18s;
    font-size:1rem;
}
.mz-icon-btn:hover{ background:rgba(255,255,255,.32); transform:translateY(-2px); }
.mz-icon-btn:active{ transform:scale(.92); }
.mz-icon-btn.active{ background:#fff; color:var(--mz-brand1); box-shadow:0 6px 16px rgba(0,0,0,.18); }
.mz-pin-btn:hover{ background:rgba(255,255,255,.32); transform:rotate(-18deg) scale(1.08); }
.mz-pin-btn.pinned{ background:#fff; color:var(--mz-brand1); box-shadow:0 6px 16px rgba(0,0,0,.2); }
/* hide some quick-actions on narrow main */
@media (max-width:560px){ .mz-icon-btn.mz-optional{ display:none; } }

.mz-body{
    flex:1 1 auto; overflow-y:auto; padding:18px 20px 12px;
    display:flex; flex-direction:column; gap:3px;
    scroll-behavior:smooth; position:relative;
}
.mz-body::-webkit-scrollbar{ width:9px; }
.mz-body::-webkit-scrollbar-thumb{ background:var(--mz-border); border-radius:8px; }
.mz-body::-webkit-scrollbar-thumb:hover{ background:var(--mz-brand1); }

/* ── Messages: Telegram × Discord bubbles ── */
.mz-row-msg{
    display:flex; gap:9px; max-width:72%; position:relative; margin-top:6px;
    animation:mzMsgIn .34s var(--mz-ease) both;
}
.mz-row-msg.me{ align-self:flex-end; flex-direction:row-reverse; }
.mz-row-msg.other{ align-self:flex-start; }
/* message grouping — tighten spacing/radius for consecutive same-side bubbles
   (avatar/sender intentionally preserved so different senders never collapse) */
.mz-row-msg.me + .mz-row-msg.me,
.mz-row-msg.other + .mz-row-msg.other{ margin-top:2px; }
.mz-row-msg.me + .mz-row-msg.me .mz-bubble{ border-top-right-radius:6px; }
.mz-row-msg.other + .mz-row-msg.other .mz-bubble{ border-top-left-radius:6px; }
@keyframes mzMsgIn{ from{ opacity:0; transform:translateY(14px) scale(.96); } to{ opacity:1; transform:translateY(0) scale(1); } }

.mz-msg-ava{ width:30px;height:30px;border-radius:50%;flex:0 0 30px; align-self:flex-end; object-fit:cover; box-shadow:0 2px 8px rgba(15,23,42,.15); }
.mz-msg-ava-fb{
    width:30px;height:30px;border-radius:50%;flex:0 0 30px; align-self:flex-end;
    display:flex;align-items:center;justify-content:center;
    background:var(--mz-grad);
    color:#fff; font-size:.68rem; font-weight:700; box-shadow:0 2px 8px rgba(99,102,241,.3);
}
.mz-bubble-wrap{ position:relative; }
.mz-bubble{
    padding:10px 14px; border-radius:18px;
    font-size:.9rem; line-height:1.46; word-break:break-word;
    transition:transform .15s, box-shadow .2s;
    position:relative;
}
.mz-bubble-wrap:hover .mz-bubble{ transform:translateY(-1px); }
.mz-row-msg.other .mz-bubble{
    background:var(--mz-glass-strong);
    backdrop-filter:var(--mz-blur-soft); -webkit-backdrop-filter:var(--mz-blur-soft);
    color:var(--mz-text); border:1px solid var(--mz-glass-border);
    border-bottom-left-radius:6px; box-shadow:0 3px 14px rgba(15,23,42,.07);
}
.mz-row-msg.me .mz-bubble{
    background:var(--mz-grad); color:#fff; border-bottom-right-radius:6px;
    box-shadow:0 6px 20px rgba(99,102,241,.35);
}
.mz-row-msg.me .mz-bubble::after{
    content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
}
.mz-sender{ font-size:.74rem; font-weight:800; margin-bottom:3px;
    background:var(--mz-grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
.mz-msg-text{ position:relative; z-index:1; }
.mz-quote{
    display:block; border-left:3px solid rgba(255,255,255,.6);
    padding:4px 9px; margin-bottom:6px; border-radius:8px; font-size:.78rem;
    background:rgba(255,255,255,.14); cursor:pointer; transition:background .15s;
}
.mz-quote:hover{ background:rgba(255,255,255,.24); }
.mz-row-msg.other .mz-quote{ border-left-color:var(--mz-brand2); background:var(--mz-grad-soft); }
.mz-row-msg.other .mz-quote:hover{ background:var(--mz-hover); }
.mz-quote .qn{ font-weight:700; display:block; }
.mz-quote .qs{ opacity:.85; }
.mz-meta-row{ display:flex; align-items:center; gap:4px; margin-top:4px; justify-content:flex-end; }
.mz-time{ font-size:.65rem; opacity:.72; font-weight:500; }
.mz-tag{ font-size:.65rem; opacity:.72; font-style:italic; }
.mz-tick{ font-size:.84rem; opacity:.85; transition:color .25s; }
.mz-tick.read{ color:#7dd3fc; opacity:1; }
.mz-file{
    display:inline-flex; align-items:center; gap:8px;
    padding:8px 12px; border-radius:12px; margin-top:5px;
    background:rgba(255,255,255,.18); color:inherit; text-decoration:none;
    font-size:.8rem; border:1px solid rgba(255,255,255,.26); transition:transform .15s, box-shadow .2s;
}
.mz-file:hover{ transform:translateY(-1px); box-shadow:0 6px 16px rgba(0,0,0,.15); }
.mz-row-msg.other .mz-file{ background:var(--mz-bg); border-color:var(--mz-border); }
.mz-file img{ max-width:220px; border-radius:10px; display:block; }

.mz-react-row{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.mz-react-pill{
    display:inline-flex; align-items:center; gap:3px;
    padding:2px 9px; border-radius:999px; font-size:.75rem; cursor:pointer; font-weight:600;
    background:var(--mz-glass-strong); border:1px solid var(--mz-border); color:var(--mz-text);
    animation:mzPopIn .28s var(--mz-spring) both; transition:transform .15s, box-shadow .15s;
}
.mz-react-pill:hover{ transform:scale(1.1); box-shadow:var(--mz-shadow); }
@keyframes mzPopIn{ from{ opacity:0; transform:scale(.4); } to{ opacity:1; transform:scale(1); } }
.mz-row-msg.me .mz-react-pill{ background:rgba(255,255,255,.22); border-color:rgba(255,255,255,.34); color:#fff; }
.mz-react-pill.mine{ border-color:var(--mz-brand2); background:var(--mz-active); color:var(--mz-text); box-shadow:0 0 0 1px rgba(139,92,246,.4); }

.mz-actions{
    position:absolute; top:-16px; display:flex; gap:2px;
    background:var(--mz-glass-strong);
    backdrop-filter:var(--mz-blur); -webkit-backdrop-filter:var(--mz-blur);
    border:1px solid var(--mz-glass-border);
    border-radius:12px; padding:3px; box-shadow:var(--mz-shadow-lg);
    opacity:0; transform:translateY(6px) scale(.9); pointer-events:none;
    transition:opacity .18s, transform .18s var(--mz-spring); z-index:7;
}
.mz-row-msg.me .mz-actions{ right:0; }
.mz-row-msg.other .mz-actions{ left:30px; }
.mz-row-msg:hover .mz-actions{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
.mz-act-btn{
    width:28px;height:28px; display:flex; align-items:center;justify-content:center;
    border-radius:9px; color:var(--mz-muted); font-size:.8rem; cursor:pointer; transition:.15s var(--mz-spring);
}
.mz-act-btn:hover{ background:var(--mz-hover); color:var(--mz-brand1); transform:scale(1.15); }
.mz-act-btn.danger:hover{ color:var(--mz-danger); background:rgba(239,68,68,.1); }

.mz-emoji-pop{
    position:absolute; top:-50px; display:flex; gap:4px;
    background:var(--mz-glass-strong);
    backdrop-filter:var(--mz-blur); -webkit-backdrop-filter:var(--mz-blur);
    border:1px solid var(--mz-glass-border);
    border-radius:16px; padding:6px 9px; box-shadow:var(--mz-shadow-lg); z-index:8;
    animation:mzPopIn .22s var(--mz-spring) both;
}
.mz-row-msg.me .mz-emoji-pop{ right:0; }
.mz-row-msg.other .mz-emoji-pop{ left:30px; }
.mz-emoji-pop span{ cursor:pointer; font-size:1.2rem; transition:transform .15s var(--mz-spring); display:inline-block; }
.mz-emoji-pop span:hover{ transform:scale(1.4) translateY(-3px) rotate(-8deg); }

.mz-day{ text-align:center; margin:14px 0 8px; position:relative; }
.mz-day span{
    background:var(--mz-glass-strong);
    backdrop-filter:var(--mz-blur-soft); -webkit-backdrop-filter:var(--mz-blur-soft);
    color:var(--mz-muted); border:1px solid var(--mz-glass-border);
    padding:4px 14px; border-radius:999px; font-size:.7rem; font-weight:600;
    box-shadow:var(--mz-shadow);
}

/* ── True message grouping (Telegram × Discord): collapse consecutive
   same-sender bubbles — hide repeated avatar / sender name, tighten gap.
   Applied by JS applyGrouping() as .mz-grouped after each reconcile. ── */
.mz-row-msg.mz-grouped{ margin-top:2px; }
.mz-row-msg.mz-grouped .mz-msg-ava,
.mz-row-msg.mz-grouped .mz-msg-ava-fb{ visibility:hidden; }   /* keep column width → bubbles stay aligned */
.mz-row-msg.mz-grouped .mz-sender{ display:none; }
.mz-row-msg.other.mz-grouped .mz-bubble{ border-top-left-radius:7px; }
.mz-row-msg.me.mz-grouped .mz-bubble{ border-top-right-radius:7px; }
/* on grouped bubbles the timestamp only appears on hover → cleaner stream */
.mz-row-msg.mz-grouped .mz-meta-row{ opacity:0; max-height:0; margin-top:0; overflow:hidden; transition:opacity .15s, max-height .15s; }
.mz-row-msg.mz-grouped:hover .mz-meta-row{ opacity:.75; max-height:24px; margin-top:2px; }
.mz-row-msg.mz-grouped:hover .mz-meta-row .mz-tick{ opacity:.85; }

/* ── Clickable links inside bubbles ── */
.mz-link{ color:inherit; font-weight:600; text-decoration:underline; text-underline-offset:2px; text-decoration-thickness:1px; text-decoration-color:rgba(255,255,255,.55); transition:opacity .15s; }
.mz-link:hover{ opacity:.82; }
.mz-row-msg.other .mz-link{ color:var(--mz-brand1); text-decoration-color:rgba(99,102,241,.45); }

/* ── "New messages" divider ── */
.mz-new-divider{ display:flex; align-items:center; gap:10px; margin:14px 4px 8px; animation:mzFadeUp .3s both; }
.mz-new-divider::before, .mz-new-divider::after{ content:''; height:1px; flex:1; background:linear-gradient(90deg,transparent,var(--mz-brand2),transparent); opacity:.5; }
.mz-new-divider span{ font-size:.66rem; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:var(--mz-brand2); padding:3px 12px; border-radius:999px; background:var(--mz-grad-soft); border:1px solid rgba(139,92,246,.3); white-space:nowrap; }

/* ── Shared media gallery grid (info → Fayllar) ── */
.mz-media-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:5px; padding:2px 2px 10px; }
.mz-media-cell{
    position:relative; aspect-ratio:1/1; border-radius:12px; overflow:hidden; cursor:pointer;
    border:1px solid var(--mz-glass-border); box-shadow:var(--mz-shadow);
    animation:mzPopIn .3s var(--mz-spring) both; transition:transform .18s var(--mz-spring), box-shadow .18s;
}
.mz-media-cell:hover{ transform:translateY(-2px) scale(1.03); box-shadow:var(--mz-shadow-lg); z-index:2; }
.mz-media-cell img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s var(--mz-ease); }
.mz-media-cell:hover img{ transform:scale(1.12); }
.mz-media-cell::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 55%,rgba(8,12,24,.35)); opacity:0; transition:opacity .2s; }
.mz-media-cell:hover::after{ opacity:1; }

/* ── Smart-filter unread pill badge ── */
.mz-filter{ display:flex; align-items:center; justify-content:center; gap:5px; }
.mz-filter-count{
    min-width:17px; height:17px; padding:0 5px; border-radius:999px;
    background:var(--mz-danger); color:#fff; font-size:.6rem; font-weight:800;
    display:none; align-items:center; justify-content:center; line-height:1;
    box-shadow:0 2px 6px rgba(239,68,68,.5);
}
.mz-filter-count.show{ display:inline-flex; animation:mzBadgePop .35s var(--mz-spring) both; }
.mz-filter.active .mz-filter-count{ background:rgba(255,255,255,.28); box-shadow:none; }

/* ── Sidebar section label (Pinned / Chats) ── */
.mz-sec-label{
    display:flex; align-items:center; gap:6px;
    font-size:.66rem; font-weight:800; text-transform:uppercase; letter-spacing:.6px;
    color:var(--mz-muted); padding:11px 10px 5px;
}
.mz-sec-label i{ font-size:.72rem; color:var(--mz-brand2); }

/* ── Last-message preview type icon ── */
.mz-row-last-ic{ color:var(--mz-brand1); margin-right:3px; font-size:.78rem; }
.mz-row:has(.mz-row-badge) .mz-row-last-ic{ color:var(--mz-brand2); }

.mz-typing{ padding:2px 20px 8px; font-size:.78rem; color:var(--mz-muted); font-style:italic; display:flex; align-items:center; gap:7px; }
.mz-typing-dots{ display:inline-flex; gap:3px; }
.mz-typing-dots i{ width:6px;height:6px;border-radius:50%; background:var(--mz-brand1); display:inline-block; animation:mzDotBounce 1.3s infinite ease-in-out; }
.mz-typing-dots i:nth-child(2){ animation-delay:.15s; background:var(--mz-brand2); }
.mz-typing-dots i:nth-child(3){ animation-delay:.3s; background:var(--mz-brand3); }
@keyframes mzDotBounce{ 0%,80%,100%{ transform:translateY(0); opacity:.4; } 40%{ transform:translateY(-6px); opacity:1; } }

/* ════════════ SCROLL-TO-BOTTOM ════════════ */
.mz-scroll-bottom{
    position:absolute; right:22px; bottom:88px; width:44px; height:44px;
    border-radius:50%; background:var(--mz-glass-strong);
    backdrop-filter:var(--mz-blur); -webkit-backdrop-filter:var(--mz-blur);
    border:1px solid var(--mz-glass-border);
    box-shadow:var(--mz-shadow-lg); color:var(--mz-brand1); display:flex;
    align-items:center; justify-content:center; font-size:1.15rem; cursor:pointer;
    z-index:10; opacity:0; transform:translateY(10px) scale(.8); pointer-events:none;
    transition:opacity .22s, transform .22s var(--mz-spring);
}
.mz-scroll-bottom.show{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
.mz-scroll-bottom:hover{ transform:translateY(-3px) scale(1.08); color:#fff; background:var(--mz-grad); }
.mz-scroll-badge{
    position:absolute; top:-5px; right:-5px; min-width:19px; height:19px; padding:0 5px;
    border-radius:999px; background:var(--mz-danger); color:#fff; font-size:.62rem; font-weight:800;
    display:none; align-items:center; justify-content:center; box-shadow:0 3px 8px rgba(239,68,68,.5);
}
.mz-scroll-bottom.has-new .mz-scroll-badge{ display:flex; }

/* ════════════ COMPOSER ════════════ */
.mz-foot{
    padding:12px 16px; border-top:1px solid var(--mz-glass-border); flex:0 0 auto;
    background:var(--mz-glass-soft);
    backdrop-filter:var(--mz-blur-soft); -webkit-backdrop-filter:var(--mz-blur-soft);
    box-shadow:inset 0 1px 0 var(--mz-glass-highlight);
    position:relative; z-index:6;
}
.mz-reply-bar{
    display:flex; align-items:center; gap:9px; margin-bottom:9px;
    background:var(--mz-grad-soft); border-radius:12px; padding:8px 12px; border-left:3px solid var(--mz-brand2);
    animation:mzSlideDown .22s ease both; box-shadow:inset 0 0 0 1px var(--mz-border-soft);
}
@keyframes mzSlideDown{ from{ opacity:0; transform:translateY(-8px); } to{ opacity:1; transform:translateY(0); } }
.mz-reply-info{ flex:1 1 auto; min-width:0; }
.mz-reply-label{ font-size:.74rem; font-weight:800; color:var(--mz-brand2); }
.mz-reply-snippet{ font-size:.78rem; color:var(--mz-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mz-reply-x{ cursor:pointer; color:var(--mz-muted); flex:0 0 auto; transition:transform .15s, color .15s; }
.mz-reply-x:hover{ color:var(--mz-danger); transform:rotate(90deg); }
.mz-filechip{
    display:flex; align-items:center; gap:9px; margin-bottom:9px;
    font-size:.8rem; color:var(--mz-text);
    background:var(--mz-grad-soft); border:1px solid var(--mz-border);
    border-radius:12px; padding:8px 12px;
    animation:mzSlideDown .22s ease both;
}
.mz-filechip > i{ color:var(--mz-brand2); }
.mz-filechip .x{ cursor:pointer; color:var(--mz-danger); margin-left:auto; transition:transform .15s; }
.mz-filechip .x:hover{ transform:rotate(90deg); }
.mz-form{ display:flex; align-items:flex-end; gap:9px; }
.mz-attach, .mz-emoji-btn{
    width:44px;height:44px;flex:0 0 44px;
    display:inline-flex;align-items:center;justify-content:center;
    border-radius:14px; cursor:pointer; transition:.18s var(--mz-spring); font-size:1.05rem;
    background:var(--mz-bg); color:var(--mz-brand1); border:1px solid var(--mz-border);
}
.mz-attach:hover, .mz-emoji-btn:hover{ background:var(--mz-grad); color:#fff; transform:translateY(-2px) rotate(-6deg); box-shadow:0 8px 18px rgba(99,102,241,.4); }
.mz-input{
    flex:1 1 auto; border:1px solid var(--mz-border); border-radius:16px;
    background:var(--mz-bg); color:var(--mz-text);
    padding:11px 16px; resize:none; max-height:130px; outline:none;
    font-size:.9rem; line-height:1.45; transition:border-color .2s, box-shadow .2s, background .2s;
}
.mz-input::placeholder{ color:var(--mz-muted-2); }
.mz-input:focus{ border-color:var(--mz-brand1); box-shadow:0 0 0 3px rgba(99,102,241,.18); }
.mz-send{
    width:44px;height:44px;flex:0 0 44px;
    display:inline-flex;align-items:center;justify-content:center;
    border-radius:14px; border:none; color:#fff; font-size:1.1rem;
    background:var(--mz-grad); transition:.18s var(--mz-spring);
    box-shadow:0 6px 18px rgba(99,102,241,.42);
}
.mz-send:hover{ filter:brightness(1.1); transform:translateY(-2px) scale(1.05); box-shadow:0 10px 24px rgba(99,102,241,.55); }
.mz-send:active{ transform:scale(.9); }
.mz-send:disabled{ opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
.mz-send.editing{ background:linear-gradient(135deg,#16a34a,#22c55e); box-shadow:0 6px 18px rgba(34,197,94,.45); }

.mz-emoji-panel{
    position:absolute; bottom:68px; left:16px; width:300px; max-height:240px; overflow-y:auto;
    background:var(--mz-glass-strong);
    backdrop-filter:var(--mz-blur); -webkit-backdrop-filter:var(--mz-blur);
    border:1px solid var(--mz-glass-border); border-radius:16px;
    box-shadow:var(--mz-shadow-lg); padding:11px; z-index:20;
    display:grid; grid-template-columns:repeat(7,1fr); gap:4px;
    animation:mzPopIn .2s var(--mz-spring) both; transform-origin:bottom left;
}
.mz-emoji-panel span{ text-align:center; font-size:1.3rem; padding:5px 0; border-radius:10px; cursor:pointer; transition:transform .15s var(--mz-spring), background .15s; }
.mz-emoji-panel span:hover{ background:var(--mz-hover); transform:scale(1.3); }

/* ════════════ FORWARD MODAL ════════════ */
.mz-modal-backdrop{
    position:fixed; inset:0; background:rgba(8,12,24,.5);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); z-index:1000;
    display:flex; align-items:center; justify-content:center; padding:20px;
    animation:mzFadeIn .2s ease both;
}
@keyframes mzFadeIn{ from{ opacity:0; } to{ opacity:1; } }
.mz-modal{
    width:100%; max-width:400px; max-height:72vh; background:var(--mz-glass-strong);
    backdrop-filter:var(--mz-blur); -webkit-backdrop-filter:var(--mz-blur);
    border:1px solid var(--mz-glass-border);
    border-radius:20px; box-shadow:var(--mz-shadow-lg), inset 0 1px 0 var(--mz-glass-highlight);
    display:flex; flex-direction:column; overflow:hidden;
    animation:mzModalIn .28s var(--mz-ease) both;
}
@keyframes mzModalIn{ from{ opacity:0; transform:translateY(20px) scale(.95); } to{ opacity:1; transform:translateY(0) scale(1); } }
.mz-modal-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:15px 17px; border-bottom:1px solid var(--mz-glass-border); color:var(--mz-text); font-weight:800;
}
.mz-modal-x{ cursor:pointer; color:var(--mz-muted); transition:transform .15s, color .15s; }
.mz-modal-x:hover{ color:var(--mz-danger); transform:rotate(90deg); }
.mz-modal-search{
    margin:11px 14px; padding:10px 13px; border-radius:12px;
    border:1px solid var(--mz-border); background:var(--mz-bg); color:var(--mz-text); outline:none;
    transition:border-color .2s, box-shadow .2s;
}
.mz-modal-search:focus{ border-color:var(--mz-brand1); box-shadow:0 0 0 3px rgba(99,102,241,.15); }
.mz-modal-list{ flex:1 1 auto; overflow-y:auto; padding:0 8px 10px; }

/* ════════════ INFO PANEL (right sidebar) ════════════ */
.mz-info{
    flex:0 0 0; width:0; min-width:0; overflow:hidden;
    display:flex; flex-direction:column;
    border-left:1px solid var(--mz-glass-border);
    background:var(--mz-glass-soft);
    backdrop-filter:var(--mz-blur-soft); -webkit-backdrop-filter:var(--mz-blur-soft);
    position:relative; z-index:4;
    transition:width .38s var(--mz-ease), flex-basis .38s var(--mz-ease);
}
.mz-shell.mz-info-open .mz-info{ flex:0 0 328px; width:328px; }
.mz-info-backdrop{ display:none; }

.mz-info-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:15px 16px; border-bottom:1px solid var(--mz-glass-border);
    flex:0 0 auto;
}
.mz-info-title{ font-weight:800; color:var(--mz-text); font-size:1rem; }
.mz-info-x{ cursor:pointer; color:var(--mz-muted); width:33px;height:33px; display:flex; align-items:center; justify-content:center; border-radius:10px; transition:color .15s, transform .15s, background .15s; }
.mz-info-x:hover{ color:var(--mz-danger); background:var(--mz-hover); transform:rotate(90deg); }

.mz-info-hero{ text-align:center; padding:22px 16px 12px; flex:0 0 auto; animation:mzFadeUp .35s both; position:relative; }
.mz-info-hero::before{
    content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:200px; height:120px; background:radial-gradient(circle, var(--mz-blob1), transparent 70%);
    filter:blur(40px); opacity:.6; pointer-events:none; z-index:-1;
}
.mz-info-ava{
    width:96px;height:96px;border-radius:30px; margin:0 auto 13px; object-fit:cover;
    display:flex; align-items:center; justify-content:center;
    background:var(--mz-grad);
    color:#fff; font-size:2.1rem; font-weight:800;
    box-shadow:0 14px 36px rgba(99,102,241,.5); animation:mzFloat 4.2s ease-in-out infinite;
    border:3px solid var(--mz-glass-border);
}
img.mz-info-ava{ display:block; }
.mz-info-name{ font-weight:800; font-size:1.15rem; color:var(--mz-text); line-height:1.2; word-break:break-word; letter-spacing:-.01em; }
.mz-info-sub{ font-size:.82rem; color:var(--mz-muted); margin-top:4px; display:flex; align-items:center; justify-content:center; gap:5px; }

/* stat cards (injected by JS) */
.mz-info-stats{ display:flex; gap:8px; padding:6px 14px 12px; flex:0 0 auto; }
.mz-stat{
    flex:1; text-align:center; padding:11px 6px; border-radius:14px;
    background:var(--mz-glass-strong); border:1px solid var(--mz-glass-border);
    box-shadow:var(--mz-shadow); animation:mzFadeUp .35s both;
}
.mz-stat-num{ font-size:1.15rem; font-weight:800; line-height:1;
    background:var(--mz-grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
.mz-stat-lbl{ font-size:.66rem; color:var(--mz-muted); margin-top:4px; text-transform:uppercase; letter-spacing:.4px; font-weight:600; }
.mz-stat-num.online{ background:linear-gradient(135deg,#16a34a,#22c55e); -webkit-background-clip:text; background-clip:text; color:transparent; }

.mz-info-tabs{ display:flex; gap:6px; padding:4px 14px 10px; flex:0 0 auto; }
