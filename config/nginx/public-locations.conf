# TEMPLATE: include in the site's EXISTING server {}, before generic regex locations.
# 127.0.0.1:8080 is an EXAMPLE Apache upstream. Match your Engintron routing first.
# Keep existing TLS, other locations, access controls, proxy headers and security headers.
location ~ ^/(robots\.txt|sitemap\.xml)$ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache lms_public_v1;
    proxy_cache_key "lms-v1|$scheme|$host|$request_uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 5m;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_bypass $lms_skip_method $lms_skip_cookie $lms_skip_auth $lms_skip_uri $lms_skip_refresh;
    proxy_no_cache $lms_skip_method $lms_skip_cookie $lms_skip_auth $lms_skip_uri $lms_skip_refresh $upstream_http_set_cookie;
    # Intentionally honor Cache-Control, Set-Cookie, Vary and X-Accel-Expires.
    # Never use proxy_ignore_headers to force private/CSRF pages into shared cache.
    add_header X-Cache-Status $lms_cache_status always;
    # add_header here replaces inherited add_header directives on common Nginx versions.
    # Re-include the site's existing security headers in this location when merging.
}
