# TEMPLATE: http {} context ONLY. Not a replacement for Engintron-generated files.
# An administrator must merge this through persistent Engintron custom includes.
# Check the real Apache upstream with `nginx -T` before using the vhost snippet.
proxy_cache_path /var/cache/nginx/lms_public levels=1:2
    keys_zone=lms_public_v1:4m max_size=64m inactive=10m use_temp_path=off;

map $request_method $lms_skip_method {
    default 1;
    GET 0;
    HEAD 0;
}
map $http_cookie $lms_skip_cookie {
    default 1;
    "" 0;
}
map $http_authorization $lms_skip_auth {
    default 1;
    "" 0;
}
# Explicit allowlist: all other URLs, query strings and authenticated requests bypass.
map $request_uri $lms_skip_uri {
    default 1;
    /robots.txt 0;
    /sitemap.xml 0;
}
map $http_cache_control $lms_skip_refresh {
    default 0;
    ~*(no-cache|no-store|max-age=0) 1;
}
map $upstream_cache_status $lms_cache_status {
    "" BYPASS;
    default $upstream_cache_status;
}
