<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A — Hologram Scan | Sertifikat tekshirish</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
/* =====================================================================
   VARIANT A — HOLOGRAM SCAN
   Qorong'i kiber uslub: lazer nur hujjatni skanerlaydi, ma'lumotlar
   "dekod" bo'lib chiqadi, tasdiq muhri tushadi.
   ===================================================================== */
:root {
  --bg: #04060d; --panel: rgba(10,16,30,.78); --line: rgba(56,232,255,.16);
  --cy: #38e8ff; --vi: #8b7bff; --ok: #3cf6a0; --warn: #ffc24b; --bad: #ff5d7a;
  --text: #e6f6ff; --text-2: rgba(200,225,240,.6);
  --spring: cubic-bezier(.34,1.56,.64,1); --smooth: cubic-bezier(.22,1,.36,1);
  --mono: 'JetBrains Mono', monospace;
}
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
.mono { font-family:var(--mono); }

/* ---------- Fon: matritsa to'r + aylanuvchi radar ---------- */
.bg { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.bg::before {
  content:''; position:absolute; inset:-2px;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 10%, transparent 70%);
  mask-image: radial-gradient(ellipse at 50% 30%, #000 10%, transparent 70%);
  animation: gridDrift 20s linear infinite;
}
@keyframes gridDrift { to { background-position: 56px 56px, 56px 56px; } }
.radar {
  position:absolute; left:50%; top:-340px; width:900px; height:900px; margin-left:-450px; border-radius:50%;
  background: conic-gradient(from 0deg, transparent 0 300deg, rgba(56,232,255,.16) 350deg, rgba(56,232,255,.0) 360deg);
  animation: spin 9s linear infinite; opacity:.7;
}
.radar::after { content:''; position:absolute; inset:0; border-radius:50%;
  background: repeating-radial-gradient(circle, transparent 0 89px, rgba(56,232,255,.08) 90px 91px); }
@keyframes spin { to { transform: rotate(360deg); } }
#particles { position:absolute; inset:0; }

/* ---------- Layout ---------- */
.wrap { position:relative; z-index:2; max-width:760px; margin:0 auto; padding:3.2rem 1.2rem 4rem; }
.head { text-align:center; margin-bottom:2rem; }
.chip { display:inline-flex; align-items:center; gap:8px; font:600 .72rem var(--mono); letter-spacing:.14em; text-transform:uppercase;
  color:var(--cy); padding:.4rem .9rem; border:1px solid var(--line); border-radius:999px; background:rgba(56,232,255,.05); }
.chip .dot { width:7px; height:7px; border-radius:50%; background:var(--ok); box-shadow:0 0 10px var(--ok); animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity:.25; } }
h1 { font-size:clamp(1.9rem,5.5vw,3rem); font-weight:900; letter-spacing:-.03em; margin:.9rem 0 .4rem; line-height:1.05; }
h1 .glitch { position:relative; display:inline-block; color:transparent;
  background:linear-gradient(90deg,var(--cy),var(--vi)); -webkit-background-clip:text; background-clip:text; }
h1 .glitch::before, h1 .glitch::after { content:attr(data-t); position:absolute; inset:0; -webkit-background-clip:text; background-clip:text; }
h1 .glitch::before { background-image:linear-gradient(90deg,#ff3df2,#ff3df2); animation: gl1 3.2s infinite steps(1); }
h1 .glitch::after  { background-image:linear-gradient(90deg,var(--cy),var(--cy)); animation: gl2 3.2s infinite steps(1); }
@keyframes gl1 { 0%,92%,100% { clip-path:inset(0 0 100% 0); transform:none; } 93% { clip-path:inset(20% 0 55% 0); transform:translate(-3px,0); } 96% { clip-path:inset(60% 0 10% 0); transform:translate(3px,0); } }
@keyframes gl2 { 0%,92%,100% { clip-path:inset(0 0 100% 0); transform:none; } 94% { clip-path:inset(45% 0 30% 0); transform:translate(3px,0); } 97% { clip-path:inset(5% 0 80% 0); transform:translate(-2px,0); } }
.sub { color:var(--text-2); font-weight:500; }

/* ---------- Panel ---------- */
.panel { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:22px;
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); box-shadow:0 30px 80px -30px #000; }
.panel .corner { position:absolute; width:18px; height:18px; border:2px solid var(--cy); opacity:.8; }
.corner.tl { top:-1px; left:-1px; border-right:0; border-bottom:0; border-radius:22px 0 0 0; }
.corner.tr { top:-1px; right:-1px; border-left:0; border-bottom:0; border-radius:0 22px 0 0; }
.corner.bl { bottom:-1px; left:-1px; border-right:0; border-top:0; border-radius:0 0 0 22px; }
.corner.br { bottom:-1px; right:-1px; border-left:0; border-top:0; border-radius:0 0 22px 0; }

.search { padding:1.5rem; }
.label { font:700 .72rem var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--text-2); margin-bottom:.7rem; display:block; }
.field { display:flex; gap:.7rem; }
.input { flex:1; position:relative; }
.input i { position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--cy); }
.input input { width:100%; padding:1rem 1rem 1rem 46px; border-radius:14px; border:1.5px solid var(--line); background:rgba(0,0,0,.4);
  color:var(--text); font:700 1.05rem var(--mono); letter-spacing:.08em; outline:none; text-transform:uppercase; transition:border-color .3s, box-shadow .3s; }
.input input:focus { border-color:var(--cy); box-shadow:0 0 0 4px rgba(56,232,255,.12), 0 0 40px -10px var(--cy); }
.btn { position:relative; overflow:hidden; border:0; cursor:pointer; padding:0 1.6rem; border-radius:14px; color:#021018;
  font:800 .95rem 'Inter'; background:linear-gradient(90deg,var(--cy),#7df9ff); display:flex; align-items:center; gap:8px;
  box-shadow:0 10px 40px -10px var(--cy); transition:transform .25s var(--spring); }
.btn:hover { transform:translateY(-2px) scale(1.03); }
.btn:active { transform:scale(.96); }
.btn::after { content:''; position:absolute; top:0; bottom:0; left:-60%; width:40%; transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent); animation: sheen 3s infinite; }
@keyframes sheen { 0%,60% { left:-60%; } 100% { left:130%; } }
.hints { margin-top:.9rem; display:flex; gap:.5rem; flex-wrap:wrap; font-size:.75rem; color:var(--text-2); align-items:center; }
.hints button { font:600 .72rem var(--mono); color:var(--cy); background:rgba(56,232,255,.06); border:1px dashed var(--line);
  padding:.3rem .6rem; border-radius:8px; cursor:pointer; }

/* ---------- SKAN bosqichi ---------- */
.stage { margin-top:1.6rem; }
.scan { padding:1.6rem; display:none; }
.scan.on { display:block; animation: rise .5s var(--smooth) both; }
.doc { position:relative; height:200px; border-radius:14px; overflow:hidden; border:1px solid var(--line);
  background: repeating-linear-gradient(0deg, rgba(56,232,255,.04) 0 2px, transparent 2px 6px), rgba(0,0,0,.35); }
.doc .ln { position:absolute; left:8%; height:9px; border-radius:4px; background:rgba(56,232,255,.18); }
.doc .beam { position:absolute; left:0; right:0; height:70px; top:-70px;
  background:linear-gradient(180deg, transparent, rgba(56,232,255,.35) 85%, var(--cy) 100%);
  box-shadow: 0 6px 30px var(--cy); animation: beam 1.1s ease-in-out infinite alternate; }
@keyframes beam { to { top:calc(100% - 4px); } }
.log { margin-top:1rem; font:500 .8rem/1.8 var(--mono); color:var(--text-2); min-height:5.4em; }
.log .ok { color:var(--ok); } .log .cy { color:var(--cy); }
.progress { height:3px; background:rgba(56,232,255,.1); border-radius:3px; overflow:hidden; margin-top:.6rem; }
.progress i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--cy),var(--vi)); box-shadow:0 0 12px var(--cy); transition:width .35s ease; }

/* ---------- NATIJA ---------- */
.result { display:none; }
.result.on { display:block; }
.cert { overflow:hidden; perspective:1200px; }
.cert-top { position:relative; padding:2rem 1.6rem 1.4rem; display:grid; grid-template-columns:auto 1fr; gap:1.3rem; align-items:center; }
.cert-top::before { content:''; position:absolute; inset:0; background:radial-gradient(500px 180px at 0% 0%, var(--tone-a), transparent 70%); opacity:.35; }
.badge { position:relative; width:92px; height:92px; }
.badge svg { position:absolute; inset:0; }
.badge .ring { fill:none; stroke:var(--tone); stroke-width:2; stroke-dasharray:6 6; animation: spin 14s linear infinite; transform-origin:50% 50%; }
.badge .draw { fill:none; stroke:var(--tone); stroke-width:3; stroke-linecap:round; stroke-dasharray:260; stroke-dashoffset:260; }
.result.on .badge .draw { animation: draw 1s .2s var(--smooth) forwards; }
.badge .ico { position:absolute; inset:0; display:grid; place-items:center; font-size:2.3rem; color:var(--tone); filter:drop-shadow(0 0 14px var(--tone));
  transform:scale(0); }
.result.on .badge .ico { animation: pop .7s .7s var(--spring) forwards; }
@keyframes draw { to { stroke-dashoffset:0; } }
@keyframes pop { to { transform:scale(1); } }
.cid { font:800 clamp(1.25rem,4vw,1.7rem) var(--mono); letter-spacing:.06em; position:relative; }
.status { position:relative; display:inline-flex; align-items:center; gap:7px; margin-top:.6rem; padding:.4rem .9rem; border-radius:999px;
  font:800 .78rem var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--tone); border:1px solid var(--tone);
  background:color-mix(in srgb, var(--tone) 12%, transparent); box-shadow:0 0 28px -8px var(--tone); }
.stamp { position:absolute; right:1.4rem; top:1.2rem; font:900 .95rem var(--mono); letter-spacing:.16em; color:var(--tone);
  border:3px solid var(--tone); padding:.35rem .7rem; border-radius:8px; transform:rotate(-14deg) scale(3); opacity:0; }
.result.on .stamp { animation: stamp .5s 1.1s cubic-bezier(.6,-.3,.7,1.4) forwards; }
@keyframes stamp { 60% { opacity:1; transform:rotate(-14deg) scale(.9); } 100% { opacity:.9; transform:rotate(-14deg) scale(1); } }

.rows { padding:.3rem 1.6rem 1.4rem; display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
.row { padding:.85rem 1rem; border-radius:14px; border:1px solid var(--line); background:rgba(0,0,0,.25);
  opacity:0; transform:translateY(14px); }
.result.on .row { animation: rise .6s var(--smooth) forwards; }
.row.wide { grid-column:1/-1; }
.row .k { font:700 .66rem var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--text-2); display:flex; align-items:center; gap:6px; }
.row .k i { color:var(--cy); }
.row .v { font-weight:700; margin-top:4px; min-height:1.3em; }
@keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }

.sect { padding:1.4rem 1.6rem; border-top:1px solid var(--line); }
.sect h3 { font:700 .72rem var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--text-2); margin-bottom:1rem; display:flex; gap:8px; align-items:center; }
.score-grid { display:grid; grid-template-columns:150px 1fr; gap:1.4rem; align-items:center; }
.gauge { position:relative; width:150px; height:150px; }
.gauge svg { transform:rotate(-90deg); }
.gauge .bgc { fill:none; stroke:rgba(56,232,255,.1); stroke-width:10; }
.gauge .fg { fill:none; stroke:url(#gA); stroke-width:10; stroke-linecap:round; stroke-dasharray:408; stroke-dashoffset:408; transition:stroke-dashoffset 1.8s var(--smooth); filter:drop-shadow(0 0 8px var(--cy)); }
.gauge .num { position:absolute; inset:0; display:grid; place-content:center; text-align:center; }
.gauge .num b { font:800 2rem var(--mono); }
.gauge .num span { font:600 .62rem var(--mono); letter-spacing:.14em; color:var(--text-2); }
.bars { display:grid; gap:.9rem; }
.bar .t { display:flex; justify-content:space-between; font-size:.82rem; font-weight:600; margin-bottom:6px; }
.bar .t b { font-family:var(--mono); color:var(--cy); }
.bar .track { height:8px; border-radius:6px; background:rgba(56,232,255,.08); overflow:hidden; }
.bar .track i { display:block; height:100%; width:0; border-radius:6px; background:linear-gradient(90deg,var(--vi),var(--cy)); transition:width 1.4s var(--smooth); }
.tests { display:grid; gap:.4rem; }
.test { display:flex; align-items:center; gap:.8rem; padding:.6rem .8rem; border-radius:12px; background:rgba(0,0,0,.2); border:1px solid transparent;
  opacity:0; transform:translateX(-14px); transition:border-color .25s, transform .25s; }
.result.on .test { animation: slideX .5s var(--smooth) forwards; }
@keyframes slideX { to { opacity:1; transform:none; } }
.test:hover { border-color:var(--line); }
.test .s { font:800 .8rem var(--mono); min-width:52px; text-align:center; padding:.25rem; border-radius:8px; }
.test .s.p { color:var(--ok); background:rgba(60,246,160,.1); } .test .s.f { color:var(--bad); background:rgba(255,93,122,.1); }
.test .n { flex:1; font-size:.86rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.actions { display:flex; gap:.7rem; padding:0 1.6rem 1.6rem; flex-wrap:wrap; }
.actions a { flex:1; min-width:150px; text-align:center; padding:.85rem; border-radius:12px; font-weight:800; font-size:.88rem; text-decoration:none;
  display:inline-flex; gap:8px; justify-content:center; align-items:center; transition:transform .25s var(--spring); }
.actions a:hover { transform:translateY(-3px); }
.actions .p { color:#021018; background:linear-gradient(90deg,var(--cy),#7df9ff); }
.actions .o { color:var(--cy); border:1.5px solid var(--line); }

/* Topilmadi */
.nf { text-align:center; padding:2.4rem 1.6rem; }
.nf .big { font:900 4rem var(--mono); color:var(--bad); text-shadow:0 0 30px var(--bad); animation: flick 2s infinite; }
@keyframes flick { 0%,100% { opacity:1; } 42% { opacity:1; } 44% { opacity:.3; } 46% { opacity:1; } 48% { opacity:.5; } 50% { opacity:1; } }
.nf p { color:var(--text-2); margin-top:.5rem; }
.panel.shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake { 20%,60% { transform:translateX(-8px); } 40%,80% { transform:translateX(8px); } }

.foot { text-align:center; margin-top:2.4rem; font:500 .75rem var(--mono); color:var(--text-2); letter-spacing:.06em; }

[data-tone="active"]  { --tone: var(--ok);   --tone-a: rgba(60,246,160,.6); }
[data-tone="expired"] { --tone: var(--warn); --tone-a: rgba(255,194,75,.6); }
[data-tone="frozen"]  { --tone: var(--cy);   --tone-a: rgba(56,232,255,.6); }
[data-tone="revoked"] { --tone: var(--bad);  --tone-a: rgba(255,93,122,.6); }

@media (max-width:640px) {
  .field { flex-direction:column; } .btn { padding:1rem; justify-content:center; }
  .rows { grid-template-columns:1fr; } .score-grid { grid-template-columns:1fr; justify-items:center; } .bars { width:100%; }
  .stamp { display:none; }
}
@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>
<div class="bg"><div class="radar"></div><canvas id="particles"></canvas></div>

<div class="wrap">
  <header class="head">
    <span class="chip"><span class="dot"></span> Tizim onlayn · Rasmiy portal</span>
    <h1>Sertifikatni <span class="glitch" data-t="tekshirish">tekshirish</span></h1>
    <p class="sub">IT Creative Zomin — seriya raqami orqali haqiqiyligini aniqlang</p>
  </header>

  <form class="panel search" id="form" autocomplete="off">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <label class="label" for="cid">// Seriya raqami</label>
    <div class="field">
      <div class="input"><i class="bi bi-upc-scan"></i><input id="cid" placeholder="ZMT-PY-26001" required></div>
      <button class="btn" type="submit"><i class="bi bi-radar"></i> Skanerlash</button>
    </div>
    <div class="hints">Demo:
      <button type="button" data-id="ZMT-PY-26001">ZMT-PY-26001</button>
      <button type="button" data-id="ZMT-WB-25014">ZMT-WB-25014</button>
      <button type="button" data-id="ZMT-XX-00000">ZMT-XX-00000</button>
    </div>
  </form>

  <div class="stage">
    <div class="panel scan" id="scan">
      <div class="doc">
        <div class="ln" style="top:24px;width:46%"></div><div class="ln" style="top:52px;width:70%"></div>
        <div class="ln" style="top:80px;width:58%"></div><div class="ln" style="top:118px;width:30%;left:62%"></div>
        <div class="ln" style="top:150px;width:40%"></div>
        <div class="beam"></div>
      </div>
      <div class="log" id="log"></div>
      <div class="progress"><i id="prog"></i></div>
    </div>

    <div class="result" id="result"></div>
  </div>

  <p class="foot">© IT Creative Zomin · SHA-256 imzo bilan himoyalangan</p>
</div>

<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gA" x1="0" x2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#38e8ff"/></linearGradient></defs></svg>

<script>
/* ---------- DEMO ma'lumotlar (Django'da {{ certificate }} bilan almashtiriladi) ---------- */
const DB = {
  'ZMT-PY-26001': { status:'active', label:'Faol', owner:'Aliyev Jasur Baxtiyorovich', course:'Python Backend dasturlash', from:'14.03.2026', until:'14.03.2028', left:'1 yil 4 oy', by:'Husanbek Suyunov',
    desc:'Kursni a\'lo baholar bilan tamomlagan.', overall:87.4, tests:[['Python asoslari',96,1],['OOP va klasslar',88,1],['Django ORM',74,1],['REST API',58,0],['Yakuniy imtihon',91,1]],
    hw:[14,8.7], sp:[6,8.2] },
  'ZMT-WB-25014': { status:'expired', label:'Muddati tugagan', owner:'Karimova Nilufar', course:'Frontend: HTML, CSS, JS', from:'02.02.2024', until:'02.02.2026', by:'IT Creative — avtomatik tizim',
    overall:71.2, tests:[['HTML semantika',82,1],['CSS Grid',66,1],['JavaScript DOM',49,0]], hw:[9,7.1], sp:[0,0] }
};
const ICON = { active:'bi-patch-check-fill', expired:'bi-clock-history', frozen:'bi-snow2', revoked:'bi-x-octagon-fill' };
const STAMP = { active:'TASDIQLANDI', expired:'MUDDATI O\'TGAN', frozen:'MUZLATILGAN', revoked:'BEKOR' };
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

document.querySelectorAll('.hints button').forEach(b => b.onclick = () => { $('#cid').value = b.dataset.id; $('#form').requestSubmit(); });

/* Matn "dekod" effekti — tasodifiy belgilar asl matnga aylanadi */
function decode(el, text, dur = 700) {
  if (reduced) { el.textContent = text; return; }
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#$%&@';
  const t0 = performance.now();
  (function f(now) {
    const p = Math.max(0, Math.min(1, (now - t0) / dur)), n = Math.floor(text.length * p);
    el.textContent = text.slice(0, n) + [...text.slice(n)].map(c => c === ' ' ? ' ' : chars[Math.random() * chars.length | 0]).join('');
    if (p < 1) requestAnimationFrame(f);
  })(t0);
}

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const id = $('#cid').value.trim().toUpperCase();
  const res = $('#result'), scan = $('#scan'), log = $('#log'), prog = $('#prog');
  res.className = 'result'; res.innerHTML = ''; log.innerHTML = ''; prog.style.width = '0';
  scan.classList.add('on');
  const steps = [['> ID formati tekshirilmoqda…', 'cy'], ['> Ma\'lumotlar bazasidan qidirilmoqda…', 'cy'], ['> Raqamli imzo solishtirilmoqda…', 'cy']];
  for (let i = 0; i < steps.length; i++) {
    log.insertAdjacentHTML('beforeend', `<div class="${steps[i][1]}">${steps[i][0]}</div>`);
    prog.style.width = ((i + 1) / (steps.length + 1) * 100) + '%';
    await sleep(reduced ? 0 : 520);
  }
  const c = DB[id];
  log.insertAdjacentHTML('beforeend', c ? '<div class="ok">✓ Hujjat topildi</div>' : '<div style="color:var(--bad)">✗ Mos yozuv yo\'q</div>');
  prog.style.width = '100%';
  await sleep(reduced ? 0 : 450);
  scan.classList.remove('on');
  c ? renderFound(id, c) : renderNotFound();
});

function renderNotFound() {
  const r = $('#result');
  r.innerHTML = `<div class="panel nf shake"><div class="big">404</div><h3>Sertifikat topilmadi</h3>
    <p>Bu seriya raqamiga mos sertifikat mavjud emas. Raqamni tekshirib, qayta urinib ko'ring.</p></div>`;
  r.className = 'result on';
}

function renderFound(id, c) {
  const r = $('#result');
  const tests = c.tests.map((t, i) => `<div class="test" style="animation-delay:${1.3 + i * .08}s">
      <span class="s ${t[2] ? 'p' : 'f'}">${t[1]}%</span><span class="n">${t[0]}</span>
      <i class="bi ${t[2] ? 'bi-check2-circle' : 'bi-x-circle'}" style="color:var(--${t[2] ? 'ok' : 'bad'})"></i></div>`).join('');
  const avg = (c.tests.reduce((a, t) => a + t[1], 0) / c.tests.length).toFixed(1);
  r.innerHTML = `
  <div class="panel cert" data-tone="${c.status}">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <div class="cert-top">
      <div class="badge"><svg viewBox="0 0 92 92"><circle class="ring" cx="46" cy="46" r="44"/><circle class="draw" cx="46" cy="46" r="38"/></svg>
        <div class="ico"><i class="bi ${ICON[c.status]}"></i></div></div>
      <div><div class="cid" id="cidOut"></div><div class="status"><i class="bi bi-circle-fill" style="font-size:.5rem"></i>${c.label}</div></div>
      <div class="stamp">${STAMP[c.status]}</div>
    </div>
    <div class="rows">
      ${row('bi-person-fill', 'Egasi', c.owner, .3, true)}
      ${row('bi-book-fill', 'Kurs', c.course, .4, true)}
      ${row('bi-calendar-check', 'Berilgan sana', c.from, .5)}
      ${row('bi-calendar-x', 'Amal qilish muddati', c.until + (c.left ? ` · <span style="color:var(--ok)">${c.left} qoldi</span>` : ''), .58)}
      ${row('bi-award-fill', 'Kim tomonidan berilgan', c.by, .66, true)}
      ${c.desc ? row('bi-info-circle', 'Tavsif', c.desc, .74, true) : ''}
    </div>
    <div class="sect"><h3><i class="bi bi-activity"></i> O'quvchi natijalari</h3>
      <div class="score-grid">
        <div class="gauge"><svg width="150" height="150" viewBox="0 0 150 150"><circle class="bgc" cx="75" cy="75" r="65"/><circle class="fg" id="fg" cx="75" cy="75" r="65"/></svg>
          <div class="num"><b class="count" data-to="${c.overall}">0</b><span>UMUMIY BALL</span></div></div>
        <div class="bars">
          ${bar('Testlar', `${c.tests.filter(t => t[2]).length}/${c.tests.length} o'tdi · ${avg}%`, avg)}
          ${bar('Uy vazifalari', `${c.hw[0]} ta · ${c.hw[1]}/10`, c.hw[1] * 10)}
          ${bar('Speaking', `${c.sp[0]} ta · ${c.sp[1]}/10`, c.sp[1] * 10)}
        </div>
      </div>
    </div>
    <div class="sect"><h3><i class="bi bi-list-check"></i> Test natijalari</h3><div class="tests">${tests}</div></div>
    ${c.status === 'active' ? `<div class="actions"><a class="p" href="#"><i class="bi bi-download"></i> Yuklab olish</a><a class="o" href="#"><i class="bi bi-box-arrow-up-right"></i> Ochish</a></div>` : ''}
  </div>`;
  r.className = 'result on';
  decode($('#cidOut'), id, 900);
  r.querySelectorAll('.row .v[data-text]').forEach((v, i) => setTimeout(() => decode(v, v.dataset.text, 500), 300 + i * 90));
  setTimeout(() => {
    $('#fg').style.strokeDashoffset = 408 - 408 * c.overall / 100;
    r.querySelectorAll('.track i').forEach(b => b.style.width = b.dataset.w + '%');
    countUp(r.querySelector('.count'));
  }, 900);
}
function row(ic, k, v, d, wide) {
  const plain = /</.test(v) ? '' : `data-text="${v}"`;
  return `<div class="row${wide ? ' wide' : ''}" style="animation-delay:${d}s"><div class="k"><i class="bi ${ic}"></i>${k}</div><div class="v" ${plain}>${plain ? '' : v}</div></div>`;
}
function bar(t, sub, w) { return `<div class="bar"><div class="t"><span>${t}</span><b>${sub}</b></div><div class="track"><i data-w="${w}"></i></div></div>`; }
function countUp(el) {
  const to = parseFloat(el.dataset.to), t0 = performance.now(), d = reduced ? 1 : 1600;
  (function f(n) { const p = Math.max(0, Math.min(1, (n - t0) / d)), e = 1 - Math.pow(1 - p, 3); el.textContent = (to * e).toFixed(1) + '%'; if (p < 1) requestAnimationFrame(f); })(t0);
}

/* ---------- Fon zarrachalari ---------- */
(function () {
  const cv = $('#particles'), ctx = cv.getContext('2d'); let W, H, P = [];
  const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; P = Array.from({ length: Math.min(70, W / 18) }, () => ({ x: Math.random() * W, y: Math.random() * H, v: .2 + Math.random() * .6, s: Math.random() * 1.6 + .4 })); };
  resize(); addEventListener('resize', resize);
  if (reduced) return;
  (function loop() {
    ctx.clearRect(0, 0, W, H);
    P.forEach(p => { p.y -= p.v; if (p.y < 0) { p.y = H; p.x = Math.random() * W; }
      ctx.fillStyle = `rgba(56,232,255,${.15 + p.s / 4})`; ctx.fillRect(p.x, p.y, p.s, p.s * 4); });
    requestAnimationFrame(loop);
  })();
})();
/* ?id=... bilan ochilsa — avtomatik tekshirish */
const qid = new URLSearchParams(location.search).get('id');
if (qid) { $('#cid').value = qid; $('#form').requestSubmit(); }
</script>
</body>
</html>
