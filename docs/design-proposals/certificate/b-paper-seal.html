<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B — Paper & Seal | Sertifikat tekshirish</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,500&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
/* =====================================================================
   VARIANT B — PAPER & SEAL
   Yorug', nafis "rasmiy hujjat" uslubi: qog'oz ochiladi, gilyosh naqsh
   chiziladi, oltin muhr prujina bilan bosiladi, imzo yoziladi.
   ===================================================================== */
:root {
  --bg: #f6f1e7; --paper: #fffdf8; --ink: #1d1a2e; --ink-2: #6b6578; --ink-3: #a59fb0;
  --gold: #c8962e; --gold-2: #e9c46a; --navy: #23305c; --line: rgba(29,26,46,.09);
  --ok: #1f9d63; --warn: #c27a0e; --bad: #c2384b; --frz: #2f6fd1;
  --spring: cubic-bezier(.34,1.56,.64,1); --smooth: cubic-bezier(.22,1,.36,1);
  --serif: 'Playfair Display', Georgia, serif; --mono: 'JetBrains Mono', monospace;
}
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',system-ui,sans-serif; color:var(--ink); min-height:100vh; overflow-x:hidden;
  background: radial-gradient(1000px 600px at 90% -10%, #efe3c8, transparent 60%), radial-gradient(800px 500px at -10% 110%, #e7e3f3, transparent 60%), var(--bg); }

/* Fon: sekin suzuvchi gilyosh to'lqinlar */
.waves { position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.55; }
.waves path { fill:none; stroke:var(--gold); stroke-width:.6; opacity:.35; }
.waves g { animation: wave 18s ease-in-out infinite alternate; transform-origin:center; }
.waves g:nth-child(2) { animation-duration:24s; animation-direction:alternate-reverse; }
@keyframes wave { to { transform: translateX(-60px) translateY(20px) scaleY(1.08); } }

.wrap { position:relative; z-index:2; max-width:780px; margin:0 auto; padding:3.5rem 1.2rem 4rem; }

/* ---------- Sarlavha ---------- */
.head { text-align:center; margin-bottom:2.4rem; }
.crest { width:64px; height:64px; margin:0 auto 1rem; border-radius:50%; display:grid; place-items:center; font-size:1.7rem; color:#fff;
  background: radial-gradient(circle at 30% 25%, var(--gold-2), var(--gold) 60%, #8f6516); box-shadow:0 12px 30px -10px rgba(200,150,46,.7), inset 0 2px 3px rgba(255,255,255,.5);
  animation: crestIn 1s var(--spring) both; }
@keyframes crestIn { from { transform:scale(0) rotate(-120deg); } }
.eyebrow { font:600 .72rem var(--mono); letter-spacing:.3em; text-transform:uppercase; color:var(--gold); }
h1 { font-family:var(--serif); font-weight:800; font-size:clamp(2rem,6vw,3.3rem); letter-spacing:-.01em; line-height:1.08; margin:.5rem 0; }
h1 em { font-style:italic; font-weight:500; color:var(--navy); }
.head .word { display:inline-block; opacity:0; transform:translateY(30px) rotate(4deg); animation: wordIn .8s var(--smooth) forwards; }
@keyframes wordIn { to { opacity:1; transform:none; } }
.lead { color:var(--ink-2); max-width:440px; margin:0 auto; }

/* ---------- Qidiruv ---------- */
.search { background:var(--paper); border-radius:22px; padding:1.6rem 1.8rem; box-shadow:0 1px 0 var(--line), 0 30px 60px -30px rgba(60,40,10,.25);
  border:1px solid var(--line); animation: rise .9s .4s var(--smooth) both; }
.search label { font:600 .7rem var(--mono); letter-spacing:.2em; text-transform:uppercase; color:var(--ink-3); }
.field { display:flex; align-items:flex-end; gap:1rem; margin-top:.4rem; }
.under { flex:1; position:relative; }
.under input { width:100%; border:0; outline:0; background:transparent; padding:.6rem 0; font:700 clamp(1.2rem,4vw,1.7rem) var(--mono); letter-spacing:.1em; color:var(--navy); text-transform:uppercase; }
.under input::placeholder { color:#d4cfdb; }
.under::before, .under::after { content:''; position:absolute; left:0; bottom:0; height:2px; width:100%; background:var(--line); }
.under::after { background:linear-gradient(90deg,var(--gold),var(--navy)); transform:scaleX(0); transform-origin:left; transition:transform .6s var(--smooth); }
.under:focus-within::after { transform:scaleX(1); }
.btn { border:0; cursor:pointer; width:58px; height:58px; border-radius:50%; flex-shrink:0; font-size:1.4rem; color:#fff; background:var(--navy);
  box-shadow:0 12px 26px -10px rgba(35,48,92,.8); transition:transform .4s var(--spring), background .3s; display:grid; place-items:center; }
.btn:hover { transform:rotate(-12deg) scale(1.08); background:#18224a; }
.btn:active { transform:scale(.9); }
.hints { margin-top:1rem; display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; font-size:.78rem; color:var(--ink-3); }
.hints button { cursor:pointer; font:600 .72rem var(--mono); color:var(--navy); background:#f3eee3; border:0; padding:.35rem .7rem; border-radius:999px; transition:background .2s; }
.hints button:hover { background:#eadfc6; }

/* ---------- Kutish: imzo yozilmoqda ---------- */
.writing { display:none; text-align:center; padding:2.2rem 0 .6rem; }
.writing.on { display:block; }
.writing svg path { fill:none; stroke:var(--navy); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:900; stroke-dashoffset:900; animation: sign 1.5s ease-in-out forwards; }
@keyframes sign { to { stroke-dashoffset:0; } }
.writing p { font:italic 500 1rem var(--serif); color:var(--ink-2); margin-top:.4rem; }

/* ---------- Sertifikat qog'ozi ---------- */
.result { margin-top:2rem; perspective:1600px; }
.paper { position:relative; background:var(--paper); border-radius:6px; padding:2.6rem 2.4rem 2.2rem;
  box-shadow: 0 2px 0 #ece4d4, 0 4px 0 #f4eee2, 0 40px 80px -30px rgba(60,40,10,.35);
  transform-origin:top center; animation: unfold 1.1s var(--smooth) both; }
@keyframes unfold { from { transform: rotateX(-82deg) translateY(-20px); opacity:0; } 60% { opacity:1; } to { transform:none; } }
.paper .frame { position:absolute; inset:12px; pointer-events:none; }
.paper .frame rect { fill:none; stroke:var(--gold); stroke-width:1.2; }
.paper .frame rect.b { stroke-width:.6; stroke-dasharray:2 4; }
.paper .frame rect.d { stroke-dasharray:var(--len); stroke-dashoffset:var(--len); animation: drawF 1.6s .6s var(--smooth) forwards; }
@keyframes drawF { to { stroke-dashoffset:0; } }

.p-head { text-align:center; position:relative; }
.p-head .k { font:600 .68rem var(--mono); letter-spacing:.32em; color:var(--gold); text-transform:uppercase; }
.p-head h2 { font-family:var(--serif); font-size:clamp(1.5rem,4.6vw,2.2rem); margin:.4rem 0 .2rem; }
.p-head .cid { font:700 .95rem var(--mono); letter-spacing:.14em; color:var(--ink-2); }
.owner { text-align:center; margin:1.8rem 0 .4rem; }
.owner small { font:italic 500 .95rem var(--serif); color:var(--ink-3); }
.owner .name { font-family:var(--serif); font-weight:800; font-size:clamp(1.6rem,5vw,2.4rem); color:var(--navy); margin-top:.3rem; position:relative; display:inline-block; }
.owner .name::after { content:''; position:absolute; left:10%; right:10%; bottom:-6px; height:2px; background:var(--gold); transform:scaleX(0); animation: grow .8s 1.4s var(--smooth) forwards; }
@keyframes grow { to { transform:scaleX(1); } }
.owner .course { color:var(--ink-2); margin-top:1rem; }
.owner .course b { color:var(--ink); }

.meta { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin:2rem 0 1.2rem; text-align:center; }
.meta div { opacity:0; animation: rise .7s var(--smooth) forwards; }
.meta small { display:block; font:600 .62rem var(--mono); letter-spacing:.2em; text-transform:uppercase; color:var(--ink-3); }
.meta b { display:block; margin-top:.35rem; font-weight:700; }

.sign-row { display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; margin-top:1.4rem; }
.sig { text-align:center; min-width:170px; }
.sig svg path { fill:none; stroke:var(--navy); stroke-width:2; stroke-linecap:round; stroke-dasharray:600; stroke-dashoffset:600; animation: sign 1.3s 1.6s ease-in-out forwards; }
.sig div { border-top:1px solid var(--ink-3); padding-top:.35rem; font-size:.75rem; color:var(--ink-2); }

/* Oltin muhr */
.seal { position:relative; width:112px; height:112px; flex-shrink:0; transform:scale(2.6) rotate(-40deg); opacity:0; animation: sealIn .7s 1.9s cubic-bezier(.5,-.4,.6,1.5) forwards; }
@keyframes sealIn { 70% { opacity:1; transform:scale(.92) rotate(6deg); } 100% { opacity:1; transform:scale(1) rotate(0); } }
.seal .disc { position:absolute; inset:0; border-radius:50%; display:grid; place-items:center; color:#fff;
  background: radial-gradient(circle at 32% 28%, color-mix(in srgb,var(--tone) 55%, #fff), var(--tone) 55%, color-mix(in srgb,var(--tone) 70%, #000));
  box-shadow: 0 10px 25px -8px color-mix(in srgb,var(--tone) 80%, transparent), inset 0 -4px 8px rgba(0,0,0,.2), inset 0 3px 6px rgba(255,255,255,.4); }
.seal .disc i { font-size:2.2rem; }
.seal svg { position:absolute; inset:-8px; width:128px; height:128px; animation: spin 30s linear infinite; }
.seal svg text { font:700 9.5px var(--mono); letter-spacing:2.6px; fill:var(--tone); }
@keyframes spin { to { transform:rotate(360deg); } }
.seal::before { content:''; position:absolute; inset:-20px; border-radius:50%; border:2px solid var(--tone); opacity:0; animation: shock .9s 2.25s ease-out; }
@keyframes shock { from { opacity:.7; transform:scale(.6); } to { opacity:0; transform:scale(1.5); } }
.status { display:inline-flex; align-items:center; gap:6px; margin-top:.8rem; font:700 .74rem var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--tone);
  padding:.35rem .8rem; border-radius:999px; background:color-mix(in srgb,var(--tone) 10%, transparent); }

/* ---------- Natijalar (pastdagi karta) ---------- */
.stats-card { margin-top:1.4rem; background:var(--paper); border:1px solid var(--line); border-radius:22px; padding:1.8rem; box-shadow:0 30px 60px -30px rgba(60,40,10,.22);
  animation: rise .9s 1.2s var(--smooth) both; }
.stats-card h3 { font-family:var(--serif); font-size:1.35rem; margin-bottom:1.2rem; display:flex; align-items:center; gap:.6rem; }
.stats-card h3 i { color:var(--gold); font-size:1.1rem; }
.kpis { display:grid; grid-template-columns:1.2fr 1fr 1fr 1fr; gap:1rem; }
.kpi { padding:1rem; border-radius:16px; background:#faf6ec; transition:transform .4s var(--spring); }
.kpi:hover { transform:translateY(-4px) rotate(-1deg); }
.kpi.main { background:var(--navy); color:#fff; }
.kpi small { font:600 .62rem var(--mono); letter-spacing:.16em; text-transform:uppercase; opacity:.65; }
.kpi b { display:block; font-family:var(--serif); font-size:2rem; margin-top:.2rem; }
.kpi span { font-size:.76rem; opacity:.7; }
.kpi.main .meter { height:5px; background:rgba(255,255,255,.15); border-radius:4px; margin-top:.6rem; overflow:hidden; }
.kpi.main .meter i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--gold-2),var(--gold)); transition:width 1.6s var(--smooth); }
.tests { margin-top:1.4rem; }
.test { display:grid; grid-template-columns:1fr auto; gap:.3rem 1rem; padding:.75rem 0; border-bottom:1px dashed var(--line); opacity:0; animation: rise .6s var(--smooth) forwards; }
.test:last-child { border-bottom:0; }
.test .n { font-weight:600; font-size:.9rem; }
.test .s { font:700 .85rem var(--mono); }
.test .line { grid-column:1/-1; height:3px; background:#f0eadc; border-radius:3px; overflow:hidden; }
.test .line i { display:block; height:100%; width:0; border-radius:3px; transition:width 1.2s var(--smooth); }
.actions { display:flex; gap:.8rem; margin-top:1.6rem; flex-wrap:wrap; }
.actions a { flex:1; min-width:150px; padding:.9rem; border-radius:999px; text-align:center; font-weight:700; text-decoration:none; font-size:.9rem;
  display:inline-flex; gap:8px; align-items:center; justify-content:center; transition:transform .35s var(--spring), box-shadow .3s; }
.actions a:hover { transform:translateY(-3px); }
.actions .p { background:var(--navy); color:#fff; box-shadow:0 12px 26px -12px rgba(35,48,92,.8); }
.actions .o { border:1.5px solid var(--navy); color:var(--navy); }

/* Topilmadi */
.nf { margin-top:2rem; text-align:center; background:var(--paper); border-radius:22px; padding:2.6rem 1.8rem; border:1px solid var(--line);
  animation: tear .8s var(--smooth) both; }
@keyframes tear { 0% { opacity:0; transform:translateY(20px) rotate(-3deg); } 50% { transform:rotate(2deg); } 100% { opacity:1; transform:none; } }
.nf .ic { width:76px; height:76px; margin:0 auto 1rem; border-radius:50%; display:grid; place-items:center; font-size:2rem; color:var(--bad);
  background:color-mix(in srgb,var(--bad) 10%, transparent); animation: wobble 1.2s .3s var(--spring); }
@keyframes wobble { 25% { transform:rotate(-14deg); } 50% { transform:rotate(10deg); } 75% { transform:rotate(-5deg); } }
.nf h3 { font-family:var(--serif); font-size:1.5rem; }
.nf p { color:var(--ink-2); margin-top:.4rem; }

@keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
.foot { text-align:center; margin-top:2.6rem; font-size:.78rem; color:var(--ink-3); }
.foot a { color:var(--navy); font-weight:700; text-decoration:none; }

[data-tone="active"]  { --tone: var(--ok); }
[data-tone="expired"] { --tone: var(--warn); }
[data-tone="frozen"]  { --tone: var(--frz); }
[data-tone="revoked"] { --tone: var(--bad); }

@media (max-width:640px) {
  .paper { padding:2rem 1.3rem 1.6rem; }
  .meta { grid-template-columns:1fr; gap:.8rem; }
  .kpis { grid-template-columns:1fr 1fr; } .kpi.main { grid-column:1/-1; }
  .sign-row { flex-direction:column-reverse; align-items:center; }
}
@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after { animation-duration:.01ms !important; animation-delay:0s !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>
<svg class="waves" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g id="w1"></g><g id="w2"></g>
</svg>

<div class="wrap">
  <header class="head">
    <div class="crest"><i class="bi bi-mortarboard-fill"></i></div>
    <div class="eyebrow">IT Creative Zomin</div>
    <h1><span class="word" style="animation-delay:.15s">Sertifikat</span> <span class="word" style="animation-delay:.28s"><em>haqiqiyligini</em></span> <span class="word" style="animation-delay:.41s">tekshiring</span></h1>
    <p class="lead">Seriya raqamini kiriting — rasmiy reyestrdan bir zumda tasdiqlaymiz.</p>
  </header>

  <form class="search" id="form" autocomplete="off">
    <label for="cid">Seriya raqami</label>
    <div class="field">
      <div class="under"><input id="cid" placeholder="ZMT-PY-26001" required></div>
      <button class="btn" type="submit" aria-label="Tekshirish"><i class="bi bi-arrow-right"></i></button>
    </div>
    <div class="hints">Namuna:
      <button type="button" data-id="ZMT-PY-26001">ZMT-PY-26001</button>
      <button type="button" data-id="ZMT-WB-25014">ZMT-WB-25014</button>
      <button type="button" data-id="ZMT-XX-00000">ZMT-XX-00000</button>
    </div>
  </form>

  <div class="writing" id="writing">
    <svg width="260" height="70" viewBox="0 0 260 70"><path d="M10 50 C 30 10, 45 10, 48 40 S 60 62, 75 30 S 95 10, 100 45 C 104 60, 120 20, 130 35 S 150 55, 160 30 C 168 12, 180 50, 195 38 S 225 20, 250 42"/></svg>
    <p>Reyestr tekshirilmoqda…</p>
  </div>

  <div id="result"></div>

  <p class="foot">© IT Creative Zomin — rasmiy sertifikat reyestri · <a href="#">Bosh sahifa</a></p>
</div>

<script>
/* ---------- DEMO ma'lumotlar ---------- */
const DB = {
  'ZMT-PY-26001': { status:'active', label:'Faol', owner:'Aliyev Jasur', course:'Python Backend dasturlash', from:'14.03.2026', until:'14.03.2028', left:'1 yil 4 oy qoldi', by:'Husanbek Suyunov',
    overall:87.4, tests:[['Python asoslari',96,1],['OOP va klasslar',88,1],['Django ORM',74,1],['REST API',58,0],['Yakuniy imtihon',91,1]], hw:[14,8.7], sp:[6,8.2] },
  'ZMT-WB-25014': { status:'expired', label:'Muddati tugagan', owner:'Karimova Nilufar', course:'Frontend: HTML, CSS, JS', from:'02.02.2024', until:'02.02.2026', by:'Avtomatik tizim',
    overall:71.2, tests:[['HTML semantika',82,1],['CSS Grid',66,1],['JavaScript DOM',49,0]], hw:[9,7.1], sp:[0,0] }
};
const ICON = { active:'bi-check-lg', expired:'bi-hourglass-bottom', frozen:'bi-snow2', revoked:'bi-x-lg' };
const SEAL = { active:'• TASDIQLANGAN • HAQIQIY HUJJAT ', expired:'• MUDDATI TUGAGAN • ARXIV ', frozen:'• MUZLATILGAN • VAQTINCHA ', revoked:'• BEKOR QILINGAN • YAROQSIZ ' };
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Fon gilyosh to'lqinlari */
['w1', 'w2'].forEach((id, k) => {
  let html = '';
  for (let i = 0; i < 26; i++) {
    const y = 80 + i * 26, a = 30 + k * 18;
    html += `<path d="M-50 ${y} C 200 ${y - a}, 400 ${y + a}, 600 ${y} S 1000 ${y - a}, 1250 ${y}"/>`;
  }
  document.getElementById(id).innerHTML = html;
});

document.querySelectorAll('.hints button').forEach(b => b.onclick = () => { $('#cid').value = b.dataset.id; $('#form').requestSubmit(); });

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const id = $('#cid').value.trim().toUpperCase(), w = $('#writing'), r = $('#result');
  r.innerHTML = '';
  w.classList.remove('on'); void w.offsetWidth; w.classList.add('on');
  await sleep(reduced ? 0 : 1500);
  w.classList.remove('on');
  const c = DB[id];
  c ? found(id, c) : notFound();
  r.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
});

function notFound() {
  $('#result').innerHTML = `<div class="nf"><div class="ic"><i class="bi bi-file-earmark-x"></i></div>
    <h3>Sertifikat topilmadi</h3><p>Bu seriya raqamiga mos sertifikat reyestrda mavjud emas.<br>Raqamni tekshirib, qayta urinib ko'ring.</p></div>`;
}

function found(id, c) {
  const avg = (c.tests.reduce((a, t) => a + t[1], 0) / c.tests.length).toFixed(1);
  const passed = c.tests.filter(t => t[2]).length;
  const tests = c.tests.map((t, i) => `<div class="test" style="animation-delay:${1.5 + i * .1}s">
      <span class="n">${t[0]}</span><span class="s" style="color:var(--${t[2] ? 'ok' : 'bad'})">${t[1]}% · ${t[2] ? 'O\'tdi' : 'O\'tmadi'}</span>
      <span class="line"><i data-w="${t[1]}" style="background:var(--${t[2] ? 'ok' : 'bad'})"></i></span></div>`).join('');

  $('#result').innerHTML = `
  <div class="result" data-tone="${c.status}">
    <article class="paper">
      <svg class="frame" width="100%" height="100%"><rect class="d" x="1" y="1" rx="3"/><rect class="b" x="7" y="7" rx="2"/></svg>
      <div class="p-head">
        <div class="k">Rasmiy sertifikat</div>
        <h2>Muvaffaqiyatli tamomlagani uchun</h2>
        <div class="cid">№ ${id}</div>
      </div>
      <div class="owner">
        <small>ushbu hujjat egasi</small><br>
        <div class="name">${c.owner}</div>
        <p class="course"><b>${c.course}</b> kursini tamomladi</p>
      </div>
      <div class="meta">
        <div style="animation-delay:1.1s"><small>Berilgan sana</small><b>${c.from}</b></div>
        <div style="animation-delay:1.2s"><small>Amal qilish muddati</small><b>${c.until}</b>${c.left ? `<span style="font-size:.74rem;color:var(--ok)">${c.left}</span>` : ''}</div>
        <div style="animation-delay:1.3s"><small>Holati</small><span class="status"><i class="bi bi-circle-fill" style="font-size:.45rem"></i>${c.label}</span></div>
      </div>
      <div class="sign-row">
        <div class="sig">
          <svg width="170" height="50" viewBox="0 0 170 50"><path d="M8 36 C 22 6, 32 8, 34 30 S 46 44, 58 20 C 66 6, 74 40, 86 28 S 104 14, 112 32 C 118 44, 136 14, 162 26"/></svg>
          <div>${c.by}</div>
        </div>
        <div class="seal">
          <svg viewBox="0 0 128 128"><defs><path id="circ" d="M64 64 m-54 0 a54 54 0 1 1 108 0 a54 54 0 1 1 -108 0"/></defs>
            <text><textPath href="#circ">${SEAL[c.status]}${SEAL[c.status]}</textPath></text></svg>
          <div class="disc"><i class="bi ${ICON[c.status]}"></i></div>
        </div>
      </div>
    </article>

    <section class="stats-card">
      <h3><i class="bi bi-bar-chart-line-fill"></i> O'quvchi natijalari</h3>
      <div class="kpis">
        <div class="kpi main"><small>Umumiy ball</small><b class="count" data-to="${c.overall}" data-suf="%">0</b><div class="meter"><i data-w="${c.overall}"></i></div></div>
        <div class="kpi"><small>Testlar</small><b class="count" data-to="${c.tests.length}">0</b><span>${passed} ta o'tdi</span></div>
        <div class="kpi"><small>Vazifalar</small><b class="count" data-to="${c.hw[0]}">0</b><span>o'rtacha ${c.hw[1]}/10</span></div>
        <div class="kpi"><small>Speaking</small><b class="count" data-to="${c.sp[0]}">0</b><span>o'rtacha ${c.sp[1]}/10</span></div>
      </div>
      <div class="tests">${tests}</div>
      <p style="margin-top:1rem;font-size:.85rem;color:var(--ink-2)">O'rtacha test bali: <b style="font-family:var(--mono);color:var(--ink)">${avg}%</b></p>
      ${c.status === 'active' ? `<div class="actions"><a class="p" href="#"><i class="bi bi-download"></i> Yuklab olish</a><a class="o" href="#"><i class="bi bi-box-arrow-up-right"></i> Ochish</a></div>` : ''}
    </section>
  </div>`;

  /* Ramka uzunligini hisoblab, chizilish animatsiyasini sozlash */
  const svg = document.querySelector('.frame'), rd = svg.querySelector('.d'), rb = svg.querySelector('.b');
  /* offsetWidth — transform (ochilish animatsiyasi) ta'sir qilmaydigan o'lcham */
  const p = svg.parentElement, box = { width: p.offsetWidth - 24, height: p.offsetHeight - 24 };
  rd.setAttribute('width', box.width - 2); rd.setAttribute('height', box.height - 2);
  rb.setAttribute('width', box.width - 14); rb.setAttribute('height', box.height - 14);
  rd.style.setProperty('--len', 2 * (box.width + box.height));

  setTimeout(() => {
    document.querySelectorAll('[data-w]').forEach(el => el.style.width = el.dataset.w + '%');
    document.querySelectorAll('.count').forEach(countUp);
  }, reduced ? 0 : 1400);
}
function countUp(el) {
  const to = parseFloat(el.dataset.to), suf = el.dataset.suf || '', dec = to % 1 ? 1 : 0, t0 = performance.now(), d = reduced ? 1 : 1400;
  (function f(n) { const p = Math.max(0, Math.min(1, (n - t0) / d)), e = 1 - Math.pow(1 - p, 4); el.textContent = (to * e).toFixed(dec) + suf; if (p < 1) requestAnimationFrame(f); })(t0);
}
/* ?id=... bilan ochilsa — avtomatik tekshirish */
const qid = new URLSearchParams(location.search).get('id');
if (qid) { $('#cid').value = qid; $('#form').requestSubmit(); }
</script>
</body>
</html>
