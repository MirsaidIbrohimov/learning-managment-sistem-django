<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../static/img/fav.ico">
<title>Design Preview Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.min.css">
<style>
  :root { --bg: #0d0f14; --panel: #151821; --line: #262a36; --text: #e9ebf1; --dim: #9aa1b2; --acc: #22d3ee; --acc2: #818cf8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; display: flex; flex-direction: column; overflow: hidden; }
  button, select { font: inherit; color: inherit; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .logo { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
  .logo b { font-size: 14px; letter-spacing: -.01em; }
  .logo small { display: block; color: var(--dim); font-size: 11px; }
  .logo i { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, #22d3ee, #6366f1); color: #fff; font-size: 16px; }
  .grp { display: flex; flex-direction: column; gap: 4px; }
  .grp > span { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 700; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: #0d0f14; border: 1px solid var(--line); }
  .seg button { border: 0; background: none; height: 28px; padding: 0 10px; border-radius: 7px; cursor: pointer; color: var(--dim); font-weight: 600; white-space: nowrap; transition: background-color .2s, color .2s; display: inline-flex; align-items: center; gap: 6px; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: #262b38; color: #fff; box-shadow: inset 0 0 0 1px #343a4a; }
  .seg button .tag { font-size: 10px; font-weight: 800; width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; }
  .tA { background: linear-gradient(135deg, #22b2db, #0c3b55); color: #fff; } .tB { background: linear-gradient(135deg, #6366f1, #06b6d4); color: #fff; } .tC { background: #e8eaef; color: #0a0c10; }
  select { height: 34px; border-radius: 10px; background: #0d0f14; border: 1px solid var(--line); padding: 0 10px; }
  .btn { height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: #1b1f2a; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: background-color .2s, transform .1s; text-decoration: none; color: var(--text); }
  .btn:hover { background: #242938; } .btn:active { transform: scale(.97); }
  .btn.pri { background: linear-gradient(135deg, #0891b2, #4f46e5); border-color: transparent; color: #fff; }
  .btn[aria-pressed="true"] { background: #23394a; border-color: #2b6b84; color: #bff4ff; }
  .tools { margin-left: auto; display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  main { flex: 1; min-height: 0; position: relative; display: flex; }
  .stage { flex: 1; min-width: 0; position: relative; overflow: hidden; display: grid; place-items: center;
    background: radial-gradient(800px 400px at 50% 0%, #161b26, transparent), var(--bg); }
  .device { position: relative; transform-origin: center center; transition: width .45s cubic-bezier(.22,1,.36,1), height .45s cubic-bezier(.22,1,.36,1); border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px -30px #000, 0 0 0 1px #2a2f3c; background: #000; }
  .device.mobile { border-radius: 38px; box-shadow: 0 30px 80px -30px #000, 0 0 0 10px #1c1f27, 0 0 0 11px #343947; }
  .device.tablet { border-radius: 24px; box-shadow: 0 30px 80px -30px #000, 0 0 0 12px #1c1f27, 0 0 0 13px #343947; }
  .device iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; transition: opacity .25s; }
  .device iframe.loading { opacity: 0; }
  .cmp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 16px; width: 100%; height: 100%; align-content: start; overflow: auto; }
  .cmp .cell { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .cmp .cell header { padding: 0; background: none; border: 0; justify-content: space-between; }
  .cmp .frame { position: relative; width: 100%; overflow: hidden; border-radius: 12px; box-shadow: 0 0 0 1px #2a2f3c, 0 20px 50px -24px #000; }
  .cmp .frame iframe { position: absolute; top: 0; left: 0; width: 1440px; height: 900px; border: 0; transform-origin: 0 0; }
  aside.info { width: 300px; flex-shrink: 0; border-left: 1px solid var(--line); background: var(--panel); padding: 16px; overflow: auto; transition: margin-right .35s cubic-bezier(.22,1,.36,1); }
  aside.info.hidden { margin-right: -300px; }
  aside h3 { margin: 0 0 4px; font-size: 15px; }
  aside p { color: var(--dim); line-height: 1.55; margin: 6px 0 12px; }
  aside ul { margin: 0 0 14px; padding-left: 18px; color: #c9cdd8; line-height: 1.6; }
  aside .k { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 700; margin: 14px 0 6px; }
  .sw { display: flex; gap: 6px; flex-wrap: wrap; }
  .sw span { width: 26px; height: 26px; border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .note { font-size: 11.5px; color: #c7b37a; background: rgba(245, 158, 11, .08); border: 1px dashed rgba(245, 158, 11, .35); padding: 8px 10px; border-radius: 10px; line-height: 1.5; }
  .size { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--dim); background: #151821; border: 1px solid var(--line); padding: 3px 10px; border-radius: 99px; }
  @media (max-width: 900px) { aside.info { display: none; } header { gap: 10px; } .tools { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <div class="logo"><i class="bi bi-palette2"></i><div><b>Design Preview Lab</b><small>LMS Admin & Teacher · 3 konsepsiya</small></div></div>
  <div class="grp"><span>Variant</span><div class="seg" id="c-v">
    <button data-v="a"><span class="tag tA">A</span>Blue Glass</button>
    <button data-v="b"><span class="tag tB">B</span>Aurora</button>
    <button data-v="c"><span class="tag tC">C</span>Obsidian</button></div></div>
  <div class="grp"><span>Rol</span><div class="seg" id="c-role"><button data-v="admin"><i class="bi bi-shield-lock"></i>Admin</button><button data-v="teacher"><i class="bi bi-person-workspace"></i>Teacher</button></div></div>
  <div class="grp"><span>Mavzu</span><div class="seg" id="c-theme"><button data-v="light" title="Light"><i class="bi bi-sun"></i>Light</button><button data-v="dark" title="Dark"><i class="bi bi-moon-stars"></i>Dark</button><button data-v="system" title="Tizim"><i class="bi bi-circle-half"></i></button></div></div>
  <div class="grp"><span>Qurilma</span><div class="seg" id="c-dev"><button data-v="desktop" title="1440×900"><i class="bi bi-display"></i>Desktop</button><button data-v="laptop" title="1280×800"><i class="bi bi-laptop"></i></button><button data-v="tablet" title="820×1180"><i class="bi bi-tablet"></i>Tablet</button><button data-v="mobile" title="390×844"><i class="bi bi-phone"></i>Mobile</button></div></div>
  <div class="grp"><span>Sahifa</span><select id="c-page" aria-label="Sahifa"></select></div>
  <div class="tools">
    <button class="btn pri" id="replay" title="Animatsiyani qayta ijro etiş (R)"><i class="bi bi-arrow-repeat"></i>Replay</button>
    <button class="btn" id="motion" aria-pressed="true" title="Animatsiyalar"><i class="bi bi-magic"></i>Motion</button>
    <button class="btn" id="cmp" aria-pressed="false" title="A/B/C ni yonma-yon"><i class="bi bi-layout-three-columns"></i>Taqqoslaş</button>
    <a class="btn" id="open" target="_blank" rel="noopener" title="Yangi oynada"><i class="bi bi-box-arrow-up-right"></i></a>
    <button class="btn" id="info-t" aria-pressed="true" title="Ma'lumot paneli"><i class="bi bi-info-circle"></i></button>
  </div>
</header>
<main>
  <div class="stage" id="stage"></div>
  <aside class="info" id="info"></aside>
</main>
<script>
(function () {
  'use strict';
  var DEV = { desktop: [1440, 900], laptop: [1280, 800], tablet: [820, 1180], mobile: [390, 844] };
  var PAGES = { admin: [['overview', 'Boşqaruv paneli'], ['students', 'Öquvçilar (içki)'], ['finance', 'Moliya (içki)']],
                teacher: [['overview', 'Bugun (overview)'], ['attendance', 'Davomat (içki)'], ['homeworks', 'Vazifalar (içki)']] };
  var INFO = {
    a: { t: 'A — Blue Glass', d: 'Reference videoga eng yaqin: navy→turquoise gradient, frosted glass sidebar va topbar, katta glass panel ičida och-kökimtir kartalar, qora pill tugmalar.',
         l: ['Sahifa almaşganda panel bösh qoladi, kartalar blur+fade bilan ketma-ket çiqadi (videodagidek)', 'Bar chart pastdan ösadi, oxirgi ustun ajratiladi', 'Raqamlar 0 dan count-up', 'Sidebar aktiv "pill" silliq siljiydi'],
         c: ['#0c2e48', '#167b92', '#22a2b0', '#4fd2ef', '#f1fafd', '#0b1b26'], f: 'Inter' },
    b: { t: 'B — Aurora Academy', d: 'Aurora fon, suzuvçi ikonkali rail (hover\'da oçiladi, layout sakramaydi), gradient border\'li qatlamli glass kartalar, aurora "hero" blok.',
         l: ['Hero kartada asosiy grafik va salomlaşuv', 'Kartada kursor ortidan yumşoq yorug\'lik', 'Sora display şrift, indigo/cyan/violet aksent', 'Teacher: "Hozir davom etmoqda" dars spotlight'],
         c: ['#4f46e5', '#7c3aed', '#06b6d4', '#c084fc', '#f5f6fd', '#070814'], f: 'Sora + Inter' },
    c: { t: 'C — Obsidian Minimal', d: 'Professional va zič: klassik sidebar (1px border), breadcrumb topbar, KPI strip, aniq jadvallar. Minimal gradient, tez (≤300ms) animatsiyalar.',
         l: ['KPI strip — bitta karta, böluvçi çiziqlar', 'Teacher: ikki ustun — çapda guruhlar, öngda bugungi jadval va navbat', 'Geist + Geist Mono raqamlar', 'Eng yengil: blur deyarli yöq'],
         c: ['#0a0c10', '#111419', '#1f6feb', '#58a6ff', '#f7f8fa', '#ffffff'], f: 'Geist + Geist Mono' }
  };
  var st = { v: 'a', role: 'admin', theme: 'light', dev: 'desktop', page: 'overview', cmp: false, motion: true, info: true };
  try { Object.assign(st, JSON.parse(localStorage.getItem('dp-lab') || '{}')); } catch (e) {}
  if (location.hash.length > 1) { new URLSearchParams(location.hash.slice(1)).forEach(function (v, k) { if (k in st) st[k] = v === 'true' ? true : v === 'false' ? false : v; }); }
  var stage = document.getElementById('stage'), frames = [];
  function save() { try { localStorage.setItem('dp-lab', JSON.stringify(st)); } catch (e) {} history.replaceState(null, '', '#v=' + st.v + '&role=' + st.role + '&theme=' + st.theme + '&dev=' + st.dev + '&page=' + st.page + (st.cmp ? '&cmp=true' : '')); }
  function src(v) { return 'frame.html?v=' + v + '&role=' + st.role + '&theme=' + st.theme + '&page=' + st.page + (st.motion ? '' : '&motion=off'); }
  function sync() {
    [['c-v', st.v], ['c-role', st.role], ['c-theme', st.theme], ['c-dev', st.dev]].forEach(function (x) {
      document.querySelectorAll('#' + x[0] + ' button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === x[1]); });
    });
    var sel = document.getElementById('c-page');
    sel.innerHTML = PAGES[st.role].map(function (p) { return '<option value="' + p[0] + '">' + p[1] + '</option>'; }).join('');
    if (!PAGES[st.role].some(function (p) { return p[0] === st.page; })) { var o = document.createElement('option'); o.value = st.page; o.textContent = st.page; sel.appendChild(o); }
    sel.value = st.page;
    document.getElementById('cmp').setAttribute('aria-pressed', st.cmp);
    document.getElementById('motion').setAttribute('aria-pressed', st.motion);
    document.getElementById('info-t').setAttribute('aria-pressed', st.info);
    document.getElementById('info').classList.toggle('hidden', !st.info || st.cmp);
    document.getElementById('open').href = src(st.v);
    var I = INFO[st.v];
    document.getElementById('info').innerHTML = '<h3>' + I.t + '</h3><p>' + I.d + '</p><div class="k">Motion</div><ul>' + I.l.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul><div class="k">Palitra</div><div class="sw">' + I.c.map(function (c) { return '<span style="background:' + c + '" title="' + c + '"></span>'; }).join('') + '</div><div class="k">Şrift</div><p style="margin:0 0 14px">' + I.f + '</p>' +
      '<div class="k">Tekşiriş uçun</div><ul><li>Sidebar elementlarini bosing</li><li>Ctrl+K — buyruq palitrasi</li><li>Bildirişnoma va avatar menyusi</li><li>Grafik ustiga kursor — tooltip</li><li>' + (st.role === 'admin' ? 'Öquvçilar: qidiruv, filtr, qator → profil drawer, "Öquvçi qöşiş" validatsiya' : 'Davomat: belgilaş → Saqlaş; Vazifalar: Tekşiriş → baholaş modal') + '</li><li>Sidebar collapse (A, C) / rail hover (B)</li></ul>' +
      '<div class="note"><b>DEMO ma\'lumot.</b> Barça raqamlar namunaviy — real bazaga bog\'lanmagan. Maydonlar real Django context kalitlariga mos.</div>';
  }
  function fit() {
    var dev = stage.querySelector('.device'); if (!dev) return fitCmp();
    var s = DEV[st.dev], pad = st.dev === 'desktop' || st.dev === 'laptop' ? 32 : 60;
    var k = Math.min(1, (stage.clientWidth - pad) / s[0], (stage.clientHeight - pad) / s[1]);
    dev.style.width = s[0] + 'px'; dev.style.height = s[1] + 'px'; dev.style.transform = 'scale(' + k + ')';
    var lbl = stage.querySelector('.size'); if (lbl) lbl.textContent = s[0] + ' × ' + s[1] + (k < 1 ? ' · ' + Math.round(k * 100) + '%' : '');
  }
  function fitCmp() {
    document.querySelectorAll('.cmp .frame').forEach(function (f) { var k = f.clientWidth / 1440; f.style.height = (900 * k) + 'px'; f.querySelector('iframe').style.transform = 'scale(' + k + ')'; });
  }
  function build() {
    frames = [];
    if (st.cmp) {
      stage.innerHTML = '<div class="cmp">' + ['a', 'b', 'c'].map(function (v) { return '<div class="cell"><header><b>' + INFO[v].t + '</b><button class="btn" data-pick="' + v + '">Ochiş</button></header><div class="frame"><iframe title="Variant ' + v.toUpperCase() + '" src="' + src(v) + '"></iframe></div></div>'; }).join('') + '</div>';
    } else {
      stage.innerHTML = '<div class="device ' + st.dev + '"><iframe class="loading" title="Variant ' + st.v.toUpperCase() + ' preview" src="' + src(st.v) + '"></iframe></div><span class="size"></span>';
    }
    frames = Array.prototype.slice.call(stage.querySelectorAll('iframe'));
    frames.forEach(function (f) { f.addEventListener('load', function () { f.classList.remove('loading'); }); });
    fit(); save(); sync();
  }
  function post(msg, except) { frames.forEach(function (f) { if (f.contentWindow && f.contentWindow !== except) f.contentWindow.postMessage(msg, '*'); }); }
  function bindSeg(id, key, rebuild) {
    document.getElementById(id).addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return; st[key] = b.dataset.v;
      if (key === 'role') st.page = 'overview';
      if (key === 'theme') { save(); sync(); post({ dp: 'setTheme', mode: st.theme }); return; }
      if (key === 'v' && st.cmp) st.cmp = false;
      if (key === 'dev' && !rebuild) { var d = stage.querySelector('.device'); if (d) { d.className = 'device ' + st.dev; fit(); save(); sync(); return; } }
      var f = stage.querySelector('iframe'); if (f && !st.cmp) { f.classList.add('loading'); setTimeout(build, 180); } else build();
    });
  }
  bindSeg('c-v', 'v'); bindSeg('c-role', 'role'); bindSeg('c-theme', 'theme'); bindSeg('c-dev', 'dev');
  document.getElementById('c-page').addEventListener('change', function () { st.page = this.value; save(); post({ dp: 'go', page: st.page }); });
  document.getElementById('replay').addEventListener('click', function () { post({ dp: 'replay' }); });
  document.getElementById('motion').addEventListener('click', function () { st.motion = !st.motion; save(); sync(); post({ dp: 'motion', on: st.motion }); });
  document.getElementById('cmp').addEventListener('click', function () { st.cmp = !st.cmp; build(); });
  document.getElementById('info-t').addEventListener('click', function () { st.info = !st.info; save(); sync(); setTimeout(fit, 380); });
  stage.addEventListener('click', function (e) { var p = e.target.closest('[data-pick]'); if (p) { st.v = p.dataset.pick; st.cmp = false; build(); } });
  addEventListener('message', function (e) {
    var m = e.data || {}; if (!m.dp) return;
    if (m.dp === 'theme') { st.theme = m.mode; save(); sync(); post({ dp: 'setTheme', mode: m.mode }, e.source); }
    if (m.dp === 'page' && !st.cmp) { st.page = m.page; save(); sync(); }
  });
  addEventListener('keydown', function (e) { if (e.target.tagName === 'SELECT') return; if (e.key === 'r' || e.key === 'R') post({ dp: 'replay' }); });
  addEventListener('resize', function () { fit(); });
  build();
})();
</script>
</body>
</html>
