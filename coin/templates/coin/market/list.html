{% extends 'accounts/base.html' %}
{% load static %}

{% block title %}Coin Market | LMS{% endblock %}

{% block extra_css %}
<style>
:root {
    --mk-card: #ffffff;
    --mk-card-hover: #f8fafc;
    --mk-border: rgba(0, 0, 0, 0.06);
    --mk-text: #1e293b;
    --mk-text-muted: #64748b;
    --mk-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    --mk-shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.16);
    --mk-radius: 16px;
    --mk-primary: #6366f1;
    --mk-coin: #f59e0b;
}

[data-bs-theme="dark"] {
    --mk-card: #1e1e1e;
    --mk-card-hover: #2a2a2a;
    --mk-border: rgba(255, 255, 255, 0.08);
    --mk-text: #f1f5f9;
    --mk-text-muted: #94a3b8;
    --mk-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    --mk-shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.6);
}

@keyframes mkFadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes mkShimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}

.mk-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1.5rem 1rem;
}

/* ===== Hero ===== */
.mk-hero {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
    border-radius: var(--mk-radius);
    padding: 2rem 2rem;
    color: white;
    margin-bottom: 1.5rem;
    position: relative;
    overflow: hidden;
    animation: mkFadeIn 0.5s ease;
}

.mk-hero::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
    pointer-events: none;
}

.mk-hero-inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
}

.mk-hero h1 {
    font-size: 1.75rem;
    font-weight: 800;
    margin: 0;
}

.mk-hero p {
    margin: 0.5rem 0 0;
    opacity: 0.9;
    font-size: 0.95rem;
}

.mk-coin-badge {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    padding: 0.65rem 1.25rem;
    border-radius: 30px;
    font-weight: 700;
    font-size: 1.1rem;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: white;
}

/* ===== Search ===== */
.mk-search-bar {
    background: var(--mk-card);
    border-radius: var(--mk-radius);
    padding: 1rem;
    margin-bottom: 1.5rem;
    box-shadow: var(--mk-shadow);
    animation: mkFadeIn 0.5s ease 0.1s both;
}

.mk-search-wrap {
    position: relative;
}

.mk-search-wrap i {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--mk-text-muted);
    font-size: 1rem;
}

.mk-search-input {
    width: 100%;
    height: 48px;
    padding: 0 1rem 0 3rem;
    border: 2px solid var(--mk-border);
    border-radius: 25px;
    background: var(--mk-card);
    color: var(--mk-text);
    font-size: 1rem;
    font-family: inherit;
    transition: all 0.3s;
}

.mk-search-input:focus {
    outline: none;
    border-color: var(--mk-primary);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
}

.mk-search-input::placeholder {
    color: var(--mk-text-muted);
}

/* ===== Product Grid ===== */
.mk-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    margin-bottom: 2rem;
}

@media (max-width: 991px) {
    .mk-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 575px) {
    .mk-grid { grid-template-columns: 1fr; }
    .mk-hero h1 { font-size: 1.35rem; }
    .mk-hero { padding: 1.5rem; }
}

/* ===== Product Card ===== */
.mk-product-card {
    background: var(--mk-card);
    border-radius: var(--mk-radius);
    overflow: hidden;
    box-shadow: var(--mk-shadow);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    animation: mkFadeIn 0.5s ease both;
    display: flex;
    flex-direction: column;
    position: relative;
}

.mk-product-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--mk-shadow-hover);
}

.mk-product-card.mk-out-of-stock-card {
    filter: grayscale(0.6);
    opacity: 0.75;
}

.mk-product-card.mk-out-of-stock-card:hover {
    transform: none;
    box-shadow: var(--mk-shadow);
}

.mk-card-img-wrap {
    position: relative;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: var(--mk-border);
}

.mk-card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
}

.mk-product-card:hover .mk-card-img-wrap img {
    transform: scale(1.05);
}

.mk-card-img-wrap .mk-no-img {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
}

.mk-card-img-wrap .mk-no-img i {
    font-size: 3rem;
    color: white;
    opacity: 0.5;
}

.mk-stock-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(16, 185, 129, 0.9);
    backdrop-filter: blur(6px);
    color: white;
    padding: 0.25rem 0.7rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    z-index: 2;
}

.mk-out-of-stock {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
}

.mk-out-of-stock span {
    background: #ef4444;
    color: white;
    padding: 0.5rem 1.25rem;
    border-radius: 25px;
    font-weight: 800;
    font-size: 0.9rem;
    letter-spacing: 0.5px;
}

/* Card Body */
.mk-card-body {
    padding: 1rem 1.15rem 1.15rem;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.mk-card-title {
    font-size: 1rem;
    font-weight: 700;
    margin: 0 0 0.35rem;
    color: var(--mk-text);
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.mk-card-desc {
    font-size: 0.84rem;
    color: var(--mk-text-muted);
    margin: 0 0 0.75rem;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
}

.mk-card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
}

.mk-price {
    font-weight: 800;
    font-size: 1.05rem;
    color: var(--mk-coin);
    display: flex;
    align-items: center;
    gap: 0.35rem;
}

.mk-price i {
    font-size: 1.1rem;
}

.mk-card-stats {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.8rem;
    color: var(--mk-text-muted);
    font-weight: 600;
}

.mk-card-stats span {
    display: flex;
    align-items: center;
    gap: 0.25rem;
}

.mk-card-stats i {
    font-size: 0.85rem;
}

/* Card Actions */
.mk-card-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.mk-like-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: 2px solid var(--mk-border);
    background: transparent;
    color: var(--mk-text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.25s;
    flex-shrink: 0;
    font-size: 1.05rem;
}

.mk-like-btn:hover {
    border-color: #ef4444;
    color: #ef4444;
    background: rgba(239, 68, 68, 0.06);
}

.mk-like-btn.liked {
    border-color: #ef4444;
    color: #ef4444;
    background: rgba(239, 68, 68, 0.08);
}

.mk-buy-btn {
    flex: 1;
    height: 40px;
    border-radius: 12px;
    background: var(--mk-primary);
    color: white;
    border: none;
    font-weight: 700;
    font-size: 0.88rem;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: all 0.3s;
}

.mk-buy-btn:hover {
    background: #4f46e5;
    color: white;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
}

.mk-buy-btn.disabled {
    background: var(--mk-border);
    color: var(--mk-text-muted);
    pointer-events: none;
}

/* ===== Skeleton ===== */
.mk-skeleton-card {
    background: var(--mk-card);
    border-radius: var(--mk-radius);
    overflow: hidden;
    box-shadow: var(--mk-shadow);
}

.mk-skeleton-img {
    aspect-ratio: 4 / 3;
    background: linear-gradient(90deg, var(--mk-border) 25%, rgba(99,102,241,0.06) 50%, var(--mk-border) 75%);
    background-size: 200% 100%;
    animation: mkShimmer 1.5s ease-in-out infinite;
}

.mk-skeleton-body {
    padding: 1rem 1.15rem 1.15rem;
}

.mk-skeleton-line {
    height: 14px;
    border-radius: 7px;
    background: linear-gradient(90deg, var(--mk-border) 25%, rgba(99,102,241,0.06) 50%, var(--mk-border) 75%);
    background-size: 200% 100%;
    animation: mkShimmer 1.5s ease-in-out infinite;
    margin-bottom: 0.6rem;
}

.mk-skeleton-line.w-60 { width: 60%; }
.mk-skeleton-line.w-80 { width: 80%; }
.mk-skeleton-line.w-40 { width: 40%; }
.mk-skeleton-line.h-20 { height: 20px; }
.mk-skeleton-line.h-36 { height: 36px; border-radius: 12px; }

/* ===== Pagination ===== */
.mk-pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 2rem;
}

.mk-pagination button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
    height: 40px;
    padding: 0 0.75rem;
    border-radius: 12px;
    font-weight: 600;
    font-size: 0.9rem;
    border: 2px solid var(--mk-border);
    background: var(--mk-card);
    color: var(--mk-text);
    cursor: pointer;
    transition: all 0.3s;
}

.mk-pagination button:hover:not(:disabled) {
    border-color: var(--mk-primary);
    color: var(--mk-primary);
    transform: translateY(-2px);
}

.mk-pagination button.active {
    background: var(--mk-primary);
    color: white;
    border-color: var(--mk-primary);
}

.mk-pagination button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.mk-page-info {
    color: var(--mk-text-muted);
    font-size: 0.85rem;
    font-weight: 600;
    margin: 0 0.25rem;
}

/* ===== Empty State ===== */
.mk-empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 4rem 1rem;
    animation: mkFadeIn 0.5s ease;
}

.mk-empty i {
    font-size: 4rem;
    color: var(--mk-text-muted);
    opacity: 0.4;
    margin-bottom: 1rem;
    display: block;
}

.mk-empty h4 {
    font-weight: 800;
    color: var(--mk-text);
    margin: 0 0 0.5rem;
}

.mk-empty p {
    color: var(--mk-text-muted);
    margin: 0;
}
</style>
{% endblock %}

{% block content %}
<div class="mk-container">

    <!-- Hero -->
    <div class="mk-hero">
        <div class="mk-hero-inner">
            <div>
                <h1>🛍 Coin Market</h1>
                <p>Coinlaringiz bilan ajoyib sovg'alar va bonuslarni qo'lga kiriting!</p>
            </div>
            <div class="mk-coin-badge" id="mkCoinBalance">
                <i class="bi bi-coin"></i>
                <span>---</span>
            </div>
        </div>
    </div>

    <!-- Search -->
    <div class="mk-search-bar">
        <div class="mk-search-wrap">
            <i class="bi bi-search"></i>
            <input type="text" id="mkSearchInput" class="mk-search-input" placeholder="Mahsulot qidirish..." autocomplete="off">
        </div>
    </div>

    <!-- Product Grid -->
    <div class="mk-grid" id="mkProductGrid">
        <!-- Skeleton placeholders -->
    </div>

    <!-- Pagination -->
    <div class="mk-pagination" id="mkPagination"></div>

</div>
{% endblock %}

{% block extra_js %}
<script>
(function() {
    const API_PRODUCTS = '/api/v1/coin/products/';
    const API_SUMMARY = '/api/v1/coin/summary/';
    const API_LIKE = '/api/v1/coin/products/{id}/like/';

    const grid = document.getElementById('mkProductGrid');
    const pagination = document.getElementById('mkPagination');
    const searchInput = document.getElementById('mkSearchInput');
    const coinBadge = document.getElementById('mkCoinBalance');

    let currentPage = 1;
    let currentSearch = '';
    let searchTimer = null;
    let totalPages = 1;

    // CSRF
    function getCookie(name) {
        let val = null;
        document.cookie.split(';').forEach(function(c) {
            c = c.trim();
            if (c.startsWith(name + '=')) val = decodeURIComponent(c.substring(name.length + 1));
        });
        return val;
    }

    // Skeleton
    function showSkeleton() {
        let html = '';
        for (let i = 0; i < 6; i++) {
            html += `
            <div class="mk-skeleton-card">
                <div class="mk-skeleton-img"></div>
                <div class="mk-skeleton-body">
                    <div class="mk-skeleton-line w-80 h-20"></div>
                    <div class="mk-skeleton-line w-60"></div>
                    <div class="mk-skeleton-line w-40"></div>
                    <div style="margin-top:0.75rem;" class="mk-skeleton-line h-36"></div>
                </div>
            </div>`;
        }
        grid.innerHTML = html;
        pagination.innerHTML = '';
    }

    // Fetch summary
    function fetchSummary() {
        fetch(API_SUMMARY, { credentials: 'same-origin' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                coinBadge.innerHTML = '<i class="bi bi-coin"></i><span>' + (data.total_coins || 0) + ' coin</span>';
            })
            .catch(function() {});
    }

    // Fetch products
    function fetchProducts(page, search) {
        showSkeleton();
        let url = API_PRODUCTS + '?page=' + page;
        if (search) url += '&search=' + encodeURIComponent(search);

        fetch(url, { credentials: 'same-origin' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                renderProducts(data.results || []);
                renderPagination(data.count, data.next, data.previous, page);
            })
            .catch(function() {
                grid.innerHTML = '<div class="mk-empty"><i class="bi bi-exclamation-triangle"></i><h4>Xatolik yuz berdi</h4><p>Ma\'lumotlarni yuklab bo\'lmadi</p></div>';
                pagination.innerHTML = '';
            });
    }

    // Render products
    function renderProducts(products) {
        if (!products.length) {
            grid.innerHTML = '<div class="mk-empty"><i class="bi bi-box-seam"></i><h4>Mahsulotlar topilmadi</h4><p>Tez orada yangi mahsulotlar qo\'shiladi</p></div>';
            return;
        }

        let html = '';
        products.forEach(function(p, idx) {
            var outOfStock = p.stock === 0;
            var imgHtml = p.image
                ? '<img src="' + p.image + '" alt="' + escapeHtml(p.name) + '">'
                : '<div class="mk-no-img"><i class="bi bi-box-seam"></i></div>';

            var stockHtml = '';
            if (outOfStock) {
                stockHtml = '<div class="mk-out-of-stock"><span>Tugagan</span></div>';
            } else {
                stockHtml = '<div class="mk-stock-badge">Omborda: ' + p.stock + ' ta</div>';
            }

            var desc = p.description || '';
            if (desc.length > 80) desc = desc.substring(0, 80) + '...';

            var likeIcon = p.is_liked ? 'bi-heart-fill' : 'bi-heart';
            var likeClass = p.is_liked ? ' liked' : '';

            var btnHtml = outOfStock
                ? '<span class="mk-buy-btn disabled">Tugagan</span>'
                : '<a href="/market/' + p.id + '/" class="mk-buy-btn">Batafsil</a>';

            html += '<div class="mk-product-card' + (outOfStock ? ' mk-out-of-stock-card' : '') + '" style="animation-delay:' + (idx * 80) + 'ms">'
                + '<div class="mk-card-img-wrap">' + imgHtml + stockHtml + '</div>'
                + '<div class="mk-card-body">'
                +   '<h3 class="mk-card-title">' + escapeHtml(p.name) + '</h3>'
                +   '<p class="mk-card-desc">' + escapeHtml(desc) + '</p>'
                +   '<div class="mk-card-footer">'
                +     '<div class="mk-price"><i class="bi bi-coin"></i> ' + p.coin_price + '</div>'
                +     '<div class="mk-card-stats">'
                +       '<span><i class="bi bi-heart-fill"></i> <span id="mkLikeCount' + p.id + '">' + (p.likes_count || 0) + '</span></span>'
                +       '<span><i class="bi bi-chat-fill"></i> ' + (p.comments_count || 0) + '</span>'
                +     '</div>'
                +   '</div>'
                +   '<div class="mk-card-actions">'
                +     '<button class="mk-like-btn' + likeClass + '" id="mkLikeBtn' + p.id + '" onclick="toggleLike(' + p.id + ')">'
                +       '<i class="bi ' + likeIcon + '"></i>'
                +     '</button>'
                +     btnHtml
                +   '</div>'
                + '</div></div>';
        });

        grid.innerHTML = html;
    }

    // Render pagination
    function renderPagination(count, next, previous, page) {
        var perPage = 12;
        totalPages = Math.ceil(count / perPage) || 1;
        if (totalPages <= 1) { pagination.innerHTML = ''; return; }

        var html = '';
        html += '<button onclick="goToPage(1)" ' + (page <= 1 ? 'disabled' : '') + '><i class="bi bi-chevron-double-left"></i></button>';
        html += '<button onclick="goToPage(' + (page - 1) + ')" ' + (page <= 1 ? 'disabled' : '') + '><i class="bi bi-chevron-left"></i></button>';

        var start = Math.max(1, page - 2);
        var end = Math.min(totalPages, page + 2);
        for (var i = start; i <= end; i++) {
            html += '<button onclick="goToPage(' + i + ')" class="' + (i === page ? 'active' : '') + '">' + i + '</button>';
        }

        html += '<span class="mk-page-info">' + page + ' / ' + totalPages + '</span>';
        html += '<button onclick="goToPage(' + (page + 1) + ')" ' + (page >= totalPages ? 'disabled' : '') + '><i class="bi bi-chevron-right"></i></button>';
        html += '<button onclick="goToPage(' + totalPages + ')" ' + (page >= totalPages ? 'disabled' : '') + '><i class="bi bi-chevron-double-right"></i></button>';

        pagination.innerHTML = html;
    }

    // Navigate page
    window.goToPage = function(page) {
        if (page < 1 || page > totalPages) return;
        currentPage = page;
        fetchProducts(currentPage, currentSearch);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // Toggle like (optimistic)
    window.toggleLike = function(id) {
        var btn = document.getElementById('mkLikeBtn' + id);
        var countEl = document.getElementById('mkLikeCount' + id);
        if (!btn || !countEl) return;

        var isLiked = btn.classList.contains('liked');
        var curCount = parseInt(countEl.textContent) || 0;

        // Optimistic update
        if (isLiked) {
            btn.classList.remove('liked');
            btn.innerHTML = '<i class="bi bi-heart"></i>';
            countEl.textContent = Math.max(0, curCount - 1);
        } else {
            btn.classList.add('liked');
            btn.innerHTML = '<i class="bi bi-heart-fill"></i>';
            countEl.textContent = curCount + 1;
        }

        var url = API_LIKE.replace('{id}', id);
        fetch(url, {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'X-CSRFToken': getCookie('csrftoken'),
                'Content-Type': 'application/json'
            }
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            // Sync with server
            if (data.liked) {
                btn.classList.add('liked');
                btn.innerHTML = '<i class="bi bi-heart-fill"></i>';
            } else {
                btn.classList.remove('liked');
                btn.innerHTML = '<i class="bi bi-heart"></i>';
            }
            countEl.textContent = data.likes_count;
        })
        .catch(function() {
            // Revert on error
            if (isLiked) {
                btn.classList.add('liked');
                btn.innerHTML = '<i class="bi bi-heart-fill"></i>';
                countEl.textContent = curCount;
            } else {
                btn.classList.remove('liked');
                btn.innerHTML = '<i class="bi bi-heart"></i>';
                countEl.textContent = curCount;
            }
        });
    };

    // Debounced search
    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimer);
        var val = this.value.trim();
        searchTimer = setTimeout(function() {
            currentSearch = val;
            currentPage = 1;
            fetchProducts(currentPage, currentSearch);
        }, 300);
    });

    // Escape HTML
    function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }

    // Init
    fetchSummary();
    fetchProducts(currentPage, currentSearch);
})();
</script>
{% endblock %}
