{% extends 'accounts/base.html' %}

{% block title %}Mahsulot | LMS{% endblock %}

{% block extra_css %}
{% include 'coin/market/_market_ui.html' %}
<style>
/* ============ MAHSULOT SAHIFASI — fokus uslub ============ */
.dt-main { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.25rem; animation: mktFadeUp 0.5s ease; }

.dt-img-wrap {
    border-radius: var(--mkt-radius);
    overflow: hidden;
    background: var(--mkt-card);
    border: 1px solid var(--mkt-border);
    box-shadow: var(--mkt-shadow);
}
.dt-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }

.dt-info {
    display: flex; flex-direction: column; gap: 1rem;
    background: var(--mkt-card);
    border: 1px solid var(--mkt-border);
    border-radius: var(--mkt-radius);
    box-shadow: var(--mkt-shadow);
    padding: 1.5rem 1.6rem;
}
.dt-title { font-size: 1.45rem; font-weight: 800; color: var(--mkt-text); margin: 0; }
.dt-desc { font-size: 0.9rem; color: var(--mkt-dim); line-height: 1.65; margin: 0; }

.dt-meta { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.dt-badge {
    display: inline-flex; align-items: center; gap: 0.35rem;
    padding: 0.45rem 0.95rem; border-radius: var(--mkt-radius-sm);
    font-weight: 700; font-size: 0.86rem;
    font-variant-numeric: tabular-nums;
}
.dt-badge.price { background: var(--mkt-gold-soft); color: var(--mkt-gold-dark); font-family: var(--mkt-mono); }
.dt-badge.price del { opacity: .55; font-size: .76rem; }
.dt-badge.price .dt-discounted-price { color: #059669; }
.dt-badge.price .dt-discount-label { font-family: inherit; font-size: .65rem; font-weight: 800; color: #047857; }
.dt-badge.stock { background: var(--mkt-ok-soft); color: #059669; }
.dt-badge.out { background: var(--mkt-bad-soft); color: #dc2626; }
.dt-badge.balance { background: var(--mkt-info-soft); color: var(--mkt-info); font-family: var(--mkt-mono); }
[data-bs-theme="dark"] .dt-badge.stock { color: #34d399; }
[data-bs-theme="dark"] .dt-badge.out { color: #f87171; }

.dt-stats { display: flex; gap: 1.15rem; flex-wrap: wrap; }
.dt-stat { display: flex; align-items: center; gap: 0.35rem; font-size: 0.86rem; color: var(--mkt-dim); font-weight: 600; }

.dt-actions { display: flex; gap: 0.6rem; margin-top: auto; }
.dt-like-btn {
    width: 48px; height: 48px;
    border: 1px solid var(--mkt-border); border-radius: 13px; background: transparent;
    display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--mkt-dim);
    cursor: pointer; transition: all 0.2s;
}
.dt-like-btn.liked { color: var(--mkt-bad); border-color: rgba(239, 68, 68, 0.35); background: var(--mkt-bad-soft); }
.dt-like-btn:hover { transform: scale(1.06); border-color: var(--mkt-bad); color: var(--mkt-bad); }
.dt-purchase-btn {
    flex: 1; height: 48px; border: none; border-radius: 13px; font-weight: 700; font-size: 0.95rem;
    background: linear-gradient(135deg, #10b981, #059669); color: #fff;
    cursor: pointer; transition: all 0.25s; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
}
.dt-purchase-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(16, 185, 129, 0.3); }
.dt-purchase-btn:disabled { background: var(--mkt-border); color: var(--mkt-dim); cursor: not-allowed; transform: none; box-shadow: none; }

/* Izohlar */
.dt-comments {
    background: var(--mkt-card);
    border: 1px solid var(--mkt-border);
    border-radius: var(--mkt-radius);
    box-shadow: var(--mkt-shadow);
    padding: 1.5rem 1.6rem;
    animation: mktFadeUp 0.5s ease 0.15s both;
}
.dt-comments-title { font-size: 1.05rem; font-weight: 750; color: var(--mkt-text); margin: 0 0 1rem; display: flex; align-items: center; gap: 0.5rem; }
.dt-comment-form { display: flex; gap: 0.5rem; margin-bottom: 1.2rem; }
.dt-comment-input {
    flex: 1; padding: 0.7rem 1rem;
    border: 1px solid var(--mkt-border); border-radius: 12px;
    background: transparent; color: var(--mkt-text);
    font-size: 0.88rem; resize: none; min-height: 44px; font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.dt-comment-input:focus { outline: none; border-color: var(--mkt-accent); box-shadow: 0 0 0 4px var(--mkt-accent-soft); }
.dt-comment-submit {
    height: 44px; padding: 0 1.25rem; border: none; border-radius: 12px;
    background: var(--mkt-accent); color: #fff;
    font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.dt-comment-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3); }

.dt-comment-list { display: flex; flex-direction: column; gap: 0.6rem; }
.dt-comment { display: flex; gap: 0.75rem; padding: 0.8rem; background: var(--mkt-accent-soft); border-radius: 14px; }
.dt-comment-avatar {
    width: 36px; height: 36px; min-width: 36px; border-radius: 10px;
    background: var(--mkt-accent); color: #fff;
    font-weight: 700; font-size: 0.8rem;
    display: flex; align-items: center; justify-content: center;
}
.dt-comment-body { flex: 1; min-width: 0; }
.dt-comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.2rem; gap: 0.5rem; }
.dt-comment-name { font-weight: 700; font-size: 0.85rem; color: var(--mkt-text); }
.dt-comment-date { font-size: 0.72rem; color: var(--mkt-dim); white-space: nowrap; }
.dt-comment-text { font-size: 0.85rem; color: var(--mkt-dim); margin: 0; line-height: 1.5; }

.dt-skeleton { background: linear-gradient(90deg, var(--mkt-border) 25%, var(--mkt-card) 50%, var(--mkt-border) 75%); background-size: 200% 100%; animation: mktShimmer 1.5s infinite; border-radius: 14px; }

/* Toast (JS dt-toast klassini işlatadi) */
.dt-toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    padding: 0.75rem 1.4rem; border-radius: 99px;
    font-weight: 700; font-size: 0.88rem; z-index: 99999;
    animation: mktPillIn 0.35s ease-out;
    display: flex; align-items: center; gap: 0.5rem;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18); color: #fff;
}
.dt-toast.success { background: var(--mkt-ok); }
.dt-toast.error { background: var(--mkt-bad); }

/* Modal (JS klasslari saqlangan) */
.dt-modal-overlay {
    position: fixed; inset: 0; background: rgba(10, 12, 22, 0.6); backdrop-filter: blur(8px);
    z-index: 9998; display: none; align-items: center; justify-content: center; padding: 1rem;
}
.dt-modal-overlay.show { display: flex; }
.dt-modal {
    background: var(--mkt-card); border: 1px solid var(--mkt-border);
    border-radius: 22px; padding: 1.8rem 1.9rem; max-width: 420px; width: 100%;
    animation: mktPop 0.35s ease-out; box-shadow: var(--mkt-shadow-lg);
}
.dt-modal h3 { font-size: 1.15rem; font-weight: 800; color: var(--mkt-text); margin: 0 0 1rem; }
.dt-modal-info { background: var(--mkt-accent-soft); border-radius: 14px; padding: 0.9rem 1.1rem; margin-bottom: 1.1rem; font-size: 0.88rem; color: var(--mkt-text); }
.dt-modal-info div { display: flex; justify-content: space-between; padding: 0.28rem 0; }
.dt-modal-info .dt-modal-total { font-weight: 800; border-top: 1px solid var(--mkt-border); margin-top: 0.4rem; padding-top: 0.55rem; }
.dt-modal-actions { display: flex; gap: 0.6rem; }
.dt-modal-actions button {
    flex: 1; height: 44px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s;
    display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
}
.dt-modal-cancel { background: transparent; color: var(--mkt-dim); border: 1px solid var(--mkt-border) !important; }
.dt-modal-cancel:hover { color: var(--mkt-accent); border-color: var(--mkt-accent) !important; }
.dt-modal-confirm { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
.dt-modal-confirm:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3); }

@media (max-width: 768px) {
    .dt-main { grid-template-columns: 1fr; }
    .dt-title { font-size: 1.25rem; }
    .dt-info { padding: 1.15rem 1rem; }
}
</style>
{% endblock %}

{% block content %}
<div class="mkt-wrap-narrow dash learning-glass market-glass">
    <div class="dash-aurora" aria-hidden="true"><i></i><i></i><i></i></div>
    <div style="margin-bottom: 1.1rem;">
        <a href="/market/" class="mkt-back"><i class="bi bi-arrow-left"></i> Market</a>
    </div>

    <div class="dt-main">
        <div class="dt-img-wrap" id="dtImageWrap">
            <div class="dt-skeleton" style="aspect-ratio:4/3;width:100%"></div>
        </div>
        <div class="dt-info" id="dtInfo">
            <div class="dt-skeleton" style="height:32px;width:70%"></div>
            <div class="dt-skeleton" style="height:60px;width:100%"></div>
            <div class="dt-skeleton" style="height:40px;width:50%"></div>
        </div>
    </div>

    <div class="dt-comments" id="dtComments">
        <div class="dt-skeleton" style="height:200px;width:100%"></div>
    </div>
</div>

<div class="dt-modal-overlay" id="purchaseModal">
    <div class="dt-modal">
        <h3><i class="bi bi-cart-check"></i> Xaridni tasdiqlaş</h3>
        <div class="dt-modal-info" id="modalInfo"></div>
        <div class="dt-modal-actions">
            <button class="dt-modal-cancel" onclick="closeModal()">Bekor qiliş</button>
            <button class="dt-modal-confirm" id="confirmBtn" onclick="confirmPurchase()"><i class="bi bi-check-lg"></i> Sotib oliş</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function(){
    const PID = {{ product_id }};
    const API = '/api/v1/coin';
    let product = null, userCoins = 0, commentPage = 1;

    function getCsrf() { let v='; '+document.cookie,p=v.split('; csrftoken='); if(p.length===2) return p.pop().split(';').shift(); }
    async function get(u) { const r=await fetch(u,{credentials:'same-origin'}); if(!r.ok) throw new Error(r.statusText); return r.json(); }
    async function post(u,b) {
        const r=await fetch(u,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':getCsrf()},body:JSON.stringify(b||{})});
        const d=await r.json(); if(!r.ok) throw d; return d;
    }

    function fmtDate(iso) { return new Date(iso).toLocaleDateString('uz-UZ',{day:'2-digit',month:'2-digit',year:'numeric'}); }
    function fmtTime(iso) { return new Date(iso).toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit',hour12:false}); }

    // Izoh matni va ismlar boşqa foydalanuvçi kiritgan ma'lumot — `innerHTML`
    // ga qöyişdan oldin escape qilinadi (stored XSS).
    function esc(s) {
        return (s == null ? '' : String(s)).replace(/[&<>"']/g, function(c) {
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
    }

    function toast(msg, type) {
        const t=document.createElement('div'); t.className='dt-toast '+type; t.innerHTML='<i class="bi bi-'+(type==='success'?'check-circle':'x-circle')+'"></i> '+esc(msg);
        document.body.appendChild(t); setTimeout(()=>t.remove(),3000);
    }

    async function loadProduct() {
        try {
            const [p,s] = await Promise.all([get(API+'/products/'+PID+'/'), get(API+'/summary/')]);
            product = p; userCoins = s.total_coins;

            document.getElementById('dtImageWrap').innerHTML = `<img class="dt-img" src="${esc(p.image)}" alt="${esc(p.name)}">`;

            const outOfStock = p.stock<=0;
            const payPrice = p.discounted_price;
            const canAfford = userCoins >= payPrice;
            const priceMarkup = p.has_discount
                ? `<del>${esc(p.coin_price)}</del> <strong class="dt-discounted-price">${esc(payPrice)}</strong> <small class="dt-discount-label">−${esc(p.discount_percent)}% Premium</small> coin`
                : `${esc(p.coin_price)} coin`;
            document.getElementById('dtInfo').innerHTML = `
                <h1 class="dt-title">${esc(p.name)}</h1>
                <p class="dt-desc">${esc(p.description||'')}</p>
                <div class="dt-meta">
                    <span class="dt-badge price"><i class="bi bi-coin"></i> ${priceMarkup}</span>
                    <span class="dt-badge ${outOfStock?'out':'stock'}"><i class="bi bi-${outOfStock?'x-circle':'box-seam'}"></i> ${outOfStock?'Tugagan':'Omborda: '+esc(p.stock)+' ta'}</span>
                    <span class="dt-badge balance"><i class="bi bi-wallet2"></i> Balans: ${esc(userCoins)}</span>
                </div>
                <div class="dt-stats">
                    <span class="dt-stat" id="dtLikeCount"><i class="bi bi-heart-fill" style="color:${p.is_liked?'#ef4444':''}"></i> ${esc(p.likes_count)} ta like</span>
                    <span class="dt-stat"><i class="bi bi-chat-fill"></i> ${esc(p.comments_count)} ta izoh</span>
                </div>
                <div class="dt-actions">
                    <button class="dt-like-btn ${p.is_liked?'liked':''}" id="dtLikeBtn" onclick="toggleLike()">
                        <i class="bi ${p.is_liked?'bi-heart-fill':'bi-heart'}"></i>
                    </button>
                    <button class="dt-purchase-btn" id="dtBuyBtn" ${outOfStock||!canAfford?'disabled':''} onclick="openModal()">
                        <i class="bi bi-cart-plus"></i> ${outOfStock?'Tugagan':!canAfford?'Coin yetarli emas':'Sotib oliş'}
                    </button>
                </div>`;
        } catch(e) {
            document.getElementById('dtInfo').innerHTML = '<p style="color:var(--mkt-dim)">Mahsulot topilmadi</p>';
        }
    }

    async function loadComments(pg) {
        commentPage = pg||1;
        try {
            const d = await get(API+'/products/'+PID+'/comments/?page='+commentPage);
            const totalPages = Math.ceil(d.count/20);
            let h = `<h3 class="dt-comments-title"><i class="bi bi-chat-dots"></i> Izohlar (${d.count})</h3>
                <div class="dt-comment-form">
                    <textarea class="dt-comment-input" id="commentInput" placeholder="Izoh yozing..." rows="1"></textarea>
                    <button class="dt-comment-submit" onclick="addComment()"><i class="bi bi-send"></i> Yuboriş</button>
                </div>
                <div class="dt-comment-list" id="commentList">`;
            if(!d.results.length) { h+='<p style="color:var(--mkt-dim);text-align:center;padding:1rem;">Hali izohlar yöq</p>'; }
            else {
                h += d.results.map(c => `<div class="dt-comment">
                    <div class="dt-comment-avatar">${esc((c.full_name||c.username||'?')[0].toUpperCase())}</div>
                    <div class="dt-comment-body">
                        <div class="dt-comment-header">
                            <span class="dt-comment-name">${esc(c.full_name||c.username)}</span>
                            <span class="dt-comment-date">${esc(fmtDate(c.created_at))} ${esc(fmtTime(c.created_at))}</span>
                        </div>
                        <p class="dt-comment-text">${esc(c.content)}</p>
                    </div>
                </div>`).join('');
            }
            h += '</div>';
            if(totalPages>1) {
                h += '<div class="mkt-pagination" style="margin-top:1rem">';
                for(let n=1;n<=totalPages;n++) {
                    h += n===commentPage ? `<span class="mkt-pg-active">${n}</span>` : `<a onclick="loadCommentPage(${n})">${n}</a>`;
                }
                h += '</div>';
            }
            document.getElementById('dtComments').innerHTML = h;
        } catch(e) {
            document.getElementById('dtComments').innerHTML = '<p style="color:var(--mkt-dim)">Izohlarni yuklab bölmadi</p>';
        }
    }

    window.loadCommentPage = function(p) { loadComments(p); };

    window.toggleLike = async function() {
        try {
            const d = await post(API+'/products/'+PID+'/like/');
            const btn = document.getElementById('dtLikeBtn');
            const icon = btn.querySelector('i');
            if(d.liked) { btn.classList.add('liked'); icon.className='bi bi-heart-fill'; }
            else { btn.classList.remove('liked'); icon.className='bi bi-heart'; }
            document.getElementById('dtLikeCount').innerHTML = `<i class="bi bi-heart-fill" style="color:${d.liked?'#ef4444':''}"></i> ${esc(d.likes_count)} ta like`;
            const s = await get(API+'/summary/');
            userCoins = s.total_coins;
        } catch(e) { toast('Xatolik yuz berdi','error'); }
    };

    window.openModal = function() {
        if(!product) return;
        document.getElementById('modalInfo').innerHTML = `
            <div><span>Mahsulot:</span><span><b>${esc(product.name)}</b></span></div>
            <div><span>Narxi:</span><span><b>${esc(product.discounted_price)} coin</b>${product.has_discount?` <del style="opacity:.55">${esc(product.coin_price)}</del> <small class="text-success">−${esc(product.discount_percent)}% Premium</small>`:''}</span></div>
            <div><span>Balansingiz:</span><span>${esc(userCoins)} coin</span></div>
            <div class="dt-modal-total"><span>Qoldiq:</span><span>${esc(userCoins-product.discounted_price)} coin</span></div>`;
        document.getElementById('purchaseModal').classList.add('show');
    };
    window.closeModal = function() { document.getElementById('purchaseModal').classList.remove('show'); };

    window.confirmPurchase = async function() {
        const btn = document.getElementById('confirmBtn');
        btn.disabled = true; btn.textContent = 'Kutiling...';
        try {
            await post(API+'/products/'+PID+'/purchase/');
            closeModal();
            toast("Muvaffaqiyatli sotib olindi! ✅",'success');
            loadProduct();
        } catch(e) {
            toast(e.error||'Xatolik yuz berdi','error');
        } finally { btn.disabled=false; btn.innerHTML='<i class="bi bi-check-lg"></i> Sotib oliş'; }
    };

    window.addComment = async function() {
        const input = document.getElementById('commentInput');
        const content = input.value.trim();
        if(!content) return;
        try {
            await post(API+'/products/'+PID+'/comments/add/', {content});
            input.value = '';
            toast("Izoh qöşildi",'success');
            loadComments(1);
        } catch(e) {
            toast(e.error||'Xatolik yuz berdi','error');
        }
    };

    loadProduct();
    loadComments(1);
})();
</script>
{% endblock %}
