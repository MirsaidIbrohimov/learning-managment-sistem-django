{% extends 'accounts/base.html' %}

{% block title %}Mahsulot | LMS{% endblock %}

{% block extra_css %}
<style>
@keyframes dtFadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
@keyframes dtPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
@keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }

.dt-container { max-width:1000px; margin:0 auto; padding:1.5rem 1rem 3rem; }

.dt-back { display:inline-flex; align-items:center; gap:0.4rem; color:var(--text-muted); font-weight:600; font-size:0.9rem; text-decoration:none; margin-bottom:1.25rem; transition:color 0.2s; }
.dt-back:hover { color:var(--primary); }

.dt-main { display:grid; grid-template-columns:1fr 1fr; gap:2rem; margin-bottom:2rem; animation:dtFadeUp 0.5s ease; }

.dt-img-wrap { border-radius:20px; overflow:hidden; background:var(--card); border:1px solid var(--border); }
.dt-img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; }

.dt-info { display:flex; flex-direction:column; gap:1rem; }
.dt-title { font-size:1.6rem; font-weight:800; color:var(--text); margin:0; }
.dt-desc { font-size:0.92rem; color:var(--text-muted); line-height:1.65; margin:0; }

.dt-meta { display:flex; flex-wrap:wrap; gap:0.75rem; }
.dt-badge { display:inline-flex; align-items:center; gap:0.35rem; padding:0.5rem 1rem; border-radius:12px; font-weight:700; font-size:0.88rem; }
.dt-badge.price { background:rgba(245,158,11,0.1); color:#f59e0b; }
.dt-badge.stock { background:rgba(16,185,129,0.1); color:#10b981; }
.dt-badge.out { background:rgba(239,68,68,0.1); color:#ef4444; }
.dt-badge.balance { background:rgba(59,130,246,0.1); color:#3b82f6; }

.dt-stats { display:flex; gap:1.25rem; }
.dt-stat { display:flex; align-items:center; gap:0.35rem; font-size:0.9rem; color:var(--text-muted); }

.dt-actions { display:flex; gap:0.75rem; margin-top:auto; }
.dt-like-btn {
    width:50px; height:50px; border:2px solid var(--border); border-radius:14px; background:var(--bg);
    display:flex; align-items:center; justify-content:center; font-size:1.3rem; color:var(--text-muted);
    cursor:pointer; transition:all 0.2s;
}
.dt-like-btn.liked { color:#ef4444; border-color:rgba(239,68,68,0.3); background:rgba(239,68,68,0.05); }
.dt-like-btn:hover i { animation:dtPulse 0.4s ease; }
.dt-purchase-btn {
    flex:1; height:50px; border:none; border-radius:14px; font-weight:700; font-size:1rem;
    background:linear-gradient(135deg,#10b981,#059669); color:#fff;
    cursor:pointer; transition:all 0.2s; display:flex; align-items:center; justify-content:center; gap:0.5rem;
}
.dt-purchase-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(16,185,129,0.3); }
.dt-purchase-btn:disabled { background:var(--border); color:var(--text-muted); cursor:not-allowed; transform:none; box-shadow:none; }

/* Comments */
.dt-comments { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:1.5rem; animation:dtFadeUp 0.5s ease 0.2s both; }
.dt-comments-title { font-size:1.15rem; font-weight:700; margin:0 0 1rem; display:flex; align-items:center; gap:0.5rem; }
.dt-comment-form { display:flex; gap:0.5rem; margin-bottom:1.25rem; }
.dt-comment-input { flex:1; padding:0.75rem 1rem; border:2px solid var(--border); border-radius:12px; background:var(--bg); color:var(--text); font-size:0.88rem; resize:none; min-height:44px; font-family:inherit; }
.dt-comment-input:focus { outline:none; border-color:var(--primary); }
.dt-comment-submit { height:44px; padding:0 1.25rem; border:none; border-radius:12px; background:linear-gradient(135deg,#6366f1,#4f46e5); color:#fff; font-weight:700; font-size:0.85rem; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
.dt-comment-submit:hover { transform:translateY(-1px); }

.dt-comment-list { display:flex; flex-direction:column; gap:0.75rem; }
.dt-comment { display:flex; gap:0.75rem; padding:0.75rem; background:var(--bg); border-radius:14px; }
.dt-comment-avatar { width:36px; height:36px; min-width:36px; border-radius:10px; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; font-weight:700; font-size:0.8rem; display:flex; align-items:center; justify-content:center; }
.dt-comment-body { flex:1; min-width:0; }
.dt-comment-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.2rem; }
.dt-comment-name { font-weight:700; font-size:0.85rem; color:var(--text); }
.dt-comment-date { font-size:0.72rem; color:var(--text-muted); }
.dt-comment-text { font-size:0.85rem; color:var(--text-muted); margin:0; line-height:1.5; }

.dt-skeleton { background:linear-gradient(90deg,var(--border) 25%,var(--card) 50%,var(--border) 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:14px; }

.dt-toast { position:fixed; top:20px; right:20px; padding:0.85rem 1.5rem; border-radius:14px; font-weight:600; font-size:0.9rem; z-index:9999; animation:dtFadeUp 0.3s ease; display:flex; align-items:center; gap:0.5rem; }
.dt-toast.success { background:#10b981; color:#fff; }
.dt-toast.error { background:#ef4444; color:#fff; }

/* Modal */
.dt-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:9998; display:none; align-items:center; justify-content:center; }
.dt-modal-overlay.show { display:flex; }
.dt-modal { background:var(--card); border-radius:20px; padding:2rem; max-width:420px; width:90%; animation:dtFadeUp 0.3s ease; }
.dt-modal h3 { font-size:1.2rem; font-weight:700; margin:0 0 1rem; }
.dt-modal-info { background:var(--bg); border-radius:12px; padding:1rem; margin-bottom:1.25rem; font-size:0.9rem; }
.dt-modal-info div { display:flex; justify-content:space-between; padding:0.25rem 0; }
.dt-modal-info .dt-modal-total { font-weight:700; border-top:1px solid var(--border); margin-top:0.5rem; padding-top:0.5rem; }
.dt-modal-actions { display:flex; gap:0.5rem; }
.dt-modal-actions button { flex:1; height:44px; border:none; border-radius:12px; font-weight:700; cursor:pointer; transition:all 0.2s; }
.dt-modal-cancel { background:var(--bg); color:var(--text-muted); border:2px solid var(--border)!important; }
.dt-modal-confirm { background:linear-gradient(135deg,#10b981,#059669); color:#fff; }

@media(max-width:768px) {
    .dt-main { grid-template-columns:1fr; }
    .dt-title { font-size:1.3rem; }
}
</style>
{% endblock %}

{% block content %}
<div class="dt-container">
    <a href="/market/" class="dt-back"><i class="bi bi-arrow-left"></i> Market</a>

    <div class="dt-main">
        <div class="dt-img-wrap" id="dtImageWrap">
            <div class="dt-skeleton" style="aspect-ratio:4/3;width:100%"></div>
        </div>
        <div class="dt-info" id="dtInfo">
            <div class="dt-skeleton" style="height:32px;width:70%"></div>
            <div class="dt-skeleton" style="height:60px;width:100%"></div>
            <div class="dt-skeleton" style="height:40px;width:50%"></div>
        </div>
    </div>

    <div class="dt-comments" id="dtComments">
        <div class="dt-skeleton" style="height:200px;width:100%"></div>
    </div>
</div>

<div class="dt-modal-overlay" id="purchaseModal">
    <div class="dt-modal">
        <h3><i class="bi bi-cart-check"></i> Xaridni tasdiqlash</h3>
        <div class="dt-modal-info" id="modalInfo"></div>
        <div class="dt-modal-actions">
            <button class="dt-modal-cancel" onclick="closeModal()">Bekor qilish</button>
            <button class="dt-modal-confirm" id="confirmBtn" onclick="confirmPurchase()"><i class="bi bi-check-lg"></i> Sotib olish</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function(){
    const PID = {{ product_id }};
    const API = '/api/v1/coin';
    let product = null, userCoins = 0, commentPage = 1;

    function getCsrf() { let v='; '+document.cookie,p=v.split('; csrftoken='); if(p.length===2) return p.pop().split(';').shift(); }
    async function get(u) { const r=await fetch(u,{credentials:'same-origin'}); if(!r.ok) throw new Error(r.statusText); return r.json(); }
    async function post(u,b) {
        const r=await fetch(u,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':getCsrf()},body:JSON.stringify(b||{})});
        const d=await r.json(); if(!r.ok) throw d; return d;
    }

    function fmtDate(iso) { return new Date(iso).toLocaleDateString('uz-UZ',{day:'2-digit',month:'2-digit',year:'numeric'}); }
    function fmtTime(iso) { return new Date(iso).toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit',hour12:false}); }

    function toast(msg, type) {
        const t=document.createElement('div'); t.className='dt-toast '+type; t.innerHTML='<i class="bi bi-'+(type==='success'?'check-circle':'x-circle')+'"></i> '+msg;
        document.body.appendChild(t); setTimeout(()=>t.remove(),3000);
    }

    async function loadProduct() {
        try {
            const [p,s] = await Promise.all([get(API+'/products/'+PID+'/'), get(API+'/summary/')]);
            product = p; userCoins = s.total_coins;

            document.getElementById('dtImageWrap').innerHTML = `<img class="dt-img" src="${p.image}" alt="${p.name}">`;

            const outOfStock = p.stock<=0;
            const canAfford = userCoins >= p.coin_price;
            document.getElementById('dtInfo').innerHTML = `
                <h1 class="dt-title">${p.name}</h1>
                <p class="dt-desc">${p.description||''}</p>
                <div class="dt-meta">
                    <span class="dt-badge price"><i class="bi bi-coin"></i> ${p.coin_price} coin</span>
                    <span class="dt-badge ${outOfStock?'out':'stock'}"><i class="bi bi-${outOfStock?'x-circle':'box-seam'}"></i> ${outOfStock?'Tugagan':'Omborda: '+p.stock+' ta'}</span>
                    <span class="dt-badge balance"><i class="bi bi-wallet2"></i> Balans: ${userCoins}</span>
                </div>
                <div class="dt-stats">
                    <span class="dt-stat" id="dtLikeCount"><i class="bi bi-heart-fill" style="color:${p.is_liked?'#ef4444':''}"></i> ${p.likes_count} ta like</span>
                    <span class="dt-stat"><i class="bi bi-chat-fill"></i> ${p.comments_count} ta izoh</span>
                </div>
                <div class="dt-actions">
                    <button class="dt-like-btn ${p.is_liked?'liked':''}" id="dtLikeBtn" onclick="toggleLike()">
                        <i class="bi ${p.is_liked?'bi-heart-fill':'bi-heart'}"></i>
                    </button>
                    <button class="dt-purchase-btn" id="dtBuyBtn" ${outOfStock||!canAfford?'disabled':''} onclick="openModal()">
                        <i class="bi bi-cart-plus"></i> ${outOfStock?'Tugagan':!canAfford?'Coin yetarli emas':'Sotib olish'}
                    </button>
                </div>`;
        } catch(e) {
            document.getElementById('dtInfo').innerHTML = '<p style="color:var(--text-muted)">Mahsulot topilmadi</p>';
        }
    }

    async function loadComments(pg) {
        commentPage = pg||1;
        try {
            const d = await get(API+'/products/'+PID+'/comments/?page='+commentPage);
            const totalPages = Math.ceil(d.count/20);
            let h = `<h3 class="dt-comments-title"><i class="bi bi-chat-dots"></i> Izohlar (${d.count})</h3>
                <div class="dt-comment-form">
                    <textarea class="dt-comment-input" id="commentInput" placeholder="Izoh yozing..." rows="1"></textarea>
                    <button class="dt-comment-submit" onclick="addComment()"><i class="bi bi-send"></i> Yuborish</button>
                </div>
                <div class="dt-comment-list" id="commentList">`;
            if(!d.results.length) { h+='<p style="color:var(--text-muted);text-align:center;padding:1rem;">Hali izohlar yo\'q</p>'; }
            else {
                h += d.results.map(c => `<div class="dt-comment">
                    <div class="dt-comment-avatar">${(c.full_name||c.username||'?')[0].toUpperCase()}</div>
                    <div class="dt-comment-body">
                        <div class="dt-comment-header">
                            <span class="dt-comment-name">${c.full_name||c.username}</span>
                            <span class="dt-comment-date">${fmtDate(c.created_at)} ${fmtTime(c.created_at)}</span>
                        </div>
                        <p class="dt-comment-text">${c.content}</p>
                    </div>
                </div>`).join('');
            }
            h += '</div>';
            if(totalPages>1) {
                h += '<div class="mk-pagination" style="margin-top:1rem">';
                for(let n=1;n<=totalPages;n++) {
                    h += n===commentPage ? `<span class="mk-pg-active">${n}</span>` : `<a onclick="loadCommentPage(${n})">${n}</a>`;
                }
                h += '</div>';
            }
            document.getElementById('dtComments').innerHTML = h;
        } catch(e) {
            document.getElementById('dtComments').innerHTML = '<p style="color:var(--text-muted)">Izohlarni yuklab bo\'lmadi</p>';
        }
    }

    window.loadCommentPage = function(p) { loadComments(p); };

    window.toggleLike = async function() {
        try {
            const d = await post(API+'/products/'+PID+'/like/');
            const btn = document.getElementById('dtLikeBtn');
            const icon = btn.querySelector('i');
            if(d.liked) { btn.classList.add('liked'); icon.className='bi bi-heart-fill'; }
            else { btn.classList.remove('liked'); icon.className='bi bi-heart'; }
            document.getElementById('dtLikeCount').innerHTML = `<i class="bi bi-heart-fill" style="color:${d.liked?'#ef4444':''}"></i> ${d.likes_count} ta like`;
            const s = await get(API+'/summary/');
            userCoins = s.total_coins;
        } catch(e) { toast('Xatolik yuz berdi','error'); }
    };

    window.openModal = function() {
        if(!product) return;
        document.getElementById('modalInfo').innerHTML = `
            <div><span>Mahsulot:</span><span><b>${product.name}</b></span></div>
            <div><span>Narxi:</span><span><b>${product.coin_price} coin</b></span></div>
            <div><span>Balansingiz:</span><span>${userCoins} coin</span></div>
            <div class="dt-modal-total"><span>Qoldiq:</span><span>${userCoins-product.coin_price} coin</span></div>`;
        document.getElementById('purchaseModal').classList.add('show');
    };
    window.closeModal = function() { document.getElementById('purchaseModal').classList.remove('show'); };

    window.confirmPurchase = async function() {
        const btn = document.getElementById('confirmBtn');
        btn.disabled = true; btn.textContent = 'Kutiling...';
        try {
            await post(API+'/products/'+PID+'/purchase/');
            closeModal();
            toast("Muvaffaqiyatli sotib olindi! ✅",'success');
            loadProduct();
        } catch(e) {
            toast(e.error||'Xatolik yuz berdi','error');
        } finally { btn.disabled=false; btn.innerHTML='<i class="bi bi-check-lg"></i> Sotib olish'; }
    };

    window.addComment = async function() {
        const input = document.getElementById('commentInput');
        const content = input.value.trim();
        if(!content) return;
        try {
            await post(API+'/products/'+PID+'/comments/add/', {content});
            input.value = '';
            toast("Izoh qo'shildi",'success');
            loadComments(1);
        } catch(e) {
            toast(e.error||'Xatolik yuz berdi','error');
        }
    };

    loadProduct();
    loadComments(1);
})();
</script>
{% endblock %}
