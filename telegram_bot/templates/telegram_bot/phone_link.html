{% extends 'accounts/base.html' %}

{% block title %}Phone Link - IT Creative{% endblock %}

{% block content %}
<style>
:root {
    --pl-primary: #6366f1;
    --pl-primary-dark: #4f46e5;
    --pl-success: #22c55e;
    --pl-danger: #ef4444;
    --pl-bg: var(--bs-body-bg);
    --pl-card: var(--bs-body-bg);
    --pl-border: var(--bs-border-color);
    --pl-text: var(--bs-body-color);
    --pl-muted: var(--bs-secondary-color);
    --pl-shadow: 0 4px 24px rgba(0,0,0,0.06);
}
[data-bs-theme="dark"] {
    --pl-shadow: 0 4px 24px rgba(0,0,0,0.25);
}

.pl-page {
    max-width: 640px;
    margin: 0 auto;
    padding: 2rem 1rem 4rem;
}

.pl-hero {
    text-align: center;
    padding: 2.5rem 2rem;
    border-radius: 24px;
    background: linear-gradient(160deg, rgba(99,102,241,0.08) 0%, rgba(139,92,246,0.12) 50%, rgba(0,136,204,0.06) 100%);
    border: 1px solid rgba(99,102,241,0.12);
    margin-bottom: 2rem;
}
[data-bs-theme="dark"] .pl-hero {
    background: linear-gradient(160deg, rgba(99,102,241,0.12) 0%, rgba(139,92,246,0.16) 50%, rgba(0,136,204,0.08) 100%);
}

.pl-hero-icon {
    width: 80px;
    height: 80px;
    border-radius: 24px;
    background: linear-gradient(135deg, var(--pl-primary) 0%, #8b5cf6 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.25rem;
    font-size: 2.25rem;
    color: #fff;
    box-shadow: 0 8px 24px rgba(99,102,241,0.3);
}

.pl-hero h1 {
    font-size: 1.75rem;
    font-weight: 800;
    color: var(--pl-text);
    margin-bottom: 0.5rem;
}

.pl-hero p {
    color: var(--pl-muted);
    font-size: 1rem;
    max-width: 420px;
    margin: 0 auto;
    line-height: 1.6;
}

.pl-card {
    background: var(--pl-card);
    border: 1px solid var(--pl-border);
    border-radius: 20px;
    padding: 2rem;
    box-shadow: var(--pl-shadow);
    text-align: center;
}

.pl-video-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin: 0 auto 1.5rem;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 4/3;
}

.pl-video-wrap video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.pl-video-wrap canvas {
    display: none;
}

.pl-btn {
    padding: 0.875rem 2rem;
    border-radius: 14px;
    border: none;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin: 0.5rem;
}

.pl-btn-primary {
    background: linear-gradient(135deg, var(--pl-primary) 0%, #8b5cf6 100%);
    color: #fff;
    box-shadow: 0 6px 20px rgba(99,102,241,0.3);
}

.pl-btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(99,102,241,0.4);
}

.pl-btn-success {
    background: linear-gradient(135deg, var(--pl-success) 0%, #16a34a 100%);
    color: #fff;
    box-shadow: 0 6px 20px rgba(34,197,94,0.3);
}

.pl-btn-danger {
    background: linear-gradient(135deg, var(--pl-danger) 0%, #dc2626 100%);
    color: #fff;
    box-shadow: 0 6px 20px rgba(239,68,68,0.3);
}

.pl-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
}

.pl-status {
    padding: 0.75rem 1rem;
    border-radius: 12px;
    margin-top: 1rem;
    font-size: 0.9rem;
    font-weight: 500;
    display: none;
}

.pl-status-success {
    background: rgba(34,197,94,0.1);
    color: var(--pl-success);
    border: 1px solid rgba(34,197,94,0.2);
}

.pl-status-error {
    background: rgba(239,68,68,0.1);
    color: var(--pl-danger);
    border: 1px solid rgba(239,68,68,0.2);
}

.pl-status-info {
    background: rgba(99,102,241,0.1);
    color: var(--pl-primary);
    border: 1px solid rgba(99,102,241,0.2);
}

.pl-preview {
    display: none;
    margin: 1rem auto;
    max-width: 480px;
}

.pl-preview img {
    width: 100%;
    border-radius: 16px;
    border: 2px solid var(--pl-border);
}

.pl-permission-block {
    padding: 2rem;
}

.pl-permission-block i {
    font-size: 3rem;
    color: var(--pl-muted);
    margin-bottom: 1rem;
}

.pl-permission-block p {
    color: var(--pl-muted);
    margin-bottom: 1.5rem;
}

@media (max-width: 576px) {
    .pl-page { padding: 1rem 0.75rem 3rem; }
    .pl-hero { padding: 2rem 1.25rem; border-radius: 18px; }
    .pl-hero h1 { font-size: 1.4rem; }
    .pl-hero-icon { width: 64px; height: 64px; font-size: 1.75rem; border-radius: 18px; }
    .pl-card { padding: 1.25rem; border-radius: 16px; }
    .pl-btn { font-size: 0.95rem; padding: 0.75rem 1.5rem; }
}
</style>

<div class="pl-page">
    <div class="pl-hero">
        <div class="pl-hero-icon">
            <i class="bi bi-phone-fill"></i>
        </div>
        <h1>Phone Link</h1>
        <p>Kamerangizni yoqing va tasdiqlash uchun rasm oling</p>
    </div>

    <div class="pl-card">
        <!-- Kamera ruxsat so'rash -->
        <div id="permissionBlock" class="pl-permission-block">
            <i class="bi bi-camera-video"></i>
            <p>Davom etish uchun kamera ruxsatini bering</p>
            <button class="pl-btn pl-btn-primary" id="startCamera">
                <i class="bi bi-camera-video-fill"></i>
                Kamerani yoqish
            </button>
        </div>

        <!-- Video stream -->
        <div id="cameraBlock" style="display:none;">
            <div class="pl-video-wrap">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
            </div>
            <button class="pl-btn pl-btn-primary" id="captureBtn">
                <i class="bi bi-camera-fill"></i>
                Rasm olish
            </button>
        </div>

        <!-- Preview -->
        <div class="pl-preview" id="previewBlock">
            <img id="previewImg" src="" alt="Olingan rasm">
            <div style="margin-top:1rem;">
                <button class="pl-btn pl-btn-success" id="sendBtn">
                    <i class="bi bi-send-fill"></i>
                    Yuborish
                </button>
                <button class="pl-btn pl-btn-danger" id="retakeBtn">
                    <i class="bi bi-arrow-clockwise"></i>
                    Qayta olish
                </button>
            </div>
        </div>

        <div class="pl-status" id="statusMsg"></div>
    </div>
</div>

<script>
(function() {
    const startBtn = document.getElementById('startCamera');
    const permBlock = document.getElementById('permissionBlock');
    const cameraBlock = document.getElementById('cameraBlock');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('captureBtn');
    const previewBlock = document.getElementById('previewBlock');
    const previewImg = document.getElementById('previewImg');
    const sendBtn = document.getElementById('sendBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const statusMsg = document.getElementById('statusMsg');

    let stream = null;
    let imageData = null;

    function showStatus(msg, type) {
        statusMsg.textContent = msg;
        statusMsg.className = 'pl-status pl-status-' + type;
        statusMsg.style.display = 'block';
    }

    startBtn.addEventListener('click', async function() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } },
                audio: false
            });
            video.srcObject = stream;
            permBlock.style.display = 'none';
            cameraBlock.style.display = 'block';
            statusMsg.style.display = 'none';
        } catch (err) {
            showStatus('Kamera ruxsati berilmadi. Iltimos, brauzer sozlamalaridan ruxsat bering.', 'error');
        }
    });

    captureBtn.addEventListener('click', function() {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);
        imageData = canvas.toDataURL('image/jpeg', 0.85);
        previewImg.src = imageData;

        cameraBlock.style.display = 'none';
        previewBlock.style.display = 'block';
        statusMsg.style.display = 'none';
    });

    retakeBtn.addEventListener('click', function() {
        previewBlock.style.display = 'none';
        cameraBlock.style.display = 'block';
        imageData = null;
        statusMsg.style.display = 'none';
    });

    sendBtn.addEventListener('click', async function() {
        if (!imageData) return;

        sendBtn.disabled = true;
        sendBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Yuborilmoqda...';
        showStatus('Rasm yuborilmoqda...', 'info');

        try {
            const formData = new FormData();
            formData.append('image_data', imageData);

            const resp = await fetch('{% url "telegram_bot:phone_link" %}', {
                method: 'POST',
                body: formData,
            });

            const data = await resp.json();

            if (data.ok) {
                showStatus('✅ Rasm muvaffaqiyatli yuborildi!', 'success');
                // Kamerani to'xtatish
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                }
                sendBtn.style.display = 'none';
                retakeBtn.style.display = 'none';
            } else {
                showStatus('❌ Xatolik: ' + (data.error || 'Noma\'lum xatolik'), 'error');
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="bi bi-send-fill"></i> Yuborish';
            }
        } catch (e) {
            showStatus('❌ Tarmoq xatoligi yuz berdi', 'error');
            sendBtn.disabled = false;
            sendBtn.innerHTML = '<i class="bi bi-send-fill"></i> Yuborish';
        }
    });

    // Sahifa yopilganda kamerani to'xtatish
    window.addEventListener('beforeunload', function() {
        if (stream) {
            stream.getTracks().forEach(t => t.stop());
        }
    });
})();
</script>
{% endblock %}
