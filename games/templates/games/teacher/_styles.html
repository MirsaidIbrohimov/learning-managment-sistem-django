<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Yozish mashqi 2.0 — ustoz paneli (docs/design-proposals/typing/typing.html uslubida) */
.tc{--tc-field:rgba(15,23,42,.045);--tc-line:var(--bs-border-color);--tc-muted:var(--bs-secondary-color);--tc-acc:#0891b2;--tc-acc2:#7c3aed;--tc-gold:#b45309;--tc-lime:#16a34a;--tc-red:#e11d48;--tc-panel:var(--bs-body-bg);font-family:'Space Grotesk',system-ui,sans-serif}
[data-bs-theme=dark] .tc{--tc-field:rgba(255,255,255,.05);--tc-acc:#22d3ee;--tc-acc2:#a78bfa;--tc-gold:#fbbf24;--tc-lime:#a3e635;--tc-red:#fb7185}
.tc .mono{font-family:'JetBrains Mono',monospace}
.tc-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tc-head h1{font-size:1.6rem;font-weight:700;letter-spacing:-.03em;margin:0 auto 0 0;display:flex;align-items:center;gap:12px}
.tc-head h1 i{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;color:#fff;background:linear-gradient(135deg,var(--tc-acc),var(--tc-acc2));font-style:normal}
.tc-coin{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 6px;border-radius:999px;font:700 15px 'JetBrains Mono',monospace;color:var(--tc-gold);background:color-mix(in srgb,var(--tc-gold) 12%,transparent);border:1px solid color-mix(in srgb,var(--tc-gold) 30%,transparent)}
.tc-coin b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#fde68a,#f59e0b);color:#78350f;font-size:13px}
.tc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:14px;font-weight:700;font-size:.95rem;color:#fff;border:0;background:linear-gradient(100deg,var(--tc-acc),var(--tc-acc2));box-shadow:0 14px 34px -14px var(--tc-acc2);text-decoration:none;cursor:pointer}
.tc-btn:hover{color:#fff;filter:brightness(1.06)}
[data-bs-theme=dark] .tc-btn,[data-bs-theme=dark] .tc-btn:hover{color:#05060a}
.tc-btn.ghost{background:var(--tc-field);color:var(--bs-body-color);border:1px solid var(--tc-line);box-shadow:none}
.tc-btn.sm{padding:6px 11px;font-size:.8rem;border-radius:10px}
.tc-btn.danger{background:transparent;color:var(--tc-red);border:1px solid color-mix(in srgb,var(--tc-red) 35%,transparent);box-shadow:none}
.tc-btn:disabled{opacity:.45;cursor:not-allowed}
.tc-card{border-radius:24px;padding:22px;background:var(--tc-panel);border:1px solid var(--tc-line);box-shadow:0 24px 60px -34px rgba(15,23,42,.45)}
.tc-card h3{font-size:1.15rem;font-weight:700;letter-spacing:-.02em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.tc-note{font-size:.85rem;color:var(--tc-muted)}
.tc-pill{font:600 11.5px 'JetBrains Mono',monospace;padding:4px 10px;border-radius:999px;background:var(--tc-field);border:1px solid var(--tc-line);color:var(--tc-muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tc-pill.live{color:var(--tc-lime);border-color:color-mix(in srgb,var(--tc-lime) 40%,transparent)}
.tc-pill.live:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:tcBlink 1.2s infinite}
.tc-pill.hot{color:#fff;background:linear-gradient(100deg,#f59e0b,#db2777);border-color:transparent}
.tc-pill.off{color:var(--tc-red)}
@keyframes tcBlink{50%{opacity:.25}}
.tc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.tc-stat{border-radius:18px;padding:14px 16px;background:var(--tc-field);border:1px solid var(--tc-line)}
.tc-stat small{display:block;font:600 10.5px 'JetBrains Mono',monospace;letter-spacing:.1em;color:var(--tc-muted)}
.tc-stat b{font:700 1.6rem 'JetBrains Mono',monospace;letter-spacing:-.03em}
.tc-stat.gold b{color:var(--tc-gold)}
.tc-f{margin-bottom:14px}
.tc-f>label,.tc-lbl{display:block;font:600 11px 'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--tc-muted);margin-bottom:6px;text-transform:uppercase}
.tc-f input:not([type=checkbox]):not([type=radio]),.tc-f select{width:100%;height:46px;border-radius:13px;border:1px solid var(--tc-line);background:var(--tc-field);padding:0 14px;color:var(--bs-body-color);font:500 15px 'Space Grotesk',sans-serif;outline:none}
.tc-f input:focus,.tc-f select:focus{border-color:var(--tc-acc)}
.tc-prize{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tc-prize div{border-radius:16px;padding:12px;background:var(--tc-field);border:1px solid var(--tc-line);text-align:center;font-size:20px}
.tc-prize input{height:42px!important;text-align:center;font:700 17px 'JetBrains Mono',monospace!important;margin-top:6px}
.tc-ledger .r{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--tc-line);color:var(--tc-muted)}
.tc-ledger .r b{color:var(--bs-body-color);font-family:'JetBrains Mono',monospace}
.tc-ledger .r.minus b{color:var(--tc-red)}
.tc-ledger .after{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-weight:700}
.tc-ledger .after b{font:700 1.6rem 'JetBrains Mono',monospace;color:var(--tc-gold)}
.tc-ledger .after.bad b{color:var(--tc-red)}
.tc-warn{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:.88rem;background:color-mix(in srgb,var(--tc-gold) 12%,transparent);border:1px solid color-mix(in srgb,var(--tc-gold) 30%,transparent)}
.tc-warn.err{background:color-mix(in srgb,var(--tc-red) 12%,transparent);border-color:color-mix(in srgb,var(--tc-red) 35%,transparent)}
.tc-toggle{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--tc-field);border:1px solid var(--tc-line);margin-bottom:14px;cursor:pointer;user-select:none}
.tc-toggle input{display:none}
.tc-toggle .sw{margin-left:auto;width:50px;height:28px;border-radius:28px;background:var(--tc-line);position:relative;transition:.25s;flex:none}
.tc-toggle .sw:after{content:"";position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s}
.tc-toggle input:checked~.sw{background:var(--tc-lime)}
.tc-toggle input:checked~.sw:after{left:26px}
.tc-seg{display:flex;gap:4px;padding:4px;border-radius:13px;background:var(--tc-field);border:1px solid var(--tc-line)}
.tc-seg label{flex:1;text-align:center;padding:8px 10px;border-radius:9px;font-weight:600;font-size:.9rem;color:var(--tc-muted);cursor:pointer;margin:0}
.tc-seg input{display:none}
.tc-seg input:checked+span{color:var(--bs-body-color)}
.tc-seg label:has(input:checked){background:var(--bs-body-bg);box-shadow:0 4px 12px -8px rgba(0,0,0,.5);color:var(--bs-body-color)}
.tc-checks{max-height:260px;overflow:auto;display:grid;gap:6px;padding:4px}
.tc-check{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--tc-field);border:1px solid var(--tc-line);cursor:pointer;margin:0}
.tc-check small{margin-left:auto;color:var(--tc-muted);font-family:'JetBrains Mono',monospace}
.tc-list{display:grid;gap:12px}
.tc-comp{border-radius:20px;padding:16px 18px;background:var(--tc-panel);border:1px solid var(--tc-line);display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.tc-comp h4{font-size:1.05rem;font-weight:700;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tc-comp .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tc-comp .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.tc-comp form{margin:0}
.tc-empty{text-align:center;padding:48px 20px;border-radius:24px;border:1px dashed var(--tc-line);color:var(--tc-muted)}
.tc-empty i{font-size:2.6rem;display:block;margin-bottom:8px}
@media(max-width:900px){.tc-stats{grid-template-columns:repeat(2,1fr)}.tc-comp{grid-template-columns:1fr}.tc-comp .acts{justify-content:flex-start}}
</style>
