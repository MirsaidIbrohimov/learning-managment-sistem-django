{% extends 'accounts/admin/base_admin.html' %}

{% block title %}{{ title_page }} | Admin{% endblock %}

{% block admin_content %}
<style>
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

.form-header {
    animation: fadeInDown 0.5s ease-out;
}

.form-card {
    border: none;
    border-radius: 18px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
    animation: fadeInUp 0.6s ease-out 0.1s both;
}

[data-bs-theme="dark"] .form-card {
    background: #1e1e2e;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
}

.form-card .form-control,
.form-card .form-select {
    border-radius: 12px;
    transition: all 0.3s;
}

.form-card .form-control:focus,
.form-card .form-select:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
}

.form-card textarea.form-control {
    border-radius: 14px;
}

.btn-save {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none;
    color: white;
    border-radius: 12px;
    font-weight: 600;
    padding: 0.6rem 1.8rem;
    transition: all 0.3s;
}

.btn-save:hover {
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
}

.btn-back {
    border-radius: 12px;
    font-weight: 600;
    transition: all 0.3s;
}

.btn-back:hover {
    transform: translateX(-3px);
}

@media (max-width: 768px) {
    .form-header h2 { font-size: 1.2rem; }
    .form-header { flex-direction: column; gap: 0.75rem; align-items: flex-start !important; }
}
</style>

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 form-header flex-wrap gap-2">
        <h2 class="fw-bold mb-0"><i class="bi bi-controller text-primary"></i> {{ title_page }}</h2>
        <a href="{% url 'games:admin_games' %}" class="btn btn-outline-secondary btn-back">
            <i class="bi bi-arrow-left"></i> Orqaga
        </a>
    </div>

    <div class="card form-card">
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Nomi *</label>
                        <input type="text" name="title" class="form-control" value="{{ game.title|default:'' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Slug *</label>
                        <input type="text" name="slug" class="form-control" value="{{ game.slug|default:'' }}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold">Tavsif</label>
                        <textarea name="description" class="form-control" rows="3">{{ game.description|default:'' }}</textarea>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">O'yin turi</label>
                        <select name="game_type" class="form-select">
                            <option value="typing" {% if game.game_type == 'typing' %}selected{% endif %}>Typing Challenge</option>
                            <option value="quiz" {% if game.game_type == 'quiz' %}selected{% endif %}>Quiz</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Icon (Bootstrap Icons)</label>
                        <input type="text" name="icon" class="form-control" value="{{ game.icon|default:'bi-controller' }}" placeholder="bi-controller">
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <div class="form-check">
                            <input type="checkbox" name="is_active" class="form-check-input" id="isActive" 
                                {% if game.is_active or not game %}checked{% endif %}>
                            <label class="form-check-label fw-bold" for="isActive">Faol</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold">Sozlamalar (JSON)</label>
                        <textarea name="config" class="form-control font-monospace" rows="4" placeholder='{"mode": "word_by_word", "time_limit": 60}'>{% if game.config %}{{ game.config|safe }}{% endif %}</textarea>
                        <small class="text-muted">Typing: {"mode": "word_by_word", "time_limit": 60} | Quiz: {"shuffle": true}</small>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-save">
                        <i class="bi bi-check-lg"></i> Saqlash
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
