{% extends 'accounts/admin/base_admin.html' %}

{% block title %}{{ title_page }} | Admin{% endblock %}

{% block admin_content %}
<style>
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

.form-header { animation: fadeInDown 0.5s ease-out; }

.form-card {
    border: none;
    border-radius: 18px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
    animation: fadeInUp 0.6s ease-out 0.1s both;
}

[data-bs-theme="dark"] .form-card {
    background: #1e1e2e;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
}

.form-card .form-control,
.form-card .form-select {
    border-radius: 12px;
    transition: all 0.3s;
}

.form-card .form-control:focus,
.form-card .form-select:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
}

.coin-section {
    background: rgba(245, 158, 11, 0.05);
    border-radius: 14px;
    padding: 1.2rem;
    border: 1px solid rgba(245, 158, 11, 0.15);
    margin-top: 0.5rem;
}

[data-bs-theme="dark"] .coin-section {
    background: rgba(245, 158, 11, 0.08);
    border-color: rgba(245, 158, 11, 0.2);
}

.btn-save {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none;
    color: white;
    border-radius: 12px;
    font-weight: 600;
    padding: 0.6rem 1.8rem;
    transition: all 0.3s;
}

.btn-save:hover {
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
}

.btn-back {
    border-radius: 12px;
    font-weight: 600;
    transition: all 0.3s;
}

.btn-back:hover { transform: translateX(-3px); }

@media (max-width: 768px) {
    .form-header h2 { font-size: 1.2rem; }
    .form-header { flex-direction: column; gap: 0.75rem; align-items: flex-start !important; }
    .coin-section { padding: 1rem; }
}
</style>

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 form-header flex-wrap gap-2">
        <h2 class="fw-bold mb-0"><i class="bi bi-trophy text-warning"></i> {{ title_page }}</h2>
        <a href="{% url 'games:admin_competitions' %}" class="btn btn-outline-secondary btn-back">
            <i class="bi bi-arrow-left"></i> Orqaga
        </a>
    </div>

    <div class="card form-card">
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">O'yin *</label>
                        <select name="game" class="form-select" required>
                            <option value="">-- Tanlang --</option>
                            {% for g in games %}
                            <option value="{{ g.pk }}" {% if competition.game_id == g.pk %}selected{% endif %}>{{ g.title }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Nomi *</label>
                        <input type="text" name="title" class="form-control" value="{{ competition.title|default:'' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Boshlanish vaqti *</label>
                        <input type="datetime-local" name="start_time" class="form-control" 
                            value="{{ competition.start_time|date:'Y-m-d\TH:i'|default:'' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Tugash vaqti *</label>
                        <input type="datetime-local" name="end_time" class="form-control" 
                            value="{{ competition.end_time|date:'Y-m-d\TH:i'|default:'' }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Maksimal urinishlar</label>
                        <input type="number" name="max_attempts" class="form-control" value="{{ competition.max_attempts|default:1 }}" min="1">
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <div class="form-check">
                            <input type="checkbox" name="allow_retry" class="form-check-input" id="allowRetry"
                                {% if competition.allow_retry %}checked{% endif %}>
                            <label class="form-check-label fw-bold" for="allowRetry">Qayta urinishga ruxsat</label>
                        </div>
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <div class="form-check">
                            <input type="checkbox" name="is_active" class="form-check-input" id="isActive"
                                {% if competition.is_active or not competition %}checked{% endif %}>
                            <label class="form-check-label fw-bold" for="isActive">Faol</label>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="coin-section">
                            <h5 class="fw-bold mb-3"><i class="bi bi-coin text-warning"></i> Mukofot coinlari</h5>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">🥇 1-o'rin (coin)</label>
                                    <input type="number" name="coin_1st" class="form-control" value="{{ competition.coin_1st|default:0 }}" min="0">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">🥈 2-o'rin (coin)</label>
                                    <input type="number" name="coin_2nd" class="form-control" value="{{ competition.coin_2nd|default:0 }}" min="0">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">🥉 3-o'rin (coin)</label>
                                    <input type="number" name="coin_3rd" class="form-control" value="{{ competition.coin_3rd|default:0 }}" min="0">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-save">
                        <i class="bi bi-check-lg"></i> Saqlash
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
