{% extends 'accounts/admin/base_admin.html' %}

{% block title %}{{ title_page }} | Admin{% endblock %}

{% block admin_content %}
<style>
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

.form-header { animation: fadeInDown 0.5s ease-out; }

.form-card {
    border: none;
    border-radius: 18px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
    animation: fadeInUp 0.6s ease-out 0.1s both;
}

[data-bs-theme="dark"] .form-card {
    background: #1e1e2e;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
}

.form-card .form-control,
.form-card .form-select {
    border-radius: 12px;
    transition: all 0.3s;
}

.form-card .form-control:focus,
.form-card .form-select:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
}

.btn-save {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none;
    color: white;
    border-radius: 12px;
    font-weight: 600;
    padding: 0.6rem 1.8rem;
    transition: all 0.3s;
}

.btn-save:hover {
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
}

.btn-back {
    border-radius: 12px;
    font-weight: 600;
    transition: all 0.3s;
}

.btn-back:hover { transform: translateX(-3px); }

@media (max-width: 768px) {
    .form-header h2 { font-size: 1.2rem; }
    .form-header { flex-direction: column; gap: 0.75rem; align-items: flex-start !important; }
}
</style>

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 form-header flex-wrap gap-2">
        <h2 class="fw-bold mb-0"><i class="bi bi-card-text text-primary"></i> {{ title_page }}</h2>
        <a href="{% url 'games:admin_prompts' game.pk %}" class="btn btn-outline-secondary btn-back">
            <i class="bi bi-arrow-left"></i> Orqaga
        </a>
    </div>

    <div class="card form-card">
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-bold d-flex justify-content-between">
                            <span>Matn *</span>
                            <small class="text-muted fw-normal" id="textCounter">0 so'z · 0 belgi</small>
                        </label>
                        <textarea name="text" id="promptText" class="form-control" rows="5" required>{{ prompt.text|default:'' }}</textarea>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Qiyinlik</label>
                        <select name="difficulty" class="form-select">
                            <option value="easy" {% if prompt.difficulty == 'easy' %}selected{% endif %}>Oson</option>
                            <option value="medium" {% if prompt.difficulty == 'medium' or not prompt %}selected{% endif %}>O'rta</option>
                            <option value="hard" {% if prompt.difficulty == 'hard' %}selected{% endif %}>Qiyin</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Rejim</label>
                        <select name="usage" class="form-select">
                            <option value="practice" {% if prompt.usage == 'practice' or not prompt %}selected{% endif %}>Mashq</option>
                            <option value="competition" {% if prompt.usage == 'competition' %}selected{% endif %}>Musobaqa</option>
                            <option value="both" {% if prompt.usage == 'both' %}selected{% endif %}>Ikkalasi</option>
                        </select>
                        <small class="text-muted">Musobaqa matni mashqda chiqmaydi</small>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Tartib</label>
                        <input type="number" name="order" class="form-control" value="{{ prompt.order|default:0 }}">
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <div class="form-check">
                            <input type="checkbox" name="is_active" class="form-check-input" id="isActive"
                                {% if prompt.is_active or not prompt %}checked{% endif %}>
                            <label class="form-check-label fw-bold" for="isActive">Faol</label>
                        </div>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-save">
                        <i class="bi bi-check-lg"></i> Saqlash
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function() {
    var ta = document.getElementById('promptText');
    var counter = document.getElementById('textCounter');
    function update() {
        var text = ta.value.trim();
        var wordCount = text ? text.split(/\s+/).length : 0;
        counter.textContent = wordCount + " so'z · " + ta.value.length + ' belgi';
    }
    ta.addEventListener('input', update);
    update();
})();
</script>
{% endblock %}
