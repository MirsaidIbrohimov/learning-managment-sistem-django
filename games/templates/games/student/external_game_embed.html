{% extends 'accounts/base.html' %}
{% load static %}

{% block title %}{{ game.title }} | Öyinlar{% endblock %}

{% block extra_css %}
<style>
    /* Asosiy content paddingni olib taşlaymiz */
    #main-content, .main-content, main, .content-wrapper,
    .container, .container-fluid {
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
        width: 100% !important;
    }
    body { overflow: hidden !important; }

    /* Öyin sahifasi: footer, tölov banneri va boşqa eslatmalar öyin
       maydonini siqmasin — iframe navbardan pastdagi butun joyni egallaydi. */
    .site-footer,
    #studentPayBannerWrap,
    #main-content > .alert,
    #main-content > .container-xl:not(#game-iframe-wrap) { display: none !important; }

    #game-iframe-wrap {
        width: 100%;
        height: calc(100dvh - var(--navbar-h, 56px));
        position: relative;
        background: #0a0a0f;
    }

    #game-iframe-wrap iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
    }

    /* Floating back tugma — har doim körinadi */
    #float-back {
        position: fixed;
        bottom: 18px;
        left: 18px;
        z-index: 9999;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        background: rgba(10,10,20,0.82);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 12px;
        color: rgba(255,255,255,0.85);
        text-decoration: none;
        font-size: 0.83rem;
        font-weight: 700;
        box-shadow: 0 4px 18px rgba(0,0,0,0.4);
        transition: all 0.2s;
    }
    #float-back:hover {
        background: rgba(99,102,241,0.25);
        border-color: rgba(99,102,241,0.4);
        color: #fff;
        transform: translateY(-2px);
    }
    #float-back i { font-size: 0.9rem; }
</style>
{% endblock %}

{% block content %}
<div id="game-iframe-wrap">
    <a href="{% url 'games:games_list' %}" id="float-back">
        <i class="bi bi-arrow-left"></i> Orqaga
    </a>

    {% if launch_url|slice:":4" == "http" %}
    <iframe
        src="{{ launch_url }}"
        title="{{ game.title }}"
        allow="fullscreen; autoplay; clipboard-write"
        allowfullscreen
        referrerpolicy="no-referrer-when-downgrade"
        sandbox="allow-scripts allow-forms allow-popups allow-modals allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation">
    </iframe>
    {% else %}
    <iframe
        src="{{ launch_url }}"
        title="{{ game.title }}"
        allow="fullscreen; autoplay; clipboard-write; storage-access"
        allowfullscreen
        referrerpolicy="no-referrer-when-downgrade">
    </iframe>
    {% endif %}
</div>

<script>
    // Iframe balandligi: wrap'ning haqiqiy yuqori çeti (navbar, layout, banner
    // qanday bölişidan qat'i nazar) dan ekran pastigaça, pastki mobil menyu
    // bölsa uni hisobga olib.
    (function() {
        const wrap = document.getElementById('game-iframe-wrap');
        function fit() {
            const top = Math.max(0, wrap.getBoundingClientRect().top + window.scrollY);
            let bottom = 0;
            document.querySelectorAll('.nb-mobile-nav').forEach(function(el) {
                const r = el.getBoundingClientRect();
                const cs = getComputedStyle(el);
                // Faqat ekran pastiga yopişgan, haqiqatan körinib turgan menyu
                if (r.height && cs.display !== 'none' && cs.visibility !== 'hidden'
                        && r.top > window.innerHeight / 2 && r.top < window.innerHeight) {
                    bottom = Math.max(bottom, window.innerHeight - r.top);
                }
            });
            wrap.style.height = Math.max(320, window.innerHeight - top - bottom) + 'px';
        }
        fit();
        window.addEventListener('resize', fit);
        window.addEventListener('load', fit);
        setTimeout(fit, 300);
    })();

    // ===== Light/Dark theme bridge: LMS temasini iframe içidagi öyinga uzatadi =====
    (function() {
        const iframe = document.querySelector('#game-iframe-wrap iframe');
        if (!iframe) return;
        function lmsTheme() {
            return document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'dark' : 'light';
        }
        function send() {
            try { iframe.contentWindow.postMessage({ type: 'lms-theme', theme: lmsTheme() }, '*'); } catch (e) {}
        }
        iframe.addEventListener('load', function() { send(); setTimeout(send, 200); setTimeout(send, 600); });
        try {
            new MutationObserver(send).observe(document.documentElement, {
                attributes: true, attributeFilter: ['data-bs-theme']
            });
        } catch (e) {}
        window.addEventListener('message', function(e) {
            if (e && e.data && e.data.type === 'request-theme') send();
        });
    })();
</script>
{% endblock %}
