{% extends 'accounts/base.html' %}
{% load static %}

{% block title %}{{ game.title }} | O'yinlar{% endblock %}

{% block extra_css %}
<style>
    /* Asosiy content paddingni olib tashlaymiz */
    #main-content, .main-content, main, .content-wrapper,
    .container, .container-fluid {
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
        width: 100% !important;
    }
    body { overflow: hidden !important; }

    #game-iframe-wrap {
        width: 100%;
        height: calc(100vh - var(--navbar-h, 56px));
        position: relative;
        background: #0a0a0f;
    }

    #game-iframe-wrap iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
    }

    /* Floating back tugma — har doim ko'rinadi */
    #float-back {
        position: fixed;
        bottom: 18px;
        left: 18px;
        z-index: 9999;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        background: rgba(10,10,20,0.82);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 12px;
        color: rgba(255,255,255,0.85);
        text-decoration: none;
        font-size: 0.83rem;
        font-weight: 700;
        box-shadow: 0 4px 18px rgba(0,0,0,0.4);
        transition: all 0.2s;
    }
    #float-back:hover {
        background: rgba(99,102,241,0.25);
        border-color: rgba(99,102,241,0.4);
        color: #fff;
        transform: translateY(-2px);
    }
    #float-back i { font-size: 0.9rem; }
</style>
{% endblock %}

{% block content %}
<div id="game-iframe-wrap">
    <a href="{% url 'games:games_list' %}" id="float-back">
        <i class="bi bi-arrow-left"></i> Orqaga
    </a>

    {% if launch_url|slice:":4" == "http" %}
    <iframe
        src="{{ launch_url }}"
        title="{{ game.title }}"
        allow="fullscreen; autoplay; clipboard-write"
        allowfullscreen
        referrerpolicy="no-referrer-when-downgrade"
        sandbox="allow-scripts allow-forms allow-popups allow-modals allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation">
    </iframe>
    {% else %}
    <iframe
        src="{{ launch_url }}"
        title="{{ game.title }}"
        allow="fullscreen; autoplay; clipboard-write; storage-access"
        allowfullscreen
        referrerpolicy="no-referrer-when-downgrade">
    </iframe>
    {% endif %}
</div>

<script>
    (function() {
        const nav = document.querySelector('nav, .navbar, header');
        if (nav) {
            document.getElementById('game-iframe-wrap').style.height =
                'calc(100vh - ' + nav.offsetHeight + 'px)';
        }
    })();
</script>
{% endblock %}
