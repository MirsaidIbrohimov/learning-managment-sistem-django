{% if payment.state == 'ok' %}<span class="pp-badge ok"><i class="bi bi-check-circle-fill"></i> Tölangan</span>
{% elif payment.state == 'soon' %}<span class="pp-badge warn"><i class="bi bi-clock-fill"></i> Muddat yaqin</span>
{% elif payment.state == 'overdue' %}<span class="pp-badge bad"><i class="bi bi-exclamation-triangle-fill"></i> Muddati ötgan</span>
{% elif payment.state == 'blocked' %}<span class="pp-badge bad"><i class="bi bi-lock-fill"></i> Bloklangan</span>
{% elif payment.state == 'contract' %}<span class="pp-badge info"><i class="bi bi-file-earmark-text-fill"></i> Şartnoma</span>
{% else %}<span class="pp-badge mute"><i class="bi bi-dash-circle"></i> Ma’lumot yöq</span>{% endif %}
