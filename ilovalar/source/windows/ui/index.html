<!doctype html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ITC Academy</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/glass.css">
  <script src="js/boot.js"></script>
</head>
<body>
  <script src="js/brand-intro.js" data-mode="app"></script>
  <div id="titlebar" class="titlebar" data-tauri-drag-region>
    <div class="tb-brand" data-tauri-drag-region>
      <img src="assets/logo.png" alt="" class="tb-logo">
      <span data-tauri-drag-region>ITC Academy</span>
    </div>
    <div class="tb-nav">
      <button class="tb-ibtn" id="tb-side" type="button" data-tip="Yon panel (Ctrl+B)">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg>
      </button>
      <button class="tb-ibtn" id="tb-back" type="button" data-tip="Orqaga (Alt+←)" disabled>
        <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
      </button>
      <button class="tb-ibtn" id="tb-fwd" type="button" data-tip="Oldinga (Alt+→)" disabled>
        <svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>
    <div class="tb-center" data-tauri-drag-region>
      <button class="tb-search" id="tb-search" type="button">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Qidiruv va tezkor ötiş</span>
        <kbd>Ctrl K</kbd>
      </button>
    </div>
    <div class="tb-controls">
      <button class="tb-btn" id="tb-min" type="button" title="Kiçraytiriş">
        <svg viewBox="0 0 12 12"><path d="M1 6h10"/></svg>
      </button>
      <button class="tb-btn" id="tb-max" type="button" title="Kattalaştiriş">
        <svg viewBox="0 0 12 12" class="i-max"><rect x="1.5" y="1.5" width="9" height="9" rx="1.5"/></svg>
        <svg viewBox="0 0 12 12" class="i-restore"><rect x="1.5" y="3.5" width="7" height="7" rx="1.2"/><path d="M3.5 3.5V2.7c0-.7.5-1.2 1.2-1.2h4.6c.7 0 1.2.5 1.2 1.2v4.6c0 .7-.5 1.2-1.2 1.2h-.8"/></svg>
      </button>
      <button class="tb-btn tb-close" id="tb-close" type="button" title="Yopiş">
        <svg viewBox="0 0 12 12"><path d="m1.5 1.5 9 9m0-9-9 9"/></svg>
      </button>
    </div>
  </div>

  <div class="load-bar" aria-hidden="true"><i></i></div>
  <div id="root" class="root"></div>
  <div id="overlay-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="tip" class="tip" role="tooltip"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
