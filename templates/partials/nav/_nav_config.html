{% endcomment %}{% if user.is_authenticated %}<script>
  window.ITC_NAV = { saveUrl: "{% url 'save_navigation_preferences' %}", csrf: "{{ csrf_token }}", prefs: { layout: "{{ nav_prefs.layout }}", sidebar: "{{ nav_prefs.sidebar }}", theme: "{{ nav_prefs.theme }}", motion: {{ nav_prefs.motion|yesno:'true,false' }}, autosave: {{ nav_prefs.autosave|yesno:'true,false' }} }{% if nav_ctx == 'panel' %},

</script>
<script src="{% static 'js/nav-prefs.js' %}" defer></script>{% endif %}
