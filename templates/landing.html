{% load static %}
<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITC Academy — IT shaharcha | Dasturlash kurslari</title>
    <meta name="description" content="ITC Academy — zamonaviy IT va dasturlash o'quv markazi. Frontend, Backend, UI/UX, Mobile, AI yo'nalishlari. Suyunov Husan boshchiligida amaliy ta'lim." />
    <meta name="keywords" content="ITC Academy, dasturlash kurslari, IT kurslar, frontend, backend, UI/UX, mobil dasturlash, AI kursi, dasturlash o'rganish O'zbekiston" />
    <meta name="author" content="ITC Academy — Suyunov Husan" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://itc-academy.uz/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://itc-academy.uz/" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:site_name" content="ITC Academy" />
    <meta property="og:title" content="ITC Academy — Dasturlash kurslari" />
    <meta property="og:description" content="Zamonaviy IT o'quv markaz. Frontend, Backend, UI/UX, Mobile, AI kurslari." />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "ITC Academy",
      "url": "https://itc-academy.uz",
      "description": "Zamonaviy IT va dasturlash o'quv markazi",
      "founder": {
        "@type": "Person",
        "name": "Suyunov Husan"
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "UZ"
      }
    }
    </script>
    <link rel="icon" type="image/x-icon" href="{% static 'images/fav.ico' %}">
    <link rel="stylesheet" crossorigin href="{% static 'home/assets/index-BF5slwdD.css' %}">
  </head>

  <body>
    <div id="root"></div>

    <script>
      // Django URL larini React app ga uzatish
      window.__DJANGO_URLS__ = {
        login: "{% url 'login' %}",
        register: "{% url 'register' %}",
        ariza: "{% url 'ariza' %}",
        csrf: "{{ csrf_token }}",
      };
      window.__DJANGO_POSTS__ = [
        {% for post in posts %}
        {
          "id": {{ post.pk }},
          "title": "{{ post.title|escapejs }}",
          "excerpt": "{{ post.content|truncatewords:20|escapejs }}",
          "image": "{% if post.image %}{{ post.image.url }}{% endif %}",
          "tag": "{{ post.get_post_type_display|escapejs }}",
          "date": "{{ post.created_at|date:'d M, Y' }}",
          "url": "{% url 'blog:post_detail' post.pk %}"
        }{% if not forloop.last %},{% endif %}
        {% endfor %}
      ];
    </script>
    <script type="module" crossorigin src="{% static 'home/assets/index-CCeLlUPM.js' %}"></script>
  </body>
</html>
