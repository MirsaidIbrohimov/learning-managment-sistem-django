<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Aloqa yöq — ITC Academy</title>
<style>
  :root{color-scheme:light dark;--bg:#f5f6fb;--card:#fff;--ink:#14172b;--muted:#5b6478;--acc:#4f46e5}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#141a2e;--ink:#eef1f7;--muted:#9aa6bd;--acc:#818cf8}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:420px;width:100%;padding:32px 28px;border-radius:24px;background:var(--card);text-align:center;box-shadow:0 20px 50px -30px rgba(15,23,42,.45)}
  img{width:88px;height:88px;border-radius:22px}
  h1{margin:18px 0 6px;font-size:1.35rem}
  p{margin:0 0 22px;color:var(--muted)}
  button{height:46px;padding:0 22px;border:0;border-radius:14px;background:var(--acc);color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer}
  small{display:block;margin-top:18px;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<main>
  <img src="/static/pwa/icons/icon-192.png" alt="ITC Academy">
  <h1>Internet aloqasi yöq</h1>
  <p>Sahifani yuklab bölmadi. Aloqani tekşirib, qayta urinib köring.</p>
  <button type="button" id="retry">Qayta uriniş</button>
  <small>Xavfsizlik uçun şaxsiy ma’lumotlaringiz qurilmada saqlanmaydi.</small>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () { location.reload(); });
  addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
